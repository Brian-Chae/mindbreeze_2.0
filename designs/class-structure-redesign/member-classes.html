<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIND BREEZE · 회원 홈 · 내 클래스 시안</title>
<link rel="stylesheet" href="../class-player-redesign/tokens.css">
<link rel="stylesheet" href="flow-base.css">
<style>
/* 워커 2 전용 스타일 (.w- 접두어) — member-classes: MC01~MC07 */
body { background: #12081C; word-break: keep-all; overflow-wrap: break-word; }
h1, h2, h3, p, ol { margin: 0; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--mb-lavender); outline-offset: 2px; }
.ic.sm { width: 16px; height: 16px; flex: none; }
.ic.md { width: 20px; height: 20px; flex: none; }
.w-logo { width: 64px; height: 29px; fill: var(--mb-purple); flex: none; }
.w-logo.d { width: 56px; height: 26px; fill: var(--mb-pale); align-self: center; }

/* ───────── 셸 공통 ───────── */
.sh-side .w-logo { margin: 0 0 16px 16px; }
.w-nav { display: flex; flex-direction: column; gap: 8px; }
.w-nav a { display: flex; align-items: center; gap: 16px; min-height: 48px; padding: 0 16px; border-radius: var(--r-pill); font-size: var(--fs-15); font-weight: 600; color: var(--ink-mid); }
.w-nav a.on { background: var(--mb-purple-cream); color: var(--mb-purple); }
.w-me { margin-top: auto; display: flex; align-items: center; gap: 16px; padding: 8px 16px; font-size: var(--fs-15); font-weight: 600; color: var(--ink-mid); }
.w-me i { width: 40px; height: 40px; border-radius: 50%; background: var(--mb-purple-cream); color: var(--mb-purple); display: grid; place-items: center; }
.sh-tabbar > a.w-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: var(--fs-12); font-weight: 600; color: var(--ink-mid); }
.sh-tabbar > a.w-tab.on { color: var(--mb-purple); }
.sh-title { line-height: 1.3; }
.w-hbtn { width: var(--tap); height: var(--tap); border-radius: var(--r-pill); display: inline-grid; place-items: center; background: #fff; border: 1px solid var(--shell-line); color: var(--ink); position: relative; }
.w-hbtn .w-dot { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--mb-purple); border: 2px solid #fff; box-sizing: content-box; }
.w-head3 { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.w-htitle { font-size: var(--fs-18); font-weight: 700; text-align: center; }
.w-ph { display: block; width: 44px; height: 44px; }
.w-brand { width: 44px; height: 44px; border-radius: 50%; background: var(--mb-purple-cream); display: grid; place-items: center; }
.w-brand .w-logo { width: 28px; height: 13px; }
.w-col { width: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.w-foot { flex: none; padding: 16px 24px; background: var(--shell-bg); }
@media (max-width: 767px) { .w-foot { padding: 16px; } }
.w-sec { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-top: 8px; }
.w-sec h2 { font-size: var(--fs-15); font-weight: 700; }
.w-sec > span { font-size: var(--fs-13); color: var(--ink-mid); }
.w-sec a { display: inline-flex; align-items: center; justify-content: flex-end; gap: 8px; min-height: 44px; min-width: 44px; font-size: var(--fs-13); font-weight: 600; color: var(--mb-purple); }
.w-sec:first-child { margin-top: 0; }
.w-link { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 44px; border-radius: var(--r-pill); font-size: var(--fs-15); font-weight: 700; color: var(--mb-purple); background: transparent; }
.w-link.mute { color: var(--ink-mid); font-weight: 600; }
.sh-btn.danger { background: #B5482A; color: #fff; }
.sh-chip.dash { background: #F0ECF3; color: var(--ink-mid); border: 1px dashed #B5ABBE; }
.sh-chip.line { background: #fff; color: var(--mb-purple); border: 1px solid var(--mb-purple); }
.sh-chip { white-space: nowrap; }
.sh-chip .ic.sm { flex: none; }

/* ───────── 히어로 ───────── */
.w-hero .w-herobg { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 0; }
.sh-hero.w-hero::before { z-index: 1; }
.w-hero.off .w-herobg { filter: grayscale(1) brightness(0.8); }
.w-hc { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 16px; }
.w-hrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.w-htl { font-size: var(--fs-24); font-weight: 800; line-height: 1.3; }
.w-htl + .w-hmeta { margin-top: -8px; }
.w-hmeta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: var(--fs-15); color: var(--tx-mid); }
.w-hmeta > span { display: inline-flex; align-items: center; gap: 8px; }
.w-hchip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: var(--r-pill); font-size: var(--fs-13); font-weight: 600; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.24); color: var(--tx-hi); }
.w-hchip.live { background: var(--mb-purple); border-color: transparent; color: #fff; }
.w-hchip.ok { color: var(--ok); border-color: rgba(125,227,200,0.5); }
.w-hchip.off { border-style: dashed; color: var(--tx-mid); }
.w-hchip.warn { color: var(--warn); border: 1px dashed var(--warn); background: var(--warn-bg); }
.w-hbox { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border-radius: var(--r-card); background: var(--sheet-bg); border: 1px solid var(--sheet-border); }
.w-hbox .tx { min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
.w-hbox b { font-size: var(--fs-15); font-weight: 700; }
.w-hbox .s { font-size: var(--fs-13); color: var(--tx-mid); }
.w-hbox .ic { color: var(--mb-pale); flex: none; }
.w-hcta { min-height: 48px; width: 100%; border-radius: var(--r-pill); font-size: var(--fs-15); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #fff; color: var(--mb-purple); }
.w-hcta.line { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.7); }
.w-hcta[disabled] { background: rgba(255,255,255,0.18); color: var(--tx-mid); border: 1px solid var(--sheet-border); }
.w-hero .w-prog { color: var(--tx-hi); }
.w-hero .w-plab span:nth-child(2) { color: var(--tx-mid); }
.w-hero .w-seg i { background: rgba(255,255,255,0.28); }
.w-hero .w-seg i.d { background: #fff; }
.w-hero .w-seg i.c { background: var(--mb-pale); }
.w-hfact { display: flex; align-items: center; gap: 8px; font-size: var(--fs-15); color: var(--tx-hi); }

/* ───────── 진행 막대 · 카드 ───────── */
.w-prog { display: flex; flex-direction: column; gap: 8px; }
.w-plab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: var(--fs-15); font-weight: 600; }
.w-plab span:nth-child(2) { font-size: var(--fs-13); color: var(--ink-mid); font-weight: 600; }
.w-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; height: 8px; }
.w-seg i { display: block; border-radius: 8px; background: #E6DFEC; }
.w-seg i.d { background: var(--mb-purple); }
.w-seg i.c { background: var(--mb-lavender); }
.w-cc { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
.w-cclink { display: flex; flex-direction: column; gap: 8px; color: inherit; }
.w-ccrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.w-ccrow > .ic { color: var(--ink-lo); flex: none; }
.w-cchips { display: flex; flex-wrap: wrap; gap: 8px; }
.w-cctitle { font-size: var(--fs-18); font-weight: 700; line-height: 1.35; }
.w-ccmeta { display: flex; align-items: flex-start; gap: 8px; font-size: var(--fs-13); color: var(--ink-mid); line-height: 1.5; }
.w-ccmeta.pri { font-size: var(--fs-15); color: var(--ink); }
.w-cc .sh-btn { width: 100%; }
.w-cc.hl { border-color: var(--mb-purple); box-shadow: 0 0 0 1px var(--mb-purple); }
.w-ctype { font-size: var(--fs-13); font-weight: 600; color: var(--ink-mid); }
.w-fold { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 0 16px; width: 100%; text-align: left; font-size: var(--fs-15); font-weight: 700; }
.w-fold .l { display: flex; align-items: center; gap: 16px; }
.w-fold .l i { width: 40px; height: 40px; border-radius: 50%; background: #F0ECF3; color: var(--ink-mid); display: grid; place-items: center; flex: none; }
.w-fold .s { font-size: var(--fs-13); font-weight: 600; color: var(--ink-mid); }
.w-empty { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px; text-align: center; }
.w-eic { width: 48px; height: 48px; border-radius: 50%; background: var(--mb-purple-cream); color: var(--mb-purple); display: grid; place-items: center; }
.w-empty .tx { display: flex; flex-direction: column; gap: 0; }
.w-empty .tx b { font-size: var(--fs-15); }
.w-empty .tx .s { font-size: var(--fs-13); color: var(--ink-mid); line-height: 1.5; }
.w-empty .btns { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
.w-empty .btns .sh-btn { width: 100%; }
.w-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; min-height: 72px; }
.w-row .tx { min-width: 0; display: flex; flex-direction: column; gap: 0; }
.w-row b { font-size: var(--fs-15); font-weight: 700; }
.w-row .s { font-size: var(--fs-13); color: var(--ink-mid); line-height: 1.4; }
.w-row .l { display: flex; align-items: center; gap: 16px; min-width: 0; }
.w-row .l i { width: 40px; height: 40px; border-radius: 50%; background: var(--mb-purple-cream); color: var(--mb-purple); display: grid; place-items: center; flex: none; }
.w-row > .ic { color: var(--ink-lo); flex: none; }
.w-row.danger b { color: #B5482A; }
.w-row.danger .l i { background: #FBEAE3; color: #B5482A; }

/* 배너·안내 */
.w-ban { display: flex; gap: 16px; align-items: flex-start; padding: 16px; border-radius: var(--r-card); background: var(--mb-purple-cream); border: 1px solid #E6D7F5; color: var(--ink); }
.w-ban .ico { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--mb-purple); display: grid; place-items: center; flex: none; }
.w-ban .tx { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.w-ban b { font-size: var(--fs-15); font-weight: 700; line-height: 1.4; }
.w-ban .s { font-size: var(--fs-13); color: var(--ink-mid); line-height: 1.5; }
.w-ban.warn { background: #FBEAE3; border: 1px dashed #D58A6F; }
.w-ban.warn .ico { color: #8A3A1F; }
.w-ban.plain { background: #fff; border: 1px solid var(--shell-line); }
.w-next { display: flex; flex-direction: column; gap: 8px; }
.w-next .sh-btn { width: 100%; margin-top: 8px; }
.w-tag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-13); font-weight: 600; color: var(--mb-purple); }

/* ───────── 회차 타임라인 ───────── */
.w-tl { list-style: none; margin: 0; padding: 0; }
.w-trow { position: relative; display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--shell-line); }
.w-trow:first-child { padding-top: 0; }
.w-trow:last-child { border-bottom: 0; padding-bottom: 0; }
.w-tic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--mb-purple-cream); color: var(--mb-purple); }
.w-trow.att .w-tic { background: #E3F8F2; color: #0B6B55; }
.w-trow.abs .w-tic { background: #FBEAE3; color: #8A3A1F; }
.w-trow.before .w-tic, .w-trow.cx .w-tic, .w-trow.wd .w-tic, .w-trow.up .w-tic { background: #F0ECF3; color: var(--ink-mid); }
.w-trow.open .w-tic { background: var(--mb-purple); color: #fff; }
.w-trow.before .w-ttop b, .w-trow.wd .w-ttop b, .w-trow.cx .w-ttop b { color: var(--ink-mid); }
.w-tmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.w-ttop { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.w-ttop .tx { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.w-ttop b { font-size: var(--fs-15); font-weight: 700; line-height: 1.4; }
.w-ttop .s { font-size: var(--fs-13); color: var(--ink-mid); line-height: 1.4; }
.w-ttop .sh-chip { flex: none; }
.w-tact { display: flex; }
.w-tact .sh-btn { min-height: 44px; padding: 0 16px; font-size: var(--fs-13); }

/* ───────── 변화 이야기 ───────── */
.w-story { display: flex; flex-direction: column; gap: 16px; }
.w-story h2 { font-size: var(--fs-18); font-weight: 800; line-height: 1.4; }
.w-story p { font-size: var(--fs-15); line-height: 1.7; color: var(--ink); }
.w-story .note { font-size: var(--fs-13); color: var(--ink-mid); line-height: 1.5; }
.w-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.w-tile { background: #fff; border: 1px solid var(--shell-line); border-radius: var(--r-card); padding: 16px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.w-tile .ti { width: 40px; height: 40px; border-radius: 50%; background: var(--mb-purple-cream); color: var(--mb-purple); display: grid; place-items: center; flex: none; }
.w-tile .tt { display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 0; }
.w-tile b { font-size: var(--fs-24); font-weight: 800; line-height: 1.2; }
.w-tile .tt > span { font-size: var(--fs-15); color: var(--ink-mid); line-height: 1.3; }
@media (min-width: 640px) { .w-tile { flex-direction: row; justify-content: center; gap: 16px; padding: 16px; text-align: left; } .w-tile .tt { align-items: flex-start; } }
.w-mxcard { display: flex; flex-direction: column; gap: 16px; }
.w-mxcard h2 { font-size: var(--fs-15); font-weight: 700; }
.w-mxcard .sub { font-size: var(--fs-13); color: var(--ink-mid); line-height: 1.5; margin-top: -8px; }
.w-mx { display: grid; grid-template-columns: 56px repeat(var(--n), 1fr); gap: 8px; align-items: center; }
.w-mx > .lb { font-size: var(--fs-13); font-weight: 600; color: var(--ink-mid); }
.w-mx > .hd { font-size: var(--fs-13); font-weight: 600; color: var(--ink-mid); text-align: center; }
.w-mx > .gr { grid-column: 1 / -1; font-size: var(--fs-13); font-weight: 700; margin-top: 8px; }
.w-fc { height: 28px; border-radius: 8px; display: grid; place-items: center; }
.w-fc .ic { width: 16px; height: 16px; }
.w-fc.u { background: var(--mb-purple-cream); color: var(--mb-purple); }
.w-fc.s { background: #F0ECF3; color: var(--ink-mid); }
.w-fc.d { background: #E9F0FA; color: #2F5A8F; }
.w-fc.n { border: 1px dashed #CFC6D6; }
.w-fc.f { background: #FAF8FC; }
.w-fc.b { background: #F7F4F0; border: 1px dashed #D9D2DF; color: var(--ink-lo); }
.w-fc.a-att { background: #E3F8F2; color: #0B6B55; }
.w-fc.a-abs { background: #FBEAE3; color: #8A3A1F; }
.w-fc.a-mk { background: #fff; color: var(--mb-purple); border: 1.5px solid var(--mb-purple); }
.w-fc.mini { width: 24px; height: 24px; flex: none; }
.w-leg { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: var(--fs-13); color: var(--ink-mid); }
.w-leg span { display: inline-flex; align-items: center; gap: 8px; }
.w-cmp { display: grid; grid-template-columns: 64px 1fr 1fr; gap: 8px; align-items: center; }
.w-cmp > .hd { font-size: var(--fs-13); font-weight: 600; color: var(--ink-mid); }
.w-cmp > .lb { font-size: var(--fs-13); font-weight: 600; color: var(--ink-mid); }
.w-cmp > .v { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: var(--fs-13); font-weight: 600; }

/* ───────── 알림 ───────── */
.w-nt { display: flex; gap: 16px; padding: 16px; align-items: flex-start; min-height: 72px; }
.w-nt .ico { width: 40px; height: 40px; border-radius: 50%; background: var(--mb-purple-cream); color: var(--mb-purple); display: grid; place-items: center; flex: none; }
.w-nt .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0; }
.w-nt b { font-size: var(--fs-15); font-weight: 700; line-height: 1.4; }
.w-nt .s { font-size: var(--fs-13); color: var(--ink-mid); line-height: 1.5; }
.w-nt .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mb-purple); flex: none; margin-top: 8px; }
.w-nt.un { border-color: var(--mb-purple); }

/* ───────── 시트 ───────── */
.w-scrim { position: fixed; inset: 0; z-index: 30; background: rgba(12,6,20,0.55); display: flex; align-items: flex-end; justify-content: center; }
.w-sheet { width: min(100%, 640px); background: #fff; color: var(--ink); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 16px 24px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.w-sheet h2 { font-size: var(--fs-18); font-weight: 800; }
.w-sheet p { font-size: var(--fs-15); color: var(--ink-mid); line-height: 1.5; }
.w-sheet .hd { display: flex; flex-direction: column; gap: 8px; }
.w-grab { width: 48px; height: 8px; border-radius: 8px; background: #D9D2DF; align-self: center; }
.w-picks { display: flex; flex-direction: column; gap: 8px; }
.w-pick { display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 8px 16px; border-radius: var(--r-card); border: 1px solid var(--shell-line); background: #fff; text-align: left; width: 100%; }
.w-pick.on { border: 1.5px solid var(--mb-purple); background: var(--mb-purple-cream); }
.w-pick i.av { width: 40px; height: 40px; border-radius: 50%; background: var(--mb-purple-cream); color: var(--mb-purple); display: grid; place-items: center; flex: none; }
.w-pick.on i.av { background: #fff; }
.w-pick .tx { flex: 1; min-width: 0; }
.w-pick b { display: block; font-size: var(--fs-15); }
.w-pick .s { display: block; font-size: var(--fs-13); color: var(--ink-mid); }
.w-pick .ic.end { color: var(--ink-lo); }
.w-pick.on .ic.end { color: var(--mb-purple); }
.w-sheet .sh-btn { width: 100%; }
.w-sheet .sh-btn.ghost { background: transparent; color: var(--ink-mid); min-height: var(--tap); }

/* ───────── 몰입형 상태 카드 ───────── */
.w-imm { --col-w: 480px; }
.w-tc { display: flex; flex-direction: column; gap: 16px; }
.w-tc .fl-note { text-align: center; }
.w-ic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: rgba(210,174,252,0.18); color: var(--mb-pale); align-self: center; }
.w-ic.warn { background: var(--warn-bg); color: var(--warn); }
.w-ic .ic { width: 32px; height: 32px; }
.w-info { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--r-card); background: rgba(255,255,255,0.08); border: 1px solid var(--sheet-border); }
.w-info > div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-size: var(--fs-15); }
.w-info > div span { color: var(--tx-lo); font-size: var(--fs-13); flex: none; }
.w-info > div b { font-weight: 600; text-align: right; }

/* ───────── 개발자 인덱스 (?index=1) ───────── */
body.w-index { height: auto; overflow: auto; background: #fff; color: #1F1F1F; }
.w-idx { max-width: 1280px; margin: 0 auto; padding: 24px; font-family: var(--font); }
.w-idx h1 { font-size: 24px; margin-bottom: 8px; }
.w-idx p.l { font-size: 14px; color: #555; margin-bottom: 24px; line-height: 1.6; }
.w-idx table { width: 100%; border-collapse: collapse; font-size: 14px; }
.w-idx th, .w-idx td { border: 1px solid #E3DEE8; padding: 8px 16px; text-align: left; vertical-align: top; }
.w-idx th { background: #F5EDFC; }
.w-idx a { color: #5F0080; text-decoration: underline; }
</style>
</head>

var TOTAL = REG.reduce(function (a, s) { return a + s.cases.length; }, 0);

var q = new URLSearchParams(location.search);
var root = document.getElementById('root');
if (q.get('index')) {
  document.body.className = 'w-index';
  var rows = REG.map(function (s) {
    return s.cases.map(function (c, i) {
      return '<tr>' + (i === 0 ? '<td rowspan="' + s.cases.length + '"><b>' + s.id + '</b><br>' + s.name + '<br>' + s.kind + '</td>' : '') +
        '<td><a href="?screen=' + s.id + '&case=' + c.k + '">' + c.k + '</a></td><td>' + c.d + '</td><td>' + c.a + '</td></tr>';
    }).join('');
  }).join('');
  root.innerHTML = '<div class="w-idx"><h1>회원 홈 · 내 클래스 시안 · 화면·케이스 인덱스</h1><p class="l">?screen=MC01&amp;case=class-open 형태로 화면을 고릅니다. 파라미터가 없으면 MC01 첫 케이스. 4개 뷰포트: 390x844 · 834x1194 · 1194x834 · 1280x720.<br>' +
    '화면 ' + REG.length + '개 · 케이스 총 <b>' + TOTAL + '</b>개 · 입장 흐름(FM04~FM10)과 내 상담 화면은 만들지 않고 CTA 연결만 표기합니다. `연결` 로 표기한 버튼(입장·리포트·내 상담 등)은 다른 시안 또는 구현된 화면으로 이어지며 이 파일에서는 눌러도 이동하지 않습니다.</p>' +
    '<table><thead><tr><th>화면</th><th>케이스</th><th>설명</th><th>가정</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  document.title = '인덱스 · member-classes';
} else {
  var sid = q.get('screen') || 'MC01';
  var scr = REG.filter(function (s) { return s.id === sid; })[0] || REG[0];
  var cs = q.get('case');
  var ck = scr.cases.filter(function (c) { return c.k === cs; })[0] || scr.cases[0];
  root.innerHTML = scr.fn(ck.k);
  root.firstChild.setAttribute('data-screen', scr.id);
  root.firstChild.setAttribute('data-case', ck.k);
  document.title = scr.id + ' · ' + ck.k + ' · member-classes';
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go]');
    if (!t) return;
    e.preventDefault();
    var p = t.getAttribute('data-go').split(':');
    location.search = '?screen=' + p[0] + '&case=' + p[1];
  });
}
window.__REG = REG.map(function (s) { return { id: s.id, cases: s.cases.map(function (c) { return c.k; }) }; });
window.__ready = true;
})();
