    (extra || '') + '</div>';

const ST = {
  ing: ['ok', 'circle-check', '진행 중'], wait: ['', 'mail', '초대 대기'], live: ['live', 'play', '상담 중'], closed: ['mute', 'check', '마무리'],

function indexPage() {
  document.body.className = 'w-index';
  const total = INDEX.reduce((a, s) => a + s.cases.length, 0);
  const rows = (role) => INDEX.filter((s) => s.role === role).map((s) => '<tr><td><b>' + s.id + '</b><br>' + s.name + '</td><td>' + s.type + '</td><td>' + s.cases.map((c) => '<a href="?role=' + role + '&screen=' + s.id + '&case=' + c[0] + '">' + c[0] + '</a><span class="gl"> ' + c[1] + '</span><br>').join('') + '</td><td>' + s.assume + '</td><td>' + s.link + '</td></tr>').join('');

  return '<h1>상담 영역 시안 (CN01~CN16) · 화면·케이스 인덱스</h1><p>상담사 웹·앱 ' + INDEX.filter((s) => s.role === 'host').length + '종, 회원·가입 없이 내담자 ' + INDEX.filter((s) => s.role === 'member').length + '종 · 총 화면 ' + INDEX.length + '종 · 케이스 총 ' + total + '개. ?role=host 또는 ?role=member 로 첫 화면을 고르고, ?screen=화면ID&amp;case=케이스 로 열어요. 입장 전·진행 화면은 기존 시안을 다시 쓰고 연결 열에 표기했어요. D-번호는 결정-필요.md 의 항목이에요.</p>' +

}

/* ───────── 라우팅·이벤트 ───────── */
const FN = { CN01: cn01, CN02: (c) => cn02(c), CN03a: cn03a, CN03b: cn03b, CN03r: cn03r, CN03c: cn03c, CN03d: cn03d, CN04: cn04, CN05: cn05, CN06: cn06, CN07: cn07, CN08: (c) => cn08(c), CN09: cn09, CN10: cn10, CN11: cn11, CN12: cn12, CN13: cn13, CN14: cn14, CN15: cn15, CN16: cn16 };
const ROLE = Q.get('role');
const SCREEN = Q.get('screen') || (ROLE === 'member' ? 'CN07' : 'CN01');
const DEF = INDEX.filter((s) => s.id === SCREEN)[0];
const CASE = Q.get('case') || (DEF ? DEF.first : 'active');
function view() {
  if (Q.get('index')) return indexPage();
  const f = FN[SCREEN] || cn01;
  return f(CASE);
}
function render() { document.getElementById('root').innerHTML = view(); }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go]');
  if (t) {
    const g = t.getAttribute('data-go');
    if (g.indexOf('.html') >= 0) { location.href = g; return; }
    const p = g.split('|');
    const d = INDEX.filter((s) => s.id === p[0])[0];
    location.search = '?role=' + (d ? d.role : 'host') + '&screen=' + p[0] + '&case=' + p[1];
    return;
  }
  const sw = e.target.closest('[role="switch"], [role="checkbox"]');
  if (sw) { sw.setAttribute('aria-checked', sw.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); }
});
render();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { window.__ready = true; });
