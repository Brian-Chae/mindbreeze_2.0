<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIND BREEZE · 상담사·지도사 명상 클래스 시안 (CH01~CH30)</title>
<link rel="stylesheet" href="../class-player-redesign/tokens.css">
<link rel="stylesheet" href="flow-base.css">
<style>
/* ───────── host-a 전용 (.w- 접두어) ───────── */
.ic.s16 { width: 16px; height: 16px; }
.ic.s20 { width: 20px; height: 20px; }
.w-logo { fill: currentColor; stroke: none; }
h1, h2, h3, p { margin: 0; }
input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--mb-pale); outline-offset: 2px; }
.w-tight { white-space: nowrap; }

/* ── 셸 공통 ── */
.w-shell { position: relative; }
.sh-main { position: relative; }
.w-brand { display: flex; align-items: center; gap: 8px; padding: 8px 16px 24px; color: var(--mb-purple); font-weight: 800; font-size: var(--fs-18); }
.w-brand svg { width: 40px; height: 18px; flex: none; }
.w-nav { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
.w-nav button { display: flex; align-items: center; gap: 16px; min-height: 48px; padding: 0 16px; border-radius: var(--r-pill); font-size: var(--fs-15); font-weight: 600; color: var(--ink); text-align: left; }
.w-nav button.on { background: var(--mb-purple-cream); color: var(--mb-purple); }
.w-me { border-radius: var(--r-card); background: var(--mb-purple-cream); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.w-me b { font-size: var(--fs-15); } .w-me span { font-size: var(--fs-13); color: var(--ink-mid); }
.w-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 0; align-self: stretch; font-size: var(--fs-12); color: var(--ink-mid); }
.w-tab.on { color: var(--mb-purple); font-weight: 700; }
.w-headl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.w-backbtn { width: 44px; height: 44px; border-radius: var(--r-pill); display: inline-grid; place-items: center; background: #fff; border: 1px solid var(--shell-line); color: var(--ink); flex: none; }
.w-page { width: min(100%, 640px); margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.w-page.fill { flex: 1; min-height: 0; }
.sh-scroll.w-hold { overflow: hidden; }
.w-sec { font-size: var(--fs-13); font-weight: 700; color: var(--ink-mid); padding: 8px 8px 0; }
.sh-head .sh-btn { min-height: 48px; }
.w-headrow { flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; }

/* ── FH01 상단 고정 카드 ── */
.w-live { display: grid; gap: 16px; padding: 16px; flex: none; }
.w-live.sh-card { padding: 16px; border-radius: var(--r-sheet); }
@media (min-width: 768px) {
  .w-live { padding: 24px; grid-template-columns: minmax(0, 1fr) 208px; align-items: center; gap: 24px; }
  .w-live.sh-card { padding: 24px; }
}
.w-live-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.w-live-title { font-size: var(--fs-24); line-height: 32px; font-weight: 800; }
.w-line { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.w-dim { font-size: var(--fs-13); color: var(--tx-mid); }
.w-dim2 { font-size: var(--fs-13); color: var(--ink-mid); }
.w-start { justify-content: flex-start; }
.w-wait { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-15); font-weight: 600; }
.w-live-act { display: flex; flex-direction: column; gap: 8px; }
.w-live-act .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (min-width: 768px) { .w-live-act .row2 { grid-template-columns: 1fr; } }
.w-dline { border: 1px solid var(--warn); color: var(--warn); background: rgba(232,180,160,0.08); }
.w-live-act .fl-btn { white-space: nowrap; }
.sh-card .w-live-title { color: var(--ink); }

/* ── FH01 목록 ── */
.w-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: none; }
.w-tabs button { min-height: 44px; border-radius: var(--r-pill); background: #fff; border: 1px solid var(--shell-line); font-size: var(--fs-15); font-weight: 600; color: var(--ink-mid); }
.w-tabs button.on { background: var(--mb-purple); border-color: var(--mb-purple); color: #fff; }
.w-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
.w-item { display: flex; align-items: center; gap: 8px; background: var(--shell-card); border: 1px solid var(--shell-line); border-radius: var(--r-card); padding-right: 16px; flex: none; }
.w-item-main { flex: 1; min-width: 0; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px; align-items: center; padding: 16px; min-height: 72px; text-align: left; }
.w-ico { width: 44px; height: 44px; border-radius: var(--r-pill); background: var(--mb-purple-cream); color: var(--mb-purple); display: grid; place-items: center; }
.w-tt { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.w-tt b { font-size: var(--fs-15); font-weight: 700; color: var(--ink); }
.w-sb { font-size: var(--fs-13); color: var(--ink-mid); margin-top: 8px; line-height: 1.5; }
.w-mini { display: none; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-pill); background: var(--mb-purple-cream); color: var(--mb-purple); font-size: var(--fs-13); font-weight: 700; white-space: nowrap; flex: none; }
@media (min-width: 768px) { .w-mini { display: inline-flex; } }
.w-empty { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.w-empty .sh-card { width: min(100%, 480px); display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 32px 24px; }
.w-empty h2 { font-size: var(--fs-18); font-weight: 700; }
.w-empty p { font-size: var(--fs-15); color: var(--ink-mid); line-height: 1.5; }
.w-bigico { width: 64px; height: 64px; border-radius: var(--r-pill); background: var(--mb-purple-cream); color: var(--mb-purple); display: grid; place-items: center; }

/* ── FH04 상세 ── */
.w-next { background: rgba(255,255,255,0.12); border: 1px solid var(--sheet-border); border-radius: var(--r-card); padding: 16px; display: flex; gap: 16px; align-items: flex-start; }
.w-next .tx { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.w-next .tx b { font-size: var(--fs-15); font-weight: 700; line-height: 1.4; }
.w-next .tx span { font-size: var(--fs-13); color: var(--tx-mid); line-height: 1.5; }
.w-next .ic { flex: none; margin-top: 0; }
.w-detail-hero { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
@media (min-width: 768px) { .w-detail-hero { padding: 24px; } }
.w-kv { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; align-items: center; min-height: 56px; border-top: 1px solid var(--shell-line); }
.w-kv:first-child { border-top: 0; }
.w-kv .k { font-size: var(--fs-13); color: var(--ink-mid); font-weight: 600; }
.w-kv .v { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: var(--fs-15); min-width: 0; }
.w-kv .v.w-wrapv { flex-wrap: wrap; justify-content: flex-start; }
.w-kv .v > span:first-child { min-width: 0; line-height: 1.5; }
.w-smbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-pill); background: var(--mb-purple-cream); color: var(--mb-purple); font-size: var(--fs-13); font-weight: 700; white-space: nowrap; flex: none; }
.w-smbtn.line { background: transparent; border: 1.5px solid var(--mb-purple); }
.w-smbtn[disabled] { opacity: 0.4; }
.w-cancelrow { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; width: 100%; border-top: 1px solid var(--shell-line); color: #8A3A1F; font-size: var(--fs-15); font-weight: 700; }
.w-phead { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; margin-bottom: 8px; }
.w-phead h3 { font-size: var(--fs-18); font-weight: 700; }
.w-p { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; padding: 8px 0; gap: 16px; align-items: center; min-height: 64px; border-top: 1px solid var(--shell-line); }
.w-p .av { width: 40px; height: 40px; border-radius: var(--r-pill); background: var(--mb-purple-cream); color: var(--mb-purple); font-weight: 700; display: grid; place-items: center; }
.w-p .nm { font-size: var(--fs-15); font-weight: 700; }
.w-p .st { margin-top: 8px; display: flex; }
.w-p .rt { display: flex; align-items: center; gap: 8px; }
.w-xbtn { width: 44px; height: 44px; border-radius: var(--r-pill); display: inline-grid; place-items: center; color: var(--ink-mid); }
.w-note { display: flex; align-items: flex-start; gap: 8px; font-size: var(--fs-13); line-height: 1.5; }
.w-note .ic { flex: none; }
.w-note.ok { color: var(--ok); } .w-note.warn { color: var(--warn); }

/* ── 몰입형 마법사 ── */
.w-wiz .fl-top-title { font-size: var(--fs-15); }
.w-wiz .fl-label { line-height: 20px; }
.w-wiz .fl-steps { flex: none; }
.w-card { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
@media (min-width: 600px) { .w-card { padding: 24px; } }
.w-form { display: flex; flex-direction: column; gap: 16px; }
.w-group { display: flex; flex-direction: column; gap: 8px; }
.w-info { display: flex; align-items: flex-start; gap: 8px; font-size: var(--fs-13); line-height: 20px; color: var(--tx-mid); }
.w-info .ic { flex: none; }
.w-info.w-solo { flex-direction: column; align-items: center; text-align: center; }
.fl-seg.w-flex > button { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 8px; min-width: 0; white-space: nowrap; }
.fl-seg.w-flex > button.on { border-color: var(--mb-lavender); }
.fl-seg.w-types { grid-auto-flow: row; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.fl-seg.w-c4 { grid-auto-flow: row; grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 699px) { .fl-seg.w-types { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.w-inwrap { position: relative; }
.w-inwrap > .ic { position: absolute; left: 16px; top: 16px; color: var(--tx-mid); pointer-events: none; }
.w-inwrap > .fl-input { padding-left: 48px; }
.w-tog { width: 100%; text-align: left; min-height: 64px; }
.w-tog .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.w-tog .tx b { font-size: var(--fs-15); font-weight: 700; }
.w-tog .tx span { font-size: var(--fs-13); color: var(--tx-mid); }
.w-tog .sw { width: 48px; height: 28px; border-radius: var(--r-pill); background: rgba(255,255,255,0.24); position: relative; flex: none; }
.w-tog .sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
.w-tog[aria-checked="true"] .sw { background: var(--mb-lavender); }
.w-tog[aria-checked="true"] .sw::after { left: 24px; }
.w-tog[disabled] { opacity: 0.4; }
.w-static { min-height: 64px; border-style: dashed; }
.w-static .tx { flex: 1; font-size: var(--fs-13); color: var(--tx-mid); line-height: 1.5; }
.w-when3 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.w-when3 > .w-group:first-child { grid-column: 1 / -1; }
@media (min-width: 700px) { .w-when3 { grid-template-columns: 1.8fr 1fr 1fr; } .w-when3 > .w-group:first-child { grid-column: auto; } }
.w-stepper.sm { grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 0; padding: 0; }
.w-durrow { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 700px) { .w-durrow { grid-template-columns: 216px 1fr; gap: 16px; } }
.fl-seg.w-c5 { grid-auto-flow: row; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.w-2col { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 700px) { .w-2col { grid-template-columns: 1fr 1fr; } }
.w-stepper { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; min-height: 56px; padding: 0 8px; border-radius: var(--r-card); background: rgba(255,255,255,0.08); border: 1px solid var(--sheet-border); }
.w-stepper b { text-align: center; font-size: var(--fs-15); font-weight: 700; white-space: nowrap; }
.w-stepper button { width: 44px; height: 44px; border-radius: var(--r-pill); display: grid; place-items: center; background: rgba(255,255,255,0.1); }
.w-stepper button[disabled] { opacity: 0.4; }
.w-nav2 { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.w-wiz .fl-body.w-fill .fl-col { flex: 1; min-height: 0; max-height: 640px; }
.w-wiz .w-fill .w-card { flex: 1; min-height: 0; }
.w-pchips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; align-items: center; }
.w-pchips .hint { font-size: var(--fs-13); color: var(--tx-lo); }
.w-pchip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-pill); background: var(--mb-purple); border: 1px solid var(--mb-lavender); font-size: var(--fs-15); font-weight: 600; }
.w-count { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; }
.w-count span { font-size: var(--fs-13); color: var(--tx-mid); }
.w-count b { color: var(--tx-hi); font-size: var(--fs-15); }
.w-count .fl-btn { min-height: 44px; padding: 0 16px; font-size: var(--fs-13); }
.w-plist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.w-prow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 32px; gap: 16px; align-items: center; min-height: 64px; padding: 8px 16px; border-radius: var(--r-card); background: rgba(255,255,255,0.08); border: 1px solid var(--sheet-border); width: 100%; text-align: left; flex: none; }
.w-prow[disabled] { opacity: 0.4; }
.w-prow .av { width: 40px; height: 40px; border-radius: var(--r-pill); background: rgba(255,255,255,0.14); font-weight: 700; display: grid; place-items: center; }
.w-prow .nm { font-size: var(--fs-15); font-weight: 700; }
.w-prow .em { font-size: var(--fs-13); color: var(--tx-mid); margin-top: 8px; }
.w-prow .ck { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--sheet-border); display: grid; place-items: center; }
.w-prow.on { border-color: var(--mb-lavender); }
.w-prow.on .ck { background: var(--mb-purple); border-color: var(--mb-lavender); }
.w-prow:not(.on) .ck .ic { display: none; }
.w-prow .ck .ic { width: 20px; height: 20px; }
.w-sumrow .tx { flex: 1; min-width: 0; font-size: var(--fs-15); line-height: 1.5; padding: 8px 0; }
.w-sumrow > .ic { flex: none; color: var(--mb-pale); }
.w-edit { width: 44px; height: 44px; border-radius: var(--r-pill); display: grid; place-items: center; flex: none; color: var(--tx-mid); }

/* ── FH03 완료 ── */
.w-ok { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(125,227,200,0.16); border: 1px solid rgba(125,227,200,0.5); color: var(--ok); align-self: center; }
.w-invcard { gap: 16px; }
.w-inv { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 16px; align-items: center; min-height: 64px; padding: 8px 16px; border-radius: var(--r-card); background: rgba(255,255,255,0.08); border: 1px solid var(--sheet-border); }
.w-inv.fail { border: 1px dashed var(--warn); background: var(--warn-bg); }
.w-inv .av { width: 40px; height: 40px; border-radius: var(--r-pill); background: rgba(255,255,255,0.14); font-weight: 700; display: grid; place-items: center; }
.w-inv .nm { font-size: var(--fs-15); font-weight: 700; }
.w-inv .st { margin-top: 8px; display: flex; }
.w-inv .fl-btn { min-height: 44px; padding: 0 16px; font-size: var(--fs-13); white-space: nowrap; }
.w-invcard .fl-h2 { text-align: center; }
.w-invlist { display: flex; flex-direction: column; gap: 8px; }
.w-ghostrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.w-ghostrow .fl-btn { padding: 0 8px; font-size: var(--fs-13); white-space: nowrap; }
.w-center { text-align: center; align-items: center; }


/* ── R5 추가 (정원·이메일·입장 코드) ── */
.w-static .w-two { display: flex; flex-direction: column; gap: 8px; }
.w-static .w-two b { font-size: var(--fs-15); font-weight: 700; color: var(--tx-hi); }
.w-emailin { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.w-emailin .fl-btn { min-height: 52px; }
.w-erow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 44px; gap: 16px; align-items: center; min-height: 64px; padding: 8px 8px 8px 16px; border-radius: var(--r-card); background: rgba(255,255,255,0.08); border: 1px solid var(--sheet-border); flex: none; }
.w-erow .av { width: 40px; height: 40px; border-radius: var(--r-pill); background: rgba(255,255,255,0.14); display: grid; place-items: center; }
.w-erow .em { font-size: var(--fs-15); font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.w-codecard { gap: 8px; flex: none; }
.w-coderow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.w-codebig { font-size: 40px; line-height: 48px; font-weight: 800; letter-spacing: 8px; font-variant-numeric: tabular-nums; }
.w-codecard .w-note { color: var(--tx-mid); }
.w-codeval { font-size: var(--fs-18); font-weight: 800; letter-spacing: 8px; font-variant-numeric: tabular-nums; }
.w-inv .sub { margin-top: 8px; font-size: var(--fs-13); color: var(--tx-mid); line-height: 1.5; }
.w-inv .sub.bad { color: var(--warn); }
.w-inv .av svg { width: 20px; height: 20px; }
.w-wiz .w-fill .w-codecard { flex: none; }
.w-wiz .w-fill .w-invcard { flex: 1; min-height: 0; }

/* ── 시트 (몰입형·셸형 공용, 다크 소프트) ── */
.w-scrim { position: absolute; inset: 0; z-index: 20; background: rgba(12, 6, 20, 0.55); display: flex; align-items: flex-end; justify-content: center; color: var(--tx-hi); }
.w-sheet { width: min(100%, 640px); background: rgba(24, 12, 36, 0.97); border: 1px solid var(--sheet-border); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.w-shead { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.w-shead h2 { font-size: var(--fs-18); font-weight: 700; }
.w-x { width: 44px; height: 44px; border-radius: var(--r-pill); display: grid; place-items: center; background: rgba(255,255,255,0.1); flex: none; }
.w-sbody { display: flex; flex-direction: column; gap: 16px; }
.w-sbody p { font-size: var(--fs-15); line-height: 1.5; color: var(--tx-mid); }
.w-sico { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--warn-bg); color: var(--warn); border: 1px dashed var(--warn); }
.w-sfoot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.w-menu { display: flex; flex-direction: column; gap: 8px; }
.w-menu button { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 0 16px; border-radius: var(--r-card); background: rgba(255,255,255,0.08); border: 1px solid var(--sheet-border); font-size: var(--fs-15); font-weight: 600; text-align: left; width: 100%; }
.w-menu button.danger { color: var(--warn); }

/* ── 인덱스 ── */
body.w-index { height: auto; overflow: auto; background: var(--shell-bg); color: var(--ink); padding: 32px; }
.w-index h1 { font-size: var(--fs-24); margin-bottom: 8px; }
.w-index p { font-size: var(--fs-15); color: var(--ink-mid); margin-bottom: 24px; }
.w-index table { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--r-card); overflow: hidden; font-size: var(--fs-13); }
.w-index th, .w-index td { text-align: left; padding: 16px; border-bottom: 1px solid var(--shell-line); vertical-align: top; line-height: 1.6; }
.w-index th { background: var(--mb-purple-cream); color: var(--mb-purple); }

  return '<h1>상담사·지도사 명상 클래스 시안 · 화면·케이스 인덱스 (CH01~CH30)</h1><p>?screen=화면ID&amp;case=케이스 로 열어요. 클래스 상세 계열은 &amp;k=mbsr|wed|wed-open|lunch|intro|winter|morning 으로 클래스를 바꿔요. 파라미터가 없으면 CH01 첫 화면이에요. 화면 ' + INDEX.length + '종 · 케이스 총 ' + total + '개 (각 4개 뷰포트). 가정 열의 D-nn 은 결정-필요.md, § 는 기획 문서 절이에요.</p>' +
    '<table><thead><tr><th>화면</th><th>유형</th><th>케이스</th><th>가정</th></tr></thead><tbody>' +
    INDEX.map((s) => '<tr><td><b>' + s.id + '</b><br>' + s.name + '</td><td>' + s.type + '</td><td>' + s.cases.map((c) => '<a href="?screen=' + s.id + '&case=' + c[0] + '">' + c[0] + '</a><span style="font-size:13px;color:#6F6F6F"> ' + c[1] + '</span><br>').join('') + '</td><td>' + s.assume + '</td></tr>').join('') + '</tbody></table>';
}
const SCREEN = Q.get('screen') || 'CH01';
const DEF = INDEX.filter((s) => s.id === SCREEN)[0];

window.__INDEX = INDEX.flatMap((s) => s.cases.map((c) => ({ screen: s.id, case: c[0], type: s.type, k: (Q.get('k') || '') })));
window.__REG = INDEX.reduce((a, s) => { a[s.id] = s.cases.map((c) => c[0]); return a; }, {});
function view() {

}
document.getElementById('root').innerHTML = view();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { window.__ready = true; });
