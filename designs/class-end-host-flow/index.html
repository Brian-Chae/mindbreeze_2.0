<body>
<header class="review"><div><strong>SDD–237 / 클래스 종료 후 상담사 여정</strong><p>기획 검토용 · 합성 샘플 · 실제 저장·승인·발송 없음</p></div><label>화면 보기<select id="screen-select" aria-label="검토할 화면 선택"></select></label></header>
<div id="app"></div>
<dialog id="dialog"><h2 id="dialog-title"></h2><p id="dialog-body"></p><div class="actions" id="dialog-actions"></div></dialog>
<script>
const screens={'current-end':'현행 재현 · 종료 화면','current-record':'현행 재현 · 기록지',overview:'제안 01 · 종료 직후 요약',participants:'제안 02 · 참여자별 결과',notes:'제안 03 · 비공개 기록',waiting:'제안 04 · 생성 대기',failed:'제안 05 · 생성 실패',partial:'제안 06 · 부분 실패',report:'제안 07 · 개인 리포트',counseling:'제안 08 · 1:1 상담 요약'};
const select=document.querySelector('#screen-select');for(const [key,label] of Object.entries(screens)){const o=document.createElement('option');o.value=key;o.textContent=label;select.append(o)}
let current='overview',scenario='normal',savedNotes='',draft='',dirty=false,approved=false,commentSaved=false,selectedPerson=0,resultMode='normal';
const savedComments={};
const btn=(label,target,kind='')=>`<button class="btn ${kind}" data-go="${target}">${label}</button>`;
const chip=(label,tone='')=>`<span class="chip ${tone}">${label}</span>`;
const annot=(number,text)=>`<aside class="annotation"><b>${number} → 화면 전환</b><span>${text}</span></aside>`;
const tabs=(active)=>`<nav class="tabs" aria-label="회차 요약 메뉴">${['overview','participants','notes'].map((key,i)=>`<button data-go="${key}" ${active===key?'aria-current="page"':''}>${['개요','참여자 결과','진행 기록'][i]}</button>`).join('')}</nav>`;
const pageHeading=(title,sub,badge='종료됨')=>`<div class="intro"><div><div class="eyebrow">저녁 호흡 명상 / 4회차</div><h1>${title}</h1><p class="sub">${sub}</p></div>${chip(badge,'ok')}</div>`;
function shell(content){const isCounseling=current==='counseling';return `<div class="shell"><aside class="side"><div class="brand">mind breeze<small>상담사 워크스페이스</small></div><nav class="sidenav" aria-label="주 메뉴"><button data-info="홈">⌂ <span>홈</span></button><button class="${isCounseling?'':'active'}" data-info="클래스 목록">▦ <span>명상 클래스</span></button><button class="${isCounseling?'active':''}" data-go="counseling">◯ <span>상담</span></button><button data-info="리포트 목록">▤ <span>리포트</span></button><button data-info="메시지">↗ <span>메시지</span></button></nav><div class="side-foot"><strong>샘플 상담사</strong><p class="meta">개인 상담소 · 검토용</p></div></aside><div class="workspace"><header class="topbar"><span class="crumb">${isCounseling?'상담':'명상 클래스'} <span class="muted">/ ${isCounseling?'샘플 내담자':'저녁 호흡 명상'}</span></span><span class="mobile-brand">mind breeze</span><div class="meta"><span>2026.10.23</span><span class="avatar">상</span><span>샘플 상담사</span></div></header><main class="content">${content}</main></div></div>`}
function followup(){return `<aside class="stack"><section class="card"><div class="eyebrow">다음 일정</div><h2>5회차 · 호흡에 머무르기</h2><p class="sub">10월 30일 (금)<br><span class="mono">19:00 — 19:30</span></p><div style="margin-top:20px">${btn('다음 회차 확인 ↗','next','soft')}</div><p class="legend">예정된 회차로 이동합니다.</p></section><section class="plain-section"><h3>오늘의 업무를 마치셨나요?</h3><p>리포트가 생성 중이어도 나갈 수 있습니다. 클래스의 회차 목록에서 다시 확인하세요.</p><div class="actions" style="margin-top:16px">${btn('클래스 목록','list')}${btn('홈으로','home','ghost')}</div></section><div class="status-switch"><label for="scenario">검토 도구 · 예외 상태</label><select id="scenario"><option value="normal">일반 · 샘플 4명</option><option value="zero">참여자 0명</option><option value="noband">모두 LINK BAND 미착용</option><option value="offline">네트워크 끊김</option></select></div></aside>`}
function overview(counseling=false){if(counseling)return shell(`<div class="intro"><div><div class="eyebrow">상담 / 샘플 내담자 / 3회차</div><h1>오늘 상담이 종료되었습니다</h1><p class="sub">10월 23일 · 14:00–14:50 · 임상심리상담</p></div>${chip('종료됨','ok')}</div><div class="grid"><div class="stack"><section class="hero"><div class="eyebrow">상담 기록을 이어서 남겨 보세요</div><h2>기억이 선명할 때, 오늘의 관찰을.</h2><p>기록은 내담자에게 공유되지 않습니다.<br>내담자 리포트의 전달 코멘트는 별도로 작성합니다.</p><div class="actions">${btn('상담 기록 작성 →','counseling-notes','primary')}${btn('내담자 리포트 확인','counseling-report')}</div></section><section class="card"><h2>내담자 리포트</h2><div class="row" style="margin-top:16px"><div><strong>샘플 내담자</strong><p>생성 완료 · 승인 대기 · 뇌파 미측정</p></div>${chip('검토 대기')}</div><p class="inline-note">샘플 계정은 자동 승인 꺼짐입니다. 현행 설정은 명상과 상담에 함께 적용됩니다.</p></section><div class="notice">이번 버전에서는 자동 전사·요약을 제공하지 않습니다. 직접 기록할 수 있습니다.</div></div><aside class="stack"><section class="card"><h2>후속 조치</h2><p class="sub">다음 상담 일정을 확인하고 필요한 내용만 대화로 전달하세요.</p><div class="stack" style="margin-top:20px">${btn('다음 상담 일정','next')}${btn('기존 대화 열기 ↗','chat','soft')}${btn('상담 목록','counseling-list','ghost')}</div></section></aside></div>${annot('08','상담 관계 맥락과 기록 우선순위만 달라집니다. 공통 엔진과 리포트 상세를 재사용하는 제안이며 상담 기능을 새로 공개하지 않습니다.')}`);
let exception=scenario==='offline'?'<div class="notice warn" style="margin-bottom:20px">연결이 끊겨 최신 상태를 확인할 수 없습니다. 마지막 확인 19:31 · 아래 정보는 마지막 조회 결과입니다. <button class="btn small" data-reconnect>연결 후 다시 확인</button></div>':scenario==='noband'?'<div class="notice" style="margin-bottom:20px">이번 회차는 모두 뇌파 미측정입니다. 측정값·점수 없이 참여 기록과 전달 코멘트를 확인하세요.</div>':'';

return shell(pageHeading('클래스가 종료되었습니다','10월 23일 · 19:00–19:30 · 온라인 그룹')+tabs('overview')+exception+`<div class="grid"><div class="stack">${center}<section class="card"><div class="card-head"><h2>결과와 기록</h2><span class="sample-label">샘플 데이터</span></div><div class="row"><div><strong>클래스 리포트</strong><p>상담사용 · 이번 회차의 결과</p></div>${btn('열기 ↗','class-report','small')}</div><div class="row"><div><strong>진행 기록</strong><p>참여자에게 비공개 · ${savedNotes?'저장됨':'아직 작성하지 않음'}</p></div>${btn(savedNotes?'이어 보기':'작성','notes','small')}</div><p class="inline-note">자동 승인 꺼짐 · 리포트를 검토하고 승인하면 수신 가능한 참여자에게 전달 절차가 진행됩니다.</p></section></div>${followup()}</div>`+annot('01','참여자 결과 확인 → 회차 내 결과 목록. 기록 작성 → 비공개 편집기. 완료된 플레이어·회차 상세에서도 이 요약으로 돌아옵니다.'))}
const people=[{name:'샘플 참여자 A',kind:'회원',measure:'측정 완료',gen:'준비됨',approval:'검토 대기',delivery:'승인 후 전달',group:'review'},{name:'샘플 참여자 B',kind:'회원',measure:'뇌파 미측정',gen:'준비됨',approval:'승인됨',delivery:'이메일 발송됨',group:'approved'},{name:'샘플 참여자 C',kind:'게스트',measure:'측정 완료',gen:'준비됨',approval:'검토 대기',delivery:'승인 후 전달',group:'review'},{name:'샘플 참여자 D',kind:'회원 · 미반영 선택',measure:'집계 제외',gen:'대상 아님',approval:'—',delivery:'발송 대상 아님',group:'excluded'}];
function rows(mode='normal'){return people.map((p,i)=>{let gen=p.gen,approval=p.approval,delivery=p.delivery;if(mode==='partial'&&i===2){gen='생성 실패';approval='승인 불가';delivery='전달 대기'}return `<tr data-person="${p.name}" data-group="${p.group}"><td class="identity" data-label="참여자"><span class="name">${p.name}</span><small>${p.kind}</small></td><td data-label="뇌파">${scenario==='noband'&&i<3?'뇌파 미측정':p.measure}</td><td data-label="생성">${chip(gen,gen==='생성 실패'?'fail':i===3?'gray':'ok')}</td><td data-label="승인">${approval}</td><td data-label="이메일">${delivery}</td><td class="action" data-label="열기">${i===3?'<span class="meta">리포트 미반영</span>':mode==='partial'&&i===2?btn('상태 확인','failed','small'):btn('리포트 열기 ↗','report-'+i,'small')}</td></tr>`}).join('')}
function table(mode){return `<table class="result-table"><thead><tr><th>참여자</th><th>뇌파</th><th>생성</th><th>승인</th><th>이메일</th><th>결과</th></tr></thead><tbody>${rows(mode)}</tbody></table>`}
function participants(){return shell(pageHeading('참여자별 결과','리포트 대상 3명 · 미반영 1명')+tabs('participants')+`<div class="notice" style="margin-bottom:20px">생성 완료와 승인·이메일 발송은 별도 상태입니다. 비공개 메모는 참여자 리포트에 포함되지 않습니다.</div><div class="toolbar"><input id="search" type="search" aria-label="참여자 검색" placeholder="참여자 검색"><select id="filter" aria-label="리포트 상태 필터"><option value="all">전체 4명</option><option value="review">검토 대기 2명</option><option value="approved">승인됨 1명</option><option value="excluded">미반영 1명</option></select></div><section class="card table-card"><div class="card-head"><h2>이번 회차 참여자</h2><span class="sample-label">샘플 데이터</span></div>${table(resultMode)}<p id="no-results" hidden>조건에 맞는 참여자가 없습니다.</p></section><div class="flowline">리포트 열기 <b>→</b> 공개 코멘트 확인·저장 <b>→</b> 승인 확인 <b>→</b> 전달 상태 확인</div>`+annot('02','개인 리포트 상세 → 같은 결과 목록으로 복귀. 미반영 참여자는 승인·발송 대상에서 제외합니다. 명상 종합점수·순위는 표시하지 않습니다.'))}
function notes(){return shell(pageHeading('진행 기록','이번 회차를 돌아보며 필요한 관찰을 남기세요')+tabs('notes')+`<div class="grid"><section class="card"><div class="card-head"><h2>비공개 진행 기록</h2>${chip('참여자에게 비공개','gray')}</div><p class="muted" style="margin-bottom:20px">이 내용은 참여자 리포트·메일에 포함되지 않습니다. 참여자에게 전할 글은 해당 리포트의 코멘트에 작성하세요.</p><label class="field" for="notes">관찰 내용 · 특이사항 · 다음 회차 준비</label><textarea id="notes" placeholder="예: 마지막 호흡 안내에 충분한 여유를 두었다. 다음 회차에는 시작 전 자세 안내 시간을 확보한다."></textarea><div class="savebar"><span id="save-state" class="meta" role="status">${savedNotes?'이 시안에서 저장한 기록':'아직 저장하지 않음'}</span><button class="btn primary" id="save-notes">기록 저장</button></div><p class="legend">서버 저장 전에는 새로고침·창 종료로 입력을 잃을 수 있습니다.<br>이 시안의 저장은 화면 동작 예시이며 새로고침하면 초기화됩니다.</p><div class="history" id="history"><strong>저장 이력</strong><p class="meta">${savedNotes?'시안 내 저장본 1건':'저장한 기록이 없습니다.'}</p></div></section><aside class="stack"><section class="plain-section"><div class="eyebrow">기록의 경계</div><h2>내 기록과 전달할 글을<br>분리합니다.</h2><p style="margin-top:16px">진행 기록은 내부 관찰을 위한 공간입니다. 저장해도 리포트가 재생성되거나 자동 발송되지 않습니다.</p><div class="actions" style="margin-top:20px">${btn('참여자 리포트 확인','participants','soft')}</div></section><div class="notice">이번 버전은 자동 전사·요약을 제공하지 않습니다. 마이크를 끈 경우에도 직접 기록할 수 있습니다.</div><button class="btn" id="simulate-save-error">검토용 · 저장 실패 체험</button></aside></div>`+annot('03','작성 → 저장 중 → 저장됨(시각). 미저장 상태에서 다른 화면으로 이동하면 확인합니다. 저장 실패 시 입력을 유지하고, 재접속 시에는 마지막 서버 저장본을 보여주는 제안입니다.'))}
function processing(mode){resultMode=mode==='partial'?'partial':'normal';const failed=mode==='failed',partial=mode==='partial';let title=failed?'리포트 생성 확인이 필요합니다':partial?'일부 리포트를 확인해 주세요':'클래스는 끝났고, 리포트를 준비 중입니다';return shell(pageHeading(title,'종료 상태와 리포트 처리 상태를 분리해 보여드립니다')+tabs('overview')+`<div class="grid"><div class="stack"><section class="card"><div class="card-head"><h2>${failed?'리포트를 만들지 못했어요':partial?'준비 2명 · 확인 필요 1명':'리포트를 준비하고 있어요'}</h2>${chip(failed?'생성 실패':partial?'일부 실패':'생성 중',failed?'fail':partial?'warn':'')}</div><p class="muted">${failed?'클래스 종료와 저장된 기록은 유지됩니다. 연결 오류와 생성 오류를 확인해 주세요.':partial?'완료된 리포트는 지금 확인할 수 있습니다. 실패한 참여자의 결과만 따로 확인합니다.':'화면을 닫아도 처리는 계속됩니다. 기다리는 동안 기록을 남기거나 다른 업무를 볼 수 있어요.'}</p><div class="step"><span class="step-icon">✓</span><div class="step-info"><strong>클래스 종료</strong><p>19:30 종료 확인</p></div>${chip('완료','ok')}</div><div class="step"><span class="step-icon">✓</span><div class="step-info"><strong>녹음 저장</strong><p>샘플 회차 · 저장 확인</p></div>${chip('완료','ok')}</div><div class="step"><span class="step-icon">${failed?'!':'…'}</span><div class="step-info"><strong>참여자 리포트</strong><p>${failed?'생성 오류 · 상태를 다시 확인하세요':partial?'대상 3명 중 2명 준비됨':'대상 3명 · 서버 처리 중'}</p></div>${chip(failed?'실패':partial?'일부 준비':'처리 중',failed?'fail':'')}</div><div class="actions" style="margin-top:20px">${btn(partial?'참여자 결과 확인':'진행 기록 남기기',partial?'participants':'notes','primary')}<button class="btn" data-check-status>상태 다시 확인</button></div><p class="legend">${failed?'상태 재조회는 재생성·메일 재발송을 실행하지 않습니다.':'처리 시간과 진행률을 임의로 추정하지 않습니다.'}</p></section><div class="notice">이번 출시에서는 자동 전사·AI 요약을 사용하지 않습니다. 해당 단계의 생략은 실패가 아닙니다.</div>${partial?`<section class="card table-card"><h2 style="margin-bottom:16px">대상별 결과</h2>${table('partial')}</section>`:''}</div>${followup()}</div>`+annot(failed?'05':partial?'06':'04',failed?'생성 실패 → 상태 확인. 실패 대상 재생성은 API 검증 후 별도 제공하며 메일 재발송과 혼합하지 않습니다.':partial?'성공한 결과를 잠그지 않습니다. 정책상 미측정·미반영과 실제 생성 실패도 구분합니다.':'리포트 생성 중 → 기록 작성 또는 목록 복귀. 상태 이벤트와 재조회로 갱신하며 완료돼도 강제로 화면을 전환하지 않습니다.'))}
function report(){const person=people[selectedPerson];return shell(`<div class="actions" style="margin-bottom:20px">${btn('← 참여자 결과','participants','ghost')}</div><div class="intro"><div><div class="eyebrow">참여자 리포트 / ${person.name}</div><h1>호흡을 따라 머문 시간</h1><p class="sub">저녁 호흡 명상 · 4회차 · 2026.10.23</p></div>${chip(approved?'승인됨':'검토 대기',approved?'ok':'')}</div><div class="grid"><div class="stack"><section class="card"><div class="report-kicker">MIND BREEZE / SESSION REFLECTION</div><h2 style="margin-top:16px">오늘의 몸과 마음</h2><div class="readout"><p>${scenario==='noband'||person.measure==='뇌파 미측정'?'이번 회차는 뇌파를 측정하지 않았습니다. 오늘 참여한 시간을 돌아보고 아래 상담사의 전달 코멘트를 확인해 보세요.':'호흡을 천천히 따라가며 몸의 감각을 살펴본 시간입니다. 마지막 구간에는 시작 구간보다 이완 관련 지표가 높게 나타났습니다.'}</p></div><p class="legend">서사 표현 예시 · 실제 측정 결과가 아닙니다.<br>변화 방향을 설명하며 종합점수·순위로 평가하지 않습니다.</p></section><section class="card"><div class="card-head"><h2>참여자에게 전할 코멘트</h2>${chip('리포트에 포함')}</div><label class="field" for="comment">참여자가 읽을 내용</label><textarea id="comment" ${approved?'readonly':''}>오늘 나에게 편안했던 호흡의 속도를 떠올려 보세요. 일상에서도 부담 없이 짧게 이어가셔도 좋습니다.</textarea><div class="savebar"><span class="meta" id="comment-state">${commentSaved?'시안에서 저장됨':'공개 코멘트 예시'}</span><button class="btn" id="save-comment" ${approved?'disabled':''}>코멘트 저장</button></div></section></div><aside class="stack"><section class="card"><h2>승인과 전달</h2><div class="row" style="margin-top:16px"><span>생성</span>${chip('준비됨','ok')}</div><div class="row"><span>승인</span>${chip(approved?'승인됨':'검토 대기')}</div><div class="row"><span>이메일</span><span class="meta">${selectedPerson===1?'이메일 발송됨':approved?'전달 상태 확인 중':'승인 후 전달'}</span></div><p class="inline-note">${selectedPerson===1?'이메일 발송 완료를 별도로 확인한 샘플입니다.':approved?'승인은 메일 발송 성공을 뜻하지 않습니다. 별도 전달 결과를 확인합니다.':'자동 승인 꺼짐. 승인하면 인앱 공개와 신청된 이메일 전달 절차가 진행됩니다.'}</p><button class="btn primary" id="approve" style="width:100%;margin-top:20px" ${approved?'disabled':''}>${approved?'승인됨 · 시안 상태':'내용 확인 후 승인'}</button></section><p class="meta">참여자에게 비공개인 진행 기록은 이 화면에 표시하지 않습니다.</p></aside></div>`+annot('07','공개 코멘트 저장 → 승인 확인 → 전달 상태. 버튼은 시안 상태만 바꾸며 실제 승인·발송은 없습니다.'))}
function currentEnd(){return `<main class="current"><div class="current-wrap"><div class="current-title"><button data-info="현행 홈 복귀">⌂ 홈으로</button><span>클래스 종료 · 코드 기반 재현</span></div><h1>클래스가 끝났어요</h1><p style="text-align:center;margin-top:12px">수동 기록 모드로 진행했어요.<br>내 메모로 리포트를 만들었어요.</p><section class="current-card"><div class="card-head"><h2>리포트가 준비됐어요</h2>${chip('완료')}</div><div class="progress-track"><i></i></div>${[['녹음 저장','녹음 없음'],['음성 인식','건너뜀'],['AI 요약','건너뜀'],['리포트 완료','완료']].map(([label,state])=>`<div class="step"><span class="step-icon">${state==='완료'?'✓':'–'}</span><span class="step-info">${label}</span><small>${state}</small></div>`).join('')}</section><p class="meta" style="margin-bottom:24px">이번 버전은 녹음과 영상 다시보기만 제공해요.</p>${btn('기록 보기 →','current-record')}<p class="meta" style="text-align:center;margin-top:12px">리포트는 기록에서 언제든 볼 수 있어요</p>${annot('현행','실제 앱 캡처가 아닌 활성 EndingScene의 구조·문구 재현. STT skipped + ready done 샘플에서 manual 파생 문구를 재현했습니다. 배경 사진·아이콘·세부 픽셀은 단순화했습니다.')}<p class="meta" style="margin-top:16px">근거: HostPrepContainer → EndingScene / host-ending-model.ts. ‘기록 보기’의 목적지는 리포트 상세가 아닌 기록지입니다.</p></div></main>`}
function currentRecord(){return shell(`<div class="intro"><div><div class="eyebrow">현행 재현 · 실제 앱 캡처 아님</div><h1>기록지</h1><p class="sub">클래스 기록</p></div></div><section class="card" style="margin-bottom:20px"><div class="card-head"><h2>저녁 호흡 명상</h2>${chip('완료','ok')}</div><div class="stats" style="border:0;margin-top:0;padding-top:0"><div><dt>클래스 코드</dt><dd style="font-size:18px">샘플</dd></div><div><dt>참여자</dt><dd style="font-size:18px">4명</dd></div><div><dt>유형</dt><dd style="font-size:18px">명상수업</dd></div></div><p class="meta" style="margin-top:16px">2026.10.23 19:00 ~ 19:30</p></section><section class="card"><div class="tabs"><button aria-current="page" data-info="현행 상담사 메모">상담사 메모</button></div><label class="field" for="current-notes">상담사 메모</label><textarea id="current-notes" placeholder="세션 중 관찰 내용, 특이사항, 다음 세션 계획 등을 자유롭게 기록하세요."></textarea><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn primary" data-info="현행 메모 저장">메모 저장</button></div></section>${annot('현행','SessionRecordPage + RecordView + CounselorNotesTab 재현. STT off라 메모 탭만 남고, 참여자 리포트로 직접 이동하는 목록이 없습니다. 메타·편집 영역 중심으로 재현했으며 앱의 전체 상태 조합을 캡처한 것은 아닙니다.')}<div class="actions" style="margin-top:20px">${btn('추천안 보기 →','overview','primary')}${btn('현행 종료 화면','current-end')}</div>`)}
function showModal(title,body,actions=[{label:'확인',fn:()=>{}}]){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-body').textContent=body;const box=document.querySelector('#dialog-actions');box.replaceChildren();actions.forEach((a,i)=>{let b=document.createElement('button');b.className='btn '+(i===actions.length-1?'primary':'');b.textContent=a.label;b.onclick=()=>{document.querySelector('#dialog').close();a.fn()};box.append(b)});document.querySelector('#dialog').showModal()}
function navigate(target){if(target.startsWith('report-')){selectedPerson=Number(target.slice(7));approved=selectedPerson===1;commentSaved=Boolean(savedComments[selectedPerson]);target='report'}const info={'counseling-notes':'상담 관계의 3회차 비공개 상담 기록 편집기로 이동하는 제안입니다. 이 시안의 실제 편집 체험은 명상 진행 기록 화면에서 제공합니다.','counseling-report':'샘플 내담자의 3회차 상담 리포트로 이동하는 제안입니다. 명상 참여자 리포트와 다른 대상이며 본 시안에서는 연결 위치만 표시합니다.',next:'기존 예정 회차 상세로 이동합니다. 새 회차를 생성하지 않습니다.',list:'클래스 목록으로 이동합니다. 해당 회차의 요약으로 다시 진입할 수 있습니다.',home:'상담사 홈으로 이동합니다.',chat:'접근 권한이 있는 기존 대화방을 엽니다. 메시지는 발송하지 않습니다.','counseling-list':'상담 관계 목록으로 돌아갑니다.','class-report':'해당 회차의 type=counselor 리포트 상세를 엽니다. 참여자에게 발송하는 개인 리포트와 구분합니다.'};const perform=()=>{if(info[target])showModal('제안된 이동',info[target]);else render(target)};if(dirty&&current==='notes'){showModal('저장하지 않은 기록이 있습니다','저장하지 않고 이동하면 현재 입력이 사라집니다.',[{label:'계속 작성',fn:()=>{}},{label:'저장하지 않고 이동',fn:()=>{draft=savedNotes;dirty=false;perform()}},{label:'저장 후 이동',fn:()=>{savedNotes=draft;dirty=false;perform()}}]);return}perform()}
function render(key){current=screens[key]?key:'overview';select.value=current;history.replaceState(null,'','#'+current);const content=current==='current-end'?currentEnd():current==='current-record'?currentRecord():current==='participants'?participants():current==='notes'?notes():['waiting','failed','partial'].includes(current)?processing(current):current==='report'?report():overview(current==='counseling');document.querySelector('#app').innerHTML=content;document.querySelector('.review strong').textContent='SDD–237 / 클래스 종료 후 상담사 여정';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>showModal('시안 안내',b.dataset.info+' 동작의 위치를 보여줍니다. 실제 앱이나 서버로 연결하지 않습니다.'));const sc=document.querySelector('#scenario');if(sc){sc.value=scenario;sc.onchange=()=>{scenario=sc.value;render(current)}}document.querySelector('[data-reconnect]')?.addEventListener('click',()=>{scenario='normal';render(current)});document.querySelector('[data-check-status]')?.addEventListener('click',()=>showModal('상태를 다시 확인했습니다','정적 시안이므로 현재 샘플 상태를 유지합니다. 실제 제품에서는 서버 상태를 재조회하며 재생성·발송은 하지 않습니다.'));if(current==='notes'){const ta=document.querySelector('#notes');ta.value=draft;ta.oninput=()=>{draft=ta.value;dirty=draft!==savedNotes;document.querySelector('#save-state').textContent=dirty?'저장하지 않은 변경 있음':'저장한 내용과 같음'};document.querySelector('#save-notes').onclick=()=>{const b=document.querySelector('#save-notes');b.disabled=true;document.querySelector('#save-state').textContent='저장 중… (시안)';setTimeout(()=>{savedNotes=draft;dirty=false;b.disabled=false;document.querySelector('#save-state').textContent='저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' (시안)';document.querySelector('#history p').textContent='시안 내 저장본 1건'},350)};document.querySelector('#simulate-save-error').onclick=()=>{document.querySelector('#save-state').textContent='저장 실패 · 입력을 유지했습니다. 다시 저장해 주세요.';dirty=true}}const filter=()=>{const q=document.querySelector('#search').value.trim();const f=document.querySelector('#filter').value;let visible=0;document.querySelectorAll('[data-person]').forEach(row=>{const show=row.dataset.person.includes(q)&&(f==='all'||f===row.dataset.group);row.style.display=show?'':'none';if(show)visible++});document.querySelector('#no-results').hidden=visible>0};document.querySelector('#search')?.addEventListener('input',filter);document.querySelector('#filter')?.addEventListener('change',filter);if(current==='report'&&savedComments[selectedPerson])document.querySelector('#comment').value=savedComments[selectedPerson];document.querySelector('#save-comment')?.addEventListener('click',()=>{savedComments[selectedPerson]=document.querySelector('#comment').value;commentSaved=true;document.querySelector('#comment-state').textContent='시안에서 저장됨'});document.querySelector('#approve')?.addEventListener('click',()=>showModal('이 리포트를 승인할까요?','실제 제품에서는 승인 후 인앱 공개와 신청된 이메일 전달 절차가 진행됩니다. 이 시안에서는 외부 작업이 발생하지 않습니다.',[{label:'돌아가기',fn:()=>{}},{label:'시안에서 승인 확인',fn:()=>{approved=true;render('report')}}]));window.scrollTo(0,0)}
select.onchange=()=>navigate(select.value);window.addEventListener('hashchange',()=>render(location.hash.slice(1)));window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});render(location.hash.slice(1)||'overview');
</script>
