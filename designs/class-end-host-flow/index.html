<script>
const screens={'current-end':'현행 재현 · 종료 화면','current-record':'현행 재현 · 기록지',overview:'제안 01 · 종료 직후 요약',participants:'제안 02 · 참여자별 결과',notes:'제안 03 · 비공개 기록',waiting:'제안 04 · 생성 대기',failed:'제안 05 · 생성 실패',partial:'제안 06 · 부분 실패',report:'제안 07 · 개인 리포트',counseling:'제안 08 · 1:1 상담 요약','biosignal-worn':'결정 반영 · 착용 세션','biosignal-partial':'결정 반영 · 일부 착용','biosignal-pending':'결정 반영 · 분석 중','biosignal-quality':'결정 반영 · 신호 불량','biosignal-lost':'결정 반영 · 연결 끊김','biosignal-unworn':'결정 반영 · 미착용','notes-skipped':'결정 반영 · 비워두기 후','auto-summary':'추천 정책 · 회차 요약','auto-settings':'추천 정책 · 설정'};
const select=document.querySelector('#screen-select');for(const [key,label] of Object.entries(screens)){const o=document.createElement('option');o.value=key;o.textContent=label;select.append(o)}
let current='overview',scenario='normal',savedNotes='',draft='',dirty=false,approved=false,commentSaved=false,selectedPerson=0,resultMode='normal';
const savedComments={};
let policyHeld=false, sampleContext="partial";

const btn=(label,target,kind='')=>`<button class="btn ${kind}" data-go="${target}">${label}</button>`;
const chip=(label,tone='')=>`<span class="chip ${tone}">${label}</span>`;
const annot=(number,text)=>`<aside class="annotation"><b>${number} → 화면 전환</b><span>${text}</span></aside>`;
const tabs=(active)=>`<nav class="tabs" aria-label="회차 요약 메뉴">${['overview','participants','notes'].map((key,i)=>`<button data-go="${key}" ${active===key?'aria-current="page"':''}>${['개요','참여자 결과','진행 기록'][i]}</button>`).join('')}</nav>`;
const pageHeading=(title,sub,badge='종료됨')=>`<div class="intro"><div><div class="eyebrow">저녁 호흡 명상 / 4회차</div><h1>${title}</h1><p class="sub">${sub}</p></div>${chip(badge,'ok')}</div>`;
function shell(content){const isCounseling=current==='counseling';return `<div class="shell"><aside class="side"><div class="brand">mind breeze<small>상담사 워크스페이스</small></div><nav class="sidenav" aria-label="주 메뉴"><button data-info="홈">⌂ <span>홈</span></button><button class="${isCounseling?'':'active'}" data-info="클래스 목록">▦ <span>명상 클래스</span></button><button class="${isCounseling?'active':''}" data-go="counseling">◯ <span>상담</span></button><button data-info="리포트 목록">▤ <span>리포트</span></button><button data-info="메시지">↗ <span>메시지</span></button></nav><div class="side-foot"><strong>샘플 상담사</strong><p class="meta">개인 상담소 · 검토용</p></div></aside><div class="workspace"><header class="topbar"><span class="crumb">${isCounseling?'상담':'명상 클래스'} <span class="muted">/ ${isCounseling?'샘플 내담자':'저녁 호흡 명상'}</span></span><span class="mobile-brand">mind breeze</span><div class="meta"><span>2026.10.23</span><span class="avatar">상</span><span>샘플 상담사</span></div></header><main class="content">${content}</main></div></div>`}
function followup(){return `<aside class="stack"><section class="card"><div class="eyebrow">다음 일정</div><h2>5회차 · 호흡에 머무르기</h2><p class="sub">10월 30일 (금)<br><span class="mono">19:00 — 19:30</span></p><div style="margin-top:20px">${btn('다음 회차 확인 ↗','next','soft')}</div><p class="legend">예정된 회차로 이동합니다.</p></section><section class="plain-section"><h3>오늘의 업무를 마치셨나요?</h3><p>리포트가 생성 중이어도 나갈 수 있습니다. 클래스의 회차 목록에서 다시 확인하세요.</p><div class="actions" style="margin-top:16px">${btn('클래스 목록','list')}${btn('홈으로','home','ghost')}</div></section><div class="status-switch"><label for="scenario">검토 도구 · 예외 상태</label><select id="scenario"><option value="normal">일반 · 샘플 4명</option><option value="zero">참여자 0명</option><option value="noband">모두 LINK BAND 미착용</option><option value="offline">네트워크 끊김</option></select></div></aside>`}

let exception=scenario==='offline'?'<div class="notice warn" style="margin-bottom:20px">연결이 끊겨 최신 상태를 확인할 수 없습니다. 마지막 확인 19:31 · 아래 정보는 마지막 조회 결과입니다. <button class="btn small" data-reconnect>연결 후 다시 확인</button></div>':scenario==='noband'?'<div class="notice" style="margin-bottom:20px">이번 회차는 모두 생체신호 미측정입니다. 측정값·점수 없이 참여 기록과 전달 코멘트를 확인하세요.</div>':'';

return shell(pageHeading('클래스가 종료되었습니다','10월 23일 · 19:00–19:30 · 온라인 그룹')+tabs('overview')+exception+`<div class="grid"><div class="stack">${center}${biosignalCard('partial')}${recordPrompt()}<section class="card"><div class="card-head"><h2>결과와 기록</h2><span class="sample-label">샘플 데이터</span></div><div class="row"><div><strong>클래스 리포트</strong><p>상담사용 · 이번 회차의 결과</p></div>${btn('열기 ↗','class-report','small')}</div><div class="row"><div><strong>진행 기록</strong><p>참여자에게 비공개 · ${savedNotes?'저장됨':'아직 작성하지 않음'}</p></div>${btn(savedNotes?'이어 보기':'작성','notes','small')}</div><p class="inline-note">자동 승인 꺼짐 · 리포트를 검토하고 승인하면 수신 가능한 참여자에게 전달 절차가 진행됩니다.</p></section></div>${followup()}</div>`+annot('01','참여자 결과 확인 → 회차 내 결과 목록. 기록 작성 → 비공개 편집기. 완료된 플레이어·회차 상세에서도 이 요약으로 돌아옵니다.'))}
const people=[{name:'샘플 참여자 A',kind:'회원',measure:'측정 완료',gen:'준비됨',approval:'검토 대기',delivery:'승인 후 전달',group:'review'},{name:'샘플 참여자 B',kind:'회원',measure:'생체신호 미측정',gen:'준비됨',approval:'승인됨',delivery:'이메일 발송됨',group:'approved'},{name:'샘플 참여자 C',kind:'게스트',measure:'측정 완료',gen:'준비됨',approval:'검토 대기',delivery:'승인 후 전달',group:'review'},{name:'샘플 참여자 D',kind:'회원 · 미반영 선택',measure:'집계 제외',gen:'대상 아님',approval:'—',delivery:'발송 대상 아님',group:'excluded'}];
function rows(mode='normal'){return people.map((person,i)=>{const p={...person};if(sampleContext==='worn'&&i<3)p.measure='측정 완료';if(i<3&&sampleContext==='unworn')p.measure='생체신호 미측정';if(i!==1&&i<3&&sampleContext==='quality')p.measure='EEG 측정 · PPG 신호 부족';if(i===0&&sampleContext==='lost')p.measure='연결 유실 · 자료 없음';let gen=p.gen,approval=p.approval,delivery=p.delivery;if(sampleContext==='pending'&&i<3){gen='생성 중';approval='대기';delivery='대기'}if(sampleContext==='auto'&&i===2){approval='확인 필요';delivery='자동 승인 보류'}if(mode==='partial'&&i===2){gen='생성 실패';approval='승인 불가';delivery='전달 대기'}return `<tr data-person="${p.name}" data-group="${p.group}"><td class="identity" data-label="참여자"><span class="name">${p.name}</span><small>${p.kind}</small></td><td data-label="생체신호">${scenario==='noband'&&i<3?'생체신호 미측정':p.measure}</td><td data-label="생성">${chip(gen,gen==='생성 실패'?'fail':i===3?'gray':'ok')}</td><td data-label="승인">${approval}</td><td data-label="이메일">${delivery}</td><td class="action" data-label="열기">${i===3?'<span class="meta">리포트 미반영</span>':sampleContext==='pending'?'<span class="meta">분석 중</span>':mode==='partial'&&i===2?btn('상태 확인','failed','small'):btn('리포트 열기 ↗','report-'+i,'small')}</td></tr>`}).join('')}
function table(mode){return `<table class="result-table"><thead><tr><th>참여자</th><th>생체신호</th><th>생성</th><th>승인</th><th>이메일</th><th>결과</th></tr></thead><tbody>${rows(mode)}</tbody></table>`}
function participants(){return shell(pageHeading('참여자별 결과','리포트 대상 3명 · 미반영 1명')+tabs('participants')+`${sampleContext==='pending'?'<div class="notice" style="margin-bottom:20px">분석 중인 회차 · 완료 전에는 리포트를 열 수 없습니다.</div>':''}<div class="notice" style="margin-bottom:20px">생성 완료와 승인·이메일 발송은 별도 상태입니다. 진행 기록 원문과 참여자에게 전할 공개 코멘트는 분리됩니다.</div><div class="toolbar"><input id="search" type="search" aria-label="참여자 검색" placeholder="참여자 검색"><select id="filter" aria-label="리포트 상태 필터"><option value="all">전체 4명</option><option value="review">검토 대기 2명</option><option value="approved">승인됨 1명</option><option value="excluded">미반영 1명</option></select></div><section class="card table-card"><div class="card-head"><h2>이번 회차 참여자</h2><span class="sample-label">샘플 데이터</span></div>${table(resultMode)}<p id="no-results" hidden>조건에 맞는 참여자가 없습니다.</p></section><div class="flowline">리포트 열기 <b>→</b> 공개 코멘트 확인·저장 <b>→</b> 승인 확인 <b>→</b> 전달 상태 확인</div>`+annot('02','개인 리포트 상세 → 같은 결과 목록으로 복귀. 미반영 참여자는 승인·발송 대상에서 제외합니다. 명상 종합점수·순위는 표시하지 않습니다.'))}
function notes(){return shell(pageHeading('진행 기록','이번 회차를 돌아보며 필요한 관찰을 남기세요')+tabs('notes')+`<div class="grid"><section class="card"><div class="card-head"><h2>비공개 진행 기록</h2>${chip('참여자에게 비공개','gray')}</div><p class="muted" style="margin-bottom:20px">기록 원문을 직접 공유하지 않습니다. 1:1 상담의 AI 공개 코멘트 초안에는 기록이 참고될 수 있으므로 전달 내용을 별도로 확인하세요.</p><label class="field" for="notes">관찰 내용 · 특이사항 · 다음 회차 준비</label><textarea id="notes" placeholder="예: 마지막 호흡 안내에 충분한 여유를 두었다. 다음 회차에는 시작 전 자세 안내 시간을 확보한다."></textarea><div class="savebar"><span id="save-state" class="meta" role="status">${savedNotes?'이 시안에서 저장한 기록':'아직 저장하지 않음'}</span><button class="btn primary" id="save-notes">기록 저장</button></div><p class="legend">서버 저장 전에는 새로고침·창 종료로 입력을 잃을 수 있습니다.<br>이 시안의 저장은 화면 동작 예시이며 새로고침하면 초기화됩니다.</p><div class="history" id="history"><strong>저장 이력</strong><p class="meta">${savedNotes?'시안 내 저장본 1건':'저장한 기록이 없습니다.'}</p></div></section><aside class="stack"><section class="plain-section"><div class="eyebrow">기록의 경계</div><h2>내 기록과 전달할 글을<br>분리합니다.</h2><p style="margin-top:16px">진행 기록은 내부 관찰을 위한 공간입니다. 저장해도 리포트가 재생성되거나 자동 발송되지 않습니다.</p><div class="actions" style="margin-top:20px">${btn('참여자 리포트 확인','participants','soft')}</div></section><div class="notice">이번 버전은 자동 전사·요약을 제공하지 않습니다. 마이크를 끈 경우에도 직접 기록할 수 있습니다.</div><button class="btn" id="simulate-save-error">검토용 · 저장 실패 체험</button></aside></div>`+annot('03','작성 → 저장 중 → 저장됨(시각). 미저장 상태에서 다른 화면으로 이동하면 확인합니다. 저장 실패 시 입력을 유지하고, 재접속 시에는 마지막 서버 저장본을 보여주는 제안입니다.'))}
function processing(mode){resultMode=mode==='partial'?'partial':'normal';const failed=mode==='failed',partial=mode==='partial';let title=failed?'리포트 생성 확인이 필요합니다':partial?'일부 리포트를 확인해 주세요':'클래스는 끝났고, 리포트를 준비 중입니다';return shell(pageHeading(title,'종료 상태와 리포트 처리 상태를 분리해 보여드립니다')+tabs('overview')+`<div class="grid"><div class="stack"><section class="card"><div class="card-head"><h2>${failed?'리포트를 만들지 못했어요':partial?'준비 2명 · 확인 필요 1명':'리포트를 준비하고 있어요'}</h2>${chip(failed?'생성 실패':partial?'일부 실패':'생성 중',failed?'fail':partial?'warn':'')}</div><p class="muted">${failed?'클래스 종료와 저장된 기록은 유지됩니다. 연결 오류와 생성 오류를 확인해 주세요.':partial?'완료된 리포트는 지금 확인할 수 있습니다. 실패한 참여자의 결과만 따로 확인합니다.':'화면을 닫아도 처리는 계속됩니다. 기다리는 동안 기록을 남기거나 다른 업무를 볼 수 있어요.'}</p><div class="step"><span class="step-icon">✓</span><div class="step-info"><strong>클래스 종료</strong><p>19:30 종료 확인</p></div>${chip('완료','ok')}</div><div class="step"><span class="step-icon">✓</span><div class="step-info"><strong>녹음 저장</strong><p>샘플 회차 · 저장 확인</p></div>${chip('완료','ok')}</div><div class="step"><span class="step-icon">${failed?'!':'…'}</span><div class="step-info"><strong>참여자 리포트</strong><p>${failed?'생성 오류 · 상태를 다시 확인하세요':partial?'대상 3명 중 2명 준비됨':'대상 3명 · 서버 처리 중'}</p></div>${chip(failed?'실패':partial?'일부 준비':'처리 중',failed?'fail':'')}</div><div class="actions" style="margin-top:20px">${btn(partial?'참여자 결과 확인':'진행 기록 남기기',partial?'participants':'notes','primary')}<button class="btn" data-check-status>상태 다시 확인</button></div><p class="legend">${failed?'상태 재조회는 재생성·메일 재발송을 실행하지 않습니다.':'처리 시간과 진행률을 임의로 추정하지 않습니다.'}</p></section><div class="notice">이번 출시에서는 자동 전사·AI 요약을 사용하지 않습니다. 해당 단계의 생략은 실패가 아닙니다.</div>${partial?`<section class="card table-card"><h2 style="margin-bottom:16px">대상별 결과</h2>${table('partial')}</section>`:''}</div>${followup()}</div>`+annot(failed?'05':partial?'06':'04',failed?'생성 실패 → 상태 확인. 실패 대상 재생성은 API 검증 후 별도 제공하며 메일 재발송과 혼합하지 않습니다.':partial?'성공한 결과를 잠그지 않습니다. 정책상 미측정·미반영과 실제 생성 실패도 구분합니다.':'리포트 생성 중 → 기록 작성 또는 목록 복귀. 상태 이벤트와 재 function report(){const person={...people[selectedPerson]};if(sampleContext==='worn')person.measure='측정 완료';if(sampleContext==='unworn')person.measure='생체신호 미측정';return shell(`<div class="actions" style="margin-bottom:20px">${btn('← 참여자 결과','participants','ghost')}</div><div class="intro"><div><div class="eyebrow">참여자 리포트 / ${person.name}</div><h1>호흡을 따라 머문 시간</h1><p class="sub">저녁 호흡 명상 · 4회차 · 2026.10.23</p></div>${chip(approved?'승인됨':'검토 대기',approved?'ok':'')}</div><div class="grid"><div class="stack"><section class="card"><div class="report-kicker">MIND BREEZE / SESSION REFLECTION</div><h2 style="margin-top:16px">오늘의 몸과 마음</h2><div class="readout"><p>${sampleContext==='lost'&&selectedPerson===0?'연결 유실로 분석 자료가 없습니다. 저장된 참여 기록과 전달 코멘트를 확인해 주세요.':scenario==='noband'||person.measure==='생체신호 미측정'?'이번 회차는 생체신호를 측정하지 않았습니다. 오늘 참여한 시간을 돌아보고 아래 상담사의 전달 코멘트를 확인해 보세요.':'호흡을 천천히 따라가며 몸의 감각을 살펴본 시간입니다. 마지막 구간에는 시작 구간보다 이완 관련 지표가 높게 나타났습니다.'}</p></div><p class="legend">서사 표현 예시 · 실제 측정 결과가 아닙니다.<br>변화 방향을 설명하며 종합점수·순위로 평가하지 않습니다.</p></section><section class="card"><div class="card-head"><h2>참여자에게 전할 코멘트</h2>${chip('리포트에 포함')}</div><label class="field" for="comment">참여자가 읽을 내용</label><textarea id="comment" ${approved?'readonly':''}>오늘 나에게 편안했던 호흡의 속도를 떠올려 보세요. 일상에서도 부담 없이 짧게 이어가셔도 좋습니다.</textarea><div class="savebar"><span class="meta" id="comment-state">${commentSaved?'시안에서 저장됨':'공개 코멘트 예시'}</span><button class="btn" id="save-comment" ${approved?'disabled':''}>코멘트 저장</button></div></section></div><aside class="stack"><section class="card"><h2>승인과 전달</h2><div class="row" style="margin-top:16px"><span>생성</span>${chip('준비됨','ok')}</div><div class="row"><span>승인</span>${chip(approved?'승인됨':'검토 대기')}</div><div class="row"><span>이메일</span><span class="meta">${selectedPerson===1?'이메일 발송됨':approved?'전달 상태 확인 중':'승인 후 전달'}</span></div><p class="inline-note">${selectedPerson===1?'이메일 발송 완료를 별도로 확인한 샘플입니다.':approved?'승인은 메일 발송 성공을 뜻하지 않습니다. 별도 전달 결과를 확인합니다.':'자동 승인 꺼짐. 승인하면 인앱 공개와 신청된 이 // 모든 수치는 정적 합성 샘플. 실제 저장 필드가 아닌 신규 집계 표시 제안이다.
const bioMetrics=[
 {key:'focus',label:'집중도',desc:'집중 · EEG',unit:'%',deltaUnit:'%p',color:'#D2AEFC',base:60,delta:6,history:[54,57,60]},
 {key:'relaxation',label:'이완도',desc:'이완 · EEG',unit:'%',deltaUnit:'%p',color:'#7DE3C8',base:64,delta:8,history:[61,62,64]},
 {key:'emotional',label:'감정균형도',desc:'정서 안정 · EEG',unit:'%',deltaUnit:'%p',color:'#F2C9A8',base:62,delta:4,history:[63,60,62]},
 {key:'bpm',label:'BPM',desc:'심박 · PPG',unit:'bpm',deltaUnit:'bpm',color:'#F0A7B8',base:72,delta:-4,history:[75,74,72]},
 {key:'respiration',label:'호흡',desc:'호흡수 · PPG',unit:'회/분',deltaUnit:'회/분',color:'#9CC9F0',base:14,delta:-2,history:[16,15,14]},
 {key:'hrv',label:'HRV',desc:'SDNN · PPG',unit:'ms',deltaUnit:'ms',color:'#B8E08A',base:42,delta:6,history:[39,40,42]},
];
const bioChange=(v,u)=>`${v>0?'↑':v<0?'↓':'→'} Δ${v>0?'+':''}${v} ${u}`;
function bioRows(mode,solo){return (solo?['샘플 내담자']:['참여자 A','참여자 B','참여자 C','참여자 D']).map((name,i)=>{
 const excluded=!solo&&i===3, absent=mode==='unworn'||(!solo&&mode!=='worn'&&i===1);
 const values=bioMetrics.map((m,j)=>{const missing=excluded||absent||mode==='pending'||(mode==='quality'&&j>=3)||(mode==='lost'&&i===0);const value=m.base+(solo?0:i===0?-2:i===2?2:0);return `<td data-label="${m.label} (${m.unit})">${missing?'—':`${value} ${m.unit}<small>${bioChange(m.delta,m.deltaUnit)}</small>`}</td>`}).join('');
 const quality=excluded?'미반영 · 집계 제외':absent?'미착용':mode==='pending'?'분석 중':mode==='quality'?'PPG 신호 부족':mode==='lost'&&i===0?'연결 유실 · 자료 없음':'유효 24분 / 80%';
 return `<tr><th scope="row">${name}</th>${values}<td data-label="신호 품질">${quality}</td></tr>`;
}).join('')}
function bioSpark(m){const lo=Math.min(...m.history)-2,hi=Math.max(...m.history)+2;const pts=m.history.map((v,i)=>`${12+i*78},${46-(v-lo)/(hi-lo)*36}`);return `<svg viewBox="0 0 180 54" role="img" aria-label="${m.label} 1~3회차 평균 ${m.history.join(', ')} ${m.unit}. 합성 샘플"><path d="M${pts.join(' L')}" fill="none" stroke="#62536b" stroke-width="2"/>${pts.map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="4" fill="${m.color}" stroke="#62536b"/>`).join('')}</svg><p class="meta">1회 ${m.history[0]} → 2회 ${m.history[1]} → 3회 ${m.history[2]}</p><p class="meta">이전 회차 대비 ${bioChange(m.history[2]-m.history[1],m.deltaUnit)}</p>`}
function biosignalCard(mode,solo=false){
 if(scenario==='zero')return '';

 const notes={worn:'지표별로 측정한 사람의 결과를 모았습니다.',partial:'측정한 2명의 결과만 집계합니다. 전체 참여자를 대표하지 않습니다.',pending:'업로드와 분석을 확인 중입니다. 완료 전에는 통계와 변화량을 표시하지 않습니다.',quality:'PPG 신호가 부족해 BPM·호흡·HRV는 표시하지 않습니다. EEG 지표는 유효 구간만 표시합니다.',lost:'참여자 A는 연결 유실로 자료가 없습니다. 남아 있는 참여자 C의 유효 구간만 집계합니다.',unworn:'LINK BAND 없이 참여했습니다. 측정값 없이 기록과 리포트 검토를 계속할 수 있습니다.'};
 const n=solo?1:mode==='worn'?3:mode==='lost'?1:2;
 return `<section class="card" id="biosignal-summary"><div class="card-head"><h2>생체신호 분석 요약</h2>${chip(titles[mode],'gray')}</div><p class="meta">뇌파·심박 등 6대 지표 · ${solo?'샘플 내담자 1명 · 3회차':'전체 참여 4명 · 리포트 대상 3명 · 미반영 1명 제외'}</p><p class="sub">${solo?'해당 내담자 한 명의 측정 결과입니다.':notes[mode]}</p><p class="bio-sample">합성 샘플 · 통계·시간·비율·추이는 표시 제안이며 실제 분석 결과가 아닙니다.</p><div class="bio-grid">${bioMetrics.map((m,j)=>{
 const missing=['pending','unworn'].includes(mode)||(mode==='quality'&&j>=3);
 const offset=solo||mode==='worn'||mode==='partial'||mode==='quality'?0:2;
 const mean=m.base+offset,early=mean-m.delta/2,late=mean+m.delta/2;
 return `<article class="bio-metric" data-metric="${m.key}" style="--metric:${m.color}"><h3><i></i>${m.label}</h3><p class="meta">${m.desc}</p><p class="bio-value">${missing?'—':mean}<span>${m.unit}</span></p><p class="meta">${solo?'개인 회차 평균':'참여자 평균의 평균'}</p><dl><div><dt>측정 인원</dt><dd>${mode==='pending'?'확인 중':missing?'0명':n+'명'}</dd></div><div><dt>${solo?'유효 표본 범위':'개인 평균 범위'}</dt><dd>${missing?'—':solo?`${mean-8}–${mean+8} ${m.unit}`:n===1?`${mean}–${mean} ${m.unit}`:`${mean-2}–${mean+2} ${m.unit}`}</dd></div><div><dt>초반 → 후반</dt><dd>${missing?'—':`${early} → ${late} ${m.unit}`}</dd></div></dl><p class="bio-delta">${missing?'변화량 —':bioChange(m.delta,m.deltaUnit)}</p><p class="meta">유효 시간 ${missing?'—':'24분'} / ${missing?'—':solo?'48%':'80%'}</p>${solo?bioSpark(m):''}</article>`;
 }).join('')}</div><p class="legend">${['pending','unworn'].includes(mode)?'유효 시간과 비율은 자료가 확인된 지표에만 제공합니다. 비율은 개인 유효 시간 ÷ 회차 시간입니다.':solo?'유효 시간 ÷ 상담 50분. 회차 평균 추이는 같은 정규화 기준의 1~3회차 비교 예시입니다.':'유효 시간은 측정자별 평균 24분, 비율은 각 참여자의 유효 시간 ÷ 회차 30분의 평균입니다.'} 초반·후반은 실행 구간의 전반/후반 유효 표본 평균, Δ는 후반−초반입니다. ${solo?'':'범위는 개인 회차 평균의 최솟값–최댓값이며 개인 간 순위가 아닙니다.'}</p>${!['pending','unworn'].includes(mode)?`<p class="inline-note">${mode==='quality'?'측정 구간 후반에 이완도가 높게 나타났습니다. PPG 신호가 부족해 심박·호흡·HRV 변화는 해석하지 않습니다.':'측정 구간 후반에 이완도는 높고 호흡수는 낮게 나타났습니다. 변화 방향만 기술하며 좋고 나쁨이나 치료 효과를 판단하지 않습니다.'}</p>`:''}${solo?'':`<details class="bio-details"><summary>참여자별 6지표 통계 펼치기</summary><p class="legend">고정 참여 순서 · 각 칸은 개인 평균과 Δ · 결측은 —</p><table class="bio-table"><caption>참여자별 평균·초반 대비 후반 변화량 · 합성 샘플</caption><thead><tr><th>참여자</th>${bioMetrics.map(m=>`<th scope="col">${m.label}<small>${m.unit}</small></th>`).join('')}<th scope="col">신호 품질</th></tr></thead><tbody>${bioRows(mode,false)}</tbody></table></details>`}<div class="actions" style="margin-top:16px">${btn(solo?'내담자 리포트':'참여자 측정 결과',solo?'counseling-report':'participants','soft')}</div></section>`;
}

}
function policyCard(){return `<section class="card"><div class="card-head"><h2>리포트 자동 승인</h2>${chip(policyHeld?'이번 회차 보류':'유예 중',policyHeld?'gray':'')}</div><p>${policyHeld?'아직 승인되지 않은 리포트는 직접 검토합니다.':'준비된 리포트는 조건 확인 후 19:42부터 승인 예정입니다.'}</p><p class="sub">명상 · 조건부 자동 승인 · 준비 후 10분<br>샘플: 대기 1명 / 확인 필요 1명 / 이미 승인 1명</p><p class="legend">승인 후 회원 알림·이메일 전달 절차가 시작됩니다. 이메일 발송 완료와는 다릅니다. 이미 승인·발송된 결과는 되돌리지 않습니다.</p><div class="actions" style="margin-top:16px"><button class="btn" id="hold-policy" ${policyHeld?'disabled':''}>${policyHeld?'이번 회차 보류됨':'이번 회차 보류'}</button>${btn('자동 승인 설정','auto-settings','soft')}</div></section>`}
function updatedSummary(key){const mode={'biosignal-worn':'worn','biosignal-partial':'partial','biosignal-pending':'pending','biosignal-quality':'quality','biosignal-lost':'lost','biosignal-unworn':'unworn'}[key]||'partial';sampleContext=key==='auto-summary'?'auto':mode;return shell(pageHeading('클래스가 종료되었습니다','10월 23일 · 19:00–19:30 · 합성 샘플')+tabs('overview')+`<div class="grid"><div class="stack"><section class="hero"><div class="eyebrow">회차 요약</div><h2>${mode==='pending'?'결과를 준비하고 있어요':'이번 회차를 돌아보세요'}</h2><p>참여 4명 · 리포트 대상 3명 · 미반영 1명</p><div class="actions">${btn('참여자 결과 확인','participants','primary')}</div></section>${biosignalCard(mode)}${recordPrompt(key==='notes-skipped')}</div><aside class="stack">${key==='auto-summary'?policyCard():`<section class="card"><h2>승인과 전달</h2><p class="sub">현행 샘플 설정 · 자동 승인 꺼짐</p>${btn('추천 정책 살펴보기','auto-summary','soft')}</section>`}<section class="card"><h2>다음 업무</h2><div class="stack" style="margin-top:16px">${btn('클래스 리포트','class-report')}${btn('다음 회차','next')}${btn('클래스 목록','list','ghost')}</div></section></aside></div>`+annot('10/23',key==='auto-summary'?'자동 승인 추천안 · 아직 적용되지 않은 정책입니다. 준비 시각부터 10분 유예, 미승인 대상만 보류.':'채택된 회차 요약 방향. 생체신호 수치·상태는 합성 샘플이며 실제 분석 결과가 아닙니다.'))}
function policySettings(){return shell(pageHeading('리포트 자동 승인 설정','추천안 · 명시적으로 선택한 뒤 이후 시작하는 회차에 적용','정책 제안')+`<div class="notice" style="margin-bottom:20px">기존 사용자는 현재 설정을 그대로 유지합니다. 이 화면은 새 정책을 선택하는 예시이며, 설정 변경으로 과거 리포트를 재발송하지 않습니다.</div><div class="grid"><div class="stack"><section class="card"><h2>상담과 명상을 따로 설정</h2><div class="status-switch"><label for="counsel-policy">1:1 상담</label><select id="counsel-policy"><option>직접 검토 후 승인 (권장)</option><option>기존 자동 승인 유지</option></select></div><div class="status-switch"><label for="meditation-policy">명상 클래스</label><select id="meditation-policy"><option>조건부 자동 승인 · 준비 후 10분</option><option>직접 검토 후 승인</option><option>기존 자동 승인 유지</option></select></div><p class="inline-note">분석 완료 · 데이터 충분 · 품질 경고 없음 · 공개 코멘트 확인 조건을 충족한 리포트만 예약합니다. 무데이터·초안 오류·개인정보 검토 필요는 수동 검토로 남깁니다.</p></section><section class="card"><h2>진행 기록 안내</h2><div class="status-switch"><label for="prompt-policy">새 회차의 한 번 안내</label><select id="prompt-policy"><option value="on">회차마다 한 번 안내</option><option value="off">모든 회차에서 안내 끄기</option></select></div><p class="legend">끄더라도 진행 기록 작성 버튼은 계속 표시합니다. 이미 확인한 회차의 안내는 다시 표시하지 않습니다.</p></section><div class="actions"><button class="btn primary" id="save-policy">변경 내용 확인</button>${btn('회차 요약으로','auto-summary')}</div></div><aside class="stack"><section class="card"><h2>전달 전 확인할 내용</h2><p class="sub">공개 코멘트는 참여자에게 전달됩니다. 특히 1:1 상담의 AI 초안은 내부 기록을 참고할 수 있어 직접 검토를 권장합니다.</p><p class="inline-note">이번 회차의 예약을 멈추려면 요약의 ‘이번 회차 보류’를 사용하세요. 기본 설정 변경은 이미 생성된 예약을 바꾸지 않습니다.</p></section></aside></div>`)}
function bindRevision(){document.querySelector('#skip-notes')?.addEventListener('click',()=>render(current==='counseling'?'counseling':'notes-skipped'));document.querySelector('#hold-policy')?.addEventListener('click',()=>{policyHeld=true;render('auto-summary')});document.querySelector('#save-policy')?.addEventListener('click',()=>showModal('새 정책으로 전환할까요?','상담: '+document.querySelector('#counsel-policy').value+' / 명상: '+document.querySelector('#meditation-policy').value+' · 이후 시작하는 회차에 적용합니다. 기존 예약·승인·발송은 바뀌지 않습니다.',[{label:'돌아가기',fn:()=>{}},{label:'시안에서 전환 확인',fn:()=>showModal('설정 예시 확인','실제 설정은 변경하지 않았습니다. 이 시안은 정책 검토용입니다.')}]))}
function currentEnd(){return `<main class="current"><div class="current-wrap"><div class="current-title"><button data-info="현행 홈 복귀">⌂ 홈으로</button><span>클래스 종료 · 코드 기반 재현</span></div><h1>클래스가 끝났어요</h1><p style="text-align:center;margin-top:12px">수동 기록 모드로 진행했어요.<br>내 메모로 리포트를 만들었어요.</p><section class="current-card"><div class="card-head"><h2>리포트가 준비됐어요</h2>${chip('완료')}</div><div class="progress-track"><i></i></div>${[['녹음 저장','녹음 없음'],['음성 인식','건너뜀'],['AI 요약','건너뜀'],['리포트 완료','완료']].map(([label,state])=>`<div class="step"><span class="step-icon">${state==='완료'?'✓':'–'}</span><span class="step-info">${label}</span><small>${state}</small></div>`).join('')}</section><p class="meta" style="margin-bottom:24px">이번 버전은 녹음과 영상 다시보기만 제공해요.</p>${btn('기록 보기 →','current-record')}<p class="meta" style="text-align:center;margin-top:12px">리포트는 기록에서 언제든 볼 수 있어요</p>${annot('현행','실제 앱 캡처가 아닌 활성 EndingScene의 구조·문구 재현. STT skipped + ready done 샘플에서 manual 파생 문구를 재현했습니다. 배경 사진·아이콘·세부 픽셀은 단순화했습니다.')}<p class="meta" style="margin-top:16px">근거: HostPrepContainer → EndingScene / host-ending-model.ts. ‘기록 보기’의 목적지는 리포트 상세가 아닌 기록지입니다.</p></div></main>`}
function currentRecord(){return shell(`<div class="intro"><div><div class="eyebrow">현행 재현 · 실제 앱 캡처 아님</div><h1>기록지</h1><p class="sub">클래스 기록</p></div></div><section class="card" style="margin-bottom:20px"><div class="card-head"><h2>저녁 호흡 명상</h2>${chip('완료','ok')}</div><div class="stats" style="border:0;margin-top:0;padding-top:0"><div><dt>클래스 코드</dt><dd style="font-size:18px">샘플</dd></div><div><dt>참여자</dt><dd style="font-size:18px">4명</dd></div><div><dt>유형</dt><dd style="font-size:18px">명상수업</dd></div></div><p class="meta" style="margin-top:16px">2026.10.23 19:00 ~ 19:30</p></section><section class="card"><div class="tabs"><button aria-current="page" data-info="현행 상담사 메모">상담사 메모</button></div><label class="field" for="current-notes">상담사 메모</label><textarea id="current-notes" placeholder="세션 중 관찰 내용, 특이사항, 다음 세션 계획 등을 자유롭게 기록하세요."></textarea><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn primary" data-info="현행 메모 저장">메모 저장</button></div></section>${annot('현행','SessionRecordPage + RecordView + CounselorNotesTab 재현. STT off라 메모 탭만 남고, 참여자 리포트로 직접 이동하는 목록이 없습니다. 메타·편집 영역 중심으로 재현했으며 앱의 전체 상태 조합을 캡처한 것은 아닙니다.')}<div class="actions" style="margin-top:20px">${btn('추천안 보기 →','overview','primary')}${btn('현행 종료 화면','current-end')}</div>`)}
function showModal(title,body,actions=[{label:'확인',fn:()=>{}}]){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-body').textContent=body;const box=document.querySelector('#dialog-actions');box.replaceChildren();actions.forEach((a,i)=>{let b=document.createElement('button');b.className='btn '+(i===actions.length-1?'primary':'');b.textContent=a.label;b.onclick=()=>{document.querySelector('#dialog').close();a.fn()};box.append(b)});document.querySelector('#dialog').showModal()}
function navigate(target){if(target.startsWith('report-')){selectedPerson=Number(target.slice(7));approved=selectedPerson===1;commentSaved=Boolean(savedComments[selectedPerson]);target='report'}const info={'counseling-notes':'상담 관계의 3회차 비공개 상담 기록 편집기로 이동하는 제안입니다. 이 시안의 실제 편집 체험은 명상 진행 기록 화면에서 제공합니다.','counseling-report':'샘플 내담자의 3회차 상담 리포트로 이동하는 제안입니다. 명상 참여자 리포트와 다른 대상이며 본 시안에서는 연결 위치만 표시합니다.',next:'기존 예정 회차 상세로 이동합니다. 새 회차를 생성하지 않습니다.',list:'클래스 목록으로 이동합니다. 해당 회차의 요약으로 다시 진입할 수 있습니다.',home:'상담사 홈으로 이동합니다.',chat:'접근 권한이 있는 기존 대화방을 엽니다. 메시지는 발송하지 않습니다.','counseling-list':'상담 관계 목록으로 돌아갑니다.','class-report':'해당 회차의 type=counselor 리포트 상세를 엽니다. 참여자에게 발송하는 개인 리포트와 구분합니다.'};const perform=()=>{if(info[target])showModal('제안된 이동',info[target]);else render(target)};if(dirty&&current==='notes'){showModal('저장하지 않은 기록이 있습니다','저장하지 않고 이동하면 현재 입력이 사라집니다.',[{label:'계속 작성',fn:()=>{}},{label:'저장하지 않고 이동',fn:()=>{draft=savedNotes;dirty=false;perform()}},{label:'저장 후 이동',fn:()=>{savedNotes=draft;dirty=false;perform()}}]);return}perform()}
function render(key){current=screens[key]?key:'overview';select.value=current;history.replaceState(null,'','#'+current);const content=current==='current-end'?currentEnd():current==='current-record'?currentRecord():current==='participants'?participants():current==='notes'?notes():['waiting','failed','partial'].includes(current)?processing(current):current==='report'?report():current==='auto-settings'?policySettings():['biosignal-worn','biosignal-partial','biosignal-pending','biosignal-quality','biosignal-lost','biosignal-unworn','notes-skipped','auto-summary'].includes(current)?updatedSummary(current):overview(current==='counseling');document.querySelector('#app').innerHTML=content;document.querySelector('.review strong').textContent='SDD–237 / 클래스 종료 후 상담사 여정';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>showModal('시안 안내',b.dataset.info+' 동작의 위치를 보여줍니다. 실제 앱이나 서버로 연결하지 않습니다.'));const sc=document.querySelector('#scenario');if(sc){sc.value=scenario;sc.onchange=()=>{scenario=sc.value;render(current)}}document.querySelector('[data-reconnect]')?.addEventListener('click',()=>{scenario='normal';render(current)});document.querySelector('[data-check-status]')?.addEventListener('click',()=>showModal('상태를 다시 확인했습니다','정적 시안이므로 현재 샘플 상태를 유지합니다. 실제 제품에서는 서버 상태를 재조회하며 재생성·발송은 하지 않습니다.'));if(current==='notes'){const ta=document.querySelector('#notes');ta.value=draft;ta.oninput=()=>{draft=ta.value;dirty=draft!==savedNotes;document.querySelector('#save-state').textContent=dirty?'저장하지 않은 변경 있음':'저장한 내용과 같음'};document.querySelector('#save-notes').onclick=()=>{const b=document.querySelector('#save-notes');b.disabled=true;document.querySelector('#save-state').textContent='저장 중… (시안)';setTimeout(()=>{savedNotes=draft;dirty=false;b.disabled=false;document.querySelector('#save-state').textContent='저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' (시안)';document.querySelector('#history p').textContent='시안 내 저장본 1건'},350)};document.querySelector('#simulate-save-error').onclick=()=>{document.querySelector('#save-state').textContent='저장 실패 · 입력을 유지했습니다. 다시 저장해 주세요.';dirty=true}}const filter=()=>{const q=document.querySelector('#search').value.trim();const f=document.querySelector('#filter').value;let visible=0;document.querySelectorAll('[data-person]').forEach(row=>{const show=row.dataset.person.includes(q)&&(f==='all'||f===row.dataset.group);row.style.display=show?'':'none';if(show)visible++});document.querySelector('#no-results').hidden=visible>0};document.querySelector('#search')?.addEventListener('input',filter);document.querySelector('#filter')?.addEventListener('change',filter);if(current==='report'&&savedComments[selectedPerson])document.querySelector('#comment').value=savedComments[selectedPerson];document.querySelector('#save-comment')?.addEventListener('click',()=>{savedComments[selectedPerson]=document.querySelector('#comment').value;commentSaved=true;document.querySelector('#comment-state').textContent='시안에서 저장됨'});document.querySelector('#approve')?.addEventListener('click',()=>showModal('이 리포트를 승인할까요?','실제 제품에서는 승인 후 인앱 공개와 신청된 이메일 전달 절차가 진행됩니다. 이 시안에서는 외부 작업이 발생하지 않습니다.',[{label:'돌아가기',fn:()=>{}},{label:'시안에서 승인 확인',fn:()=>{approved=true;render('report')}}]));bindRevision();window.scrollTo(0,0)}
select.onchange=()=>navigate(select.value);window.addEventListener('hashchange',()=>render(location.hash.slice(1)));window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});render(location.hash.slice(1)||'overview');
</script>
