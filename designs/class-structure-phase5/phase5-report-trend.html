 renderR2();go('r2');jobTimer=setTimeout(()=>{jobPhase=1;renderR2();jobTimer=setTimeout(()=>{jobPhase=2;renderR2();jobTimer=setTimeout(()=>{jobPhase=3;jobCache.set(activeRequestKey,{items:jobItems,number:jobNumber});renderR2();},900);},900);},900);
}
function retryJob(index){
 const targets=jobItems.filter((item,i)=>item.state==='retry'&&(index===undefined||i===index));if(!targets.length)return;
 targets.forEach(item=>item.state='running');renderR2();
 jobTimer=setTimeout(()=>{targets.forEach(item=>item.state='done');renderR2();},1200);
}

 document.getElementById('s-t2').innerHTML=`${intro('명상 클래스 · 마음챙김 기초 8주','출석과 회차별 변화 방향','각 회차 안의 전반·후반만 비교합니다. 회차 간 변화로 해석하지 않습니다.')}<div class="sh-card w-flow"><div class="w-section-head"><h2>3회차</h2>${chip('neutral','익명 집계')}</div><p class="w-caption">3월 18일 · 김하늘 지도사</p><div class="w-att-summary"><div><b>6명</b><span>출석</span></div><div><b>2명</b><span>결석</span></div><div><b>1명</b><span>별도 보강 연결</span></div></div><p class="w-note">보강 1명은 원회차 출석과 분포에 더하지 않습니다.</p><div class="w-flow"><div class="w-section-head"><h3>이완 반응의 전반·후반 방향</h3><span class="w-caption">유효 착용 5명</span></div><div class="w-distribution">${[['up','후반에 높아짐',3],['flat','전후가 비슷함',1],['down','후반에 낮아짐',1]].map(([i,t,n])=>`<div class="w-dist-row"><span class="w-inline">${icon(i)}${t}</span><span class="w-marks" aria-hidden="true">${Array.from({length:n},()=>icon(i)).join('')}</span><b>${n}명</b></div>`).join('')}</div><p class="w-caption">도형 1개는 1명입니다. 이름과 개별 측정값을 표시하지 않습니다.</p></div></div><div class="sh-card w-flow"><div class="w-section-head"><h2>6회차</h2>${chip('excluded','분포 비노출')}</div><p class="w-caption">4월 8일 · 박서준 지도사</p><div class="w-att-summary"><div><b>7명</b><span>출석</span></div><div><b>1명</b><span>결석</span></div><div><b>2명</b><span>유효 착용</span></div></div><div class="w-protected">${icon('lock')}<h3>이 회차의 분포는 표시하지 않아요</h3><p class="w-note">반영 가능한 유효 착용자가 3명 미만이면<br>개인을 알아볼 수 있어 방향 분포를 숨깁니다.</p></div><p class="w-caption">미측정자를 특정 방향에 포함하거나 값으로 대신하지 않습니다.</p></div><div class="w-banner">${icon('shield')}<div><b>집계에 반영 가능한 자료만 사용해요</b><p>리포트 포함 여부와 제외 상태, 해당 자료의 동의를 각각 확인합니다. 연구 동의가 리포트 동의를 대신하지 않습니다.</p></div></div><div class="sh-card w-flow"><h2>회차별 리포트 업무</h2><div>${sessions.map(s=>`<div class="w-work-row"><span class="w-session-no"><b>${s.n}</b>회차</span><div>${chip(s.state)}<p>${s.host} 지도사 · ${s.count}</p></div><button class="w-link" data-work="${s.n}">상태 확인 ${icon('arrow')}</button></div>`).join('')}</div></div>`;

document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.dataset.screen){go(button.dataset.screen);return;}
 if(button.dataset.filter){filter=button.dataset.filter;renderR1();return;}
 if(button.dataset.select){const id=button.dataset.select;selected.has(id)?selected.delete(id):selected.add(id);button.setAttribute('aria-pressed',String(selected.has(id)));button.innerHTML=icon(selected.has(id)?'check':'square');updateSelection();return;}
 if(button.id==='clear-selection'){selected.clear();renderR1();return;}
 if(button.id==='approve-selected'){if(selected.size)startJob([...selected]);return;}
 if(button.dataset.approve){document.getElementById('preview').close();startJob([button.dataset.approve]);return;}
 if(button.dataset.preview){showPreview(button.dataset.preview);return;}
 if(button.dataset.memberReport){showPreview(button.dataset.memberReport,true);return;}
 if(button.hasAttribute('data-close')){document.getElementById('preview').close();return;}
 if(button.dataset.retry!==undefined){retryJob(Number(button.dataset.retry));return;}
 if(button.hasAttribute('data-retry-all')){retryJob();return;}
 if(button.hasAttribute('data-back')){go('r1');return;}
 if(button.dataset.regenerate){const n=Number(button.dataset.regenerate);startJob(Array.from({length:n===5?2:7},(_,i)=>`regen-${i}`),'재생성',`${n}회차`);return;}
 if(button.dataset.resend){startJob(['doyoon'],'메일 재발송',`${button.dataset.resend}회차`);return;}
 if(button.hasAttribute('data-open-three')||button.dataset.work){filter='all';renderR1();go('r1');const n=button.dataset.work||3;const detail=document.querySelector(`[data-session="${n}"]`);detail.open=true;detail.scrollIntoView({block:'start'});}
});
document.addEventListener('change',event=>{if(event.target.id==='measurement-case'){caseKey=event.target.value;renderT1();const url=new URL(location.href);url.searchParams.set('case',caseKey);history.replaceState({},'',url);}});
function readLocation(){const q=new URLSearchParams(location.search);caseKey=['data-loss','no-consent'].includes(q.get('case'))?q.get('case'):'default';renderT1();go(q.get('screen')||'r1',false);if(q.get('index')==='1')renderIndex();}
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
renderR1();defaultJob();renderR2();renderT2();readLocation();window.addEventListener('popstate',readLocation);
