 input{width:100px}.tools label{font-size:12px}.tools select{max-width:130px}th,td{padding:10px}.tablebox th:first-child,.group th:first-child{width:30%}th:last-child{width:64px}td strong{font-size:13px}td small{font-size:11px}td .evidence{font-size:11px}.desktop-col{display:none}.storygrid{grid-template-columns:1fr;gap:12px}.story{padding:16px}.story .action{font-size:13px}.sheetback{align-items:flex-end}.sheet{width:100%;height:90dvh;border-radius:24px 24px 0 0;padding:16px}.sheet header{top:-16px}.sheet .hero h2{font-size:17px}.member-main{padding:16px}.detailmeta{font-size:12px}.pager button{padding:8px 12px}.group>summary{padding:16px}.group>summary small{display:block;margin:6px 0 0 16px}.statebar{gap:6px;font-size:12px}body{overflow-wrap:anywhere}}</style></head><body><aside class="side"><strong>MIND BREEZE</strong><span>⌂ 홈</span><span>▦ 클래스 관리</span><span>▤ 리포트</span><span class="active">데이터 현황</span><small>안 2 · 이야기 카드<br>디자인 비교용 정적 HTML</small></aside><main></main><div id="overlay" class="sheetback" hidden onclick="if(event.target===this)closeSheet()"><section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="회차 상세"></section></div><script>const variant=2;
const titles=['아침 호흡','마음 돌봄','저녁 이완','점심 쉼','감각 깨우기','느린 호흡','마음 관찰','바디 스캔','하루 돌아보기','고요한 쉼'];
const sessions=Array.from({length:20},(_,i)=>({id:i,title:titles[i%10],seq:Math.floor(i/10)+3,date:`10.${String(31-i).padStart(2,'0')}`,state:i===0?'live':i===1||i===2?'warn':'ok'}));
const people=Array.from({length:40},(_,i)=>({id:i,name:`참여자 ${String(i+1).padStart(2,'0')}`,state:i<2?'warn':i===2?'unknown':i===3?'excluded':'ok'}));
let participantExpanded=false;
let mode='coach',page=0,pp=0,mp=0,picked=0,selected=1,query='',filter='',pq='',pf='',scenario='mixed',opened=null,trigger=null;
const $=s=>document.querySelector(s);
const labels={warn:'! 확인 필요',ok:'모두 수신',live:'◷ 측정 진행 중',unknown:'기대량 미확인',excluded:'수집 제외'};
const stories={warn:'회차가 끝났고 2명에게 앱 재접속 안내가 필요해요.',live:'측정 중이며 현재 받은 기록을 확인했어요. 코치는 수신을 기다려 주세요.',ok:'확인된 기대 범위는 모두 수신됐어요. 추가 조치는 없어요.'};
function badge(s){return `<span class="badge ${s}">${labels[s]}</span>`}
function bar(s){return `<div class="bar ${s==='unknown'?'unknown':''}" ${s==='unknown'?'role="img" aria-label="기대량 미확인으로 진행량 표시 불가"':`role="progressbar" aria-label="${s==='live'?'현재 확인된 범위':'feature 수신 진행'}" aria-valuemin="0" aria-valuemax="7200" aria-valuenow="${s==='ok'?7200:s==='live'?3400:6900}"`}><i style="width:${s==='unknown'?0:s==='ok'?100:s==='live'?47.2:95.8}%"></i></div>`}
function evidence(s='warn'){return s==='unknown'?'feature 6,900창 수신 · 전체 기대량 미확인':s==='ok'?'참여자 38/38명 · feature 7,200/7,200창 · 원시 360/360건':s==='live'?'현재 범위 참여자 24/38명 · feature 3,400/7,200창 · 원시 168/360건':'참여자 38/38명 · feature 6,900/7,200창 · 원시 345/360건'}
function pager(index,total,fn,unit='건'){const max=Math.max(1,Math.ceil(total/10));return `<div class="pager"><button onclick="${fn}(-1)" ${index===0?'disabled':''}>← 이전</button><span>${total?index*10+1:0}–${Math.min((index+1)*10,total)} / ${total}${unit} · ${index+1}/${max}쪽</span><button onclick="${fn}(1)" ${(index+1)*10>=total?'disabled':''}>다음 →</button></div>`}
function pageHeader(){return `<div class="specimen"><span>SDD-265 · 안 ${variant} · 가상 예시 / 서버 연동 없음</span><nav><a href="안1.html">안 1</a><a href="안2.html">안 2</a><a href="안3.html">안 3</a></nav></div><header><h1>${mode==='member'?'내 데이터 저장 현황':'데이터 현황'}</h1><button onclick="refresh()">↻ 새로고침</button></header><nav class="viewnav" aria-label="시안 화면"><button class="${mode==='coach'?'selected':''}" onclick="setMode('coach')">코치 · 회차 목록</button><button class="${mode==='detail'?'selected':''}" onclick="setMode('detail')">코치 · 회차 상세</button><button class="${mode==='member'?'selected':''}" onclick="setMode('member')">회원</button></nav>`}
function refresh(){ $('#updated').textContent='예시 조회 시각 14:33:00 · 실제 요청 없음'; }
function setMode(m){mode=m;if(m==='detail')scenario='mixed';query='';filter='';pq='';pf='';page=0;pp=0;render();window.scrollTo(0,0)}
function sessionRow(s){return `<tr class="session-row"><td><strong>${s.title}</strong><small>${s.date} · ${s.seq}회차<br>김서연 코치</small></td><td><span>${stories[s.state]}</span><div class="evidence">${evidence(s.state)}</div>${bar(s.state==='warn'?'unknown':s.state)}</td><td><button class="row-open" aria-label="${s.title} 상세" onclick="openSheet(${s.id},this)">↗</button></td></tr>`}
function table(rows){return `<div class="tablebox"><table><thead><tr><th>회차 · 담당 코치</th><th>상황 · 수신 근거</th><th>상세</th></tr></thead><tbody>${rows.map(sessionRow).join('')}</tbody></table>${rows.length?'':'<p class="empty">조건에 맞는 회차가 없어요.</p>'}</div>`}
function tools(part=false){return `<div class="tools"><input aria-label="${part?'참여자':'회차'} 검색" value="${part?pq:query}" placeholder="${part?'참여자 이름':'회차 이름'} 검색" oninput="search(this,${part})"><label>상태 <select aria-label="${part?'참여자':'회차'} 상태" onchange="filterChange(this,${part})"><option value="">전체</option>${(part?['warn','ok','unknown','excluded']:['warn','live','ok']).map(s=>`<option value="${s}" ${(part?pf:filter)===s?'selected':''}>${labels[s]}</option>`).join('')}</select></label></div>`}
function search(el,part){let pos=el.selectionStart;if(part){pq=el.value;pp=0}else{query=el.value;page=0}if(opened!==null)sheetRender();else render();const n=document.querySelector(`input[aria-label="${part?'참여자':'회차'} 검색"]`);n.focus();n.setSelectionRange(pos,pos)}
function filterChange(el,part){if(part){pf=el.value;pp=0}else{filter=el.value;page=0}if(opened!==null)sheetRender();else render()}
function changePage(d){page+=d;render();document.querySelector('input').focus()}
function participantPage(d){pp+=d;if(opened!==null)sheetRender();else render();document.querySelector('#participants input').focus()}
function memberPage(d){mp+=d;render()}
function coach(){const all=sessions.filter(s=>s.title.includes(query)&&(!filter||s.state===filter));const rows=all.slice(page*10,page*10+10);return `<section class="hero"><div class="label">${query||filter?'검색·필터 결과':'최근 회차'} · 현재 페이지 ${rows.length}회차</div><h2>${rows.some(s=>s.state==='warn')?`확인이 필요한 ${rows.filter(s=>s.state==='warn').length}회차가 있어요. 코치는 참여자에게 앱 재접속을 안내해 주세요.`:'이 페이지의 수신 상황을 확인해 주세요.'}</h2><p>상세에서 대상과 근거를 확인할 수 있어요.</p></section>${tools()}<p class="scope">최근순 · 한 페이지 최대 10회차 · 서버 수신 기준</p>${variant===1?table(rows):variant===2?`<div class="storygrid">${rows.map(s=>`<article class="card story session-card"><div class="line"><strong>${s.title} · ${s.seq}회차</strong>${badge(s.state)}</div><small>${s.date} · 김서연 코치</small><p>${s.state==='live'?'측정이 진행 중이에요.':'회차가 끝났어요.'} ${s.state==='warn'?'2명의 수신 근거 확인이 필요해요.':s.state==='live'?'현재 받은 기록을 확인했어요.':'확인된 기대 범위는 모두 수신됐어요.'}</p><div class="evidence">${evidence(s.state)}</div>${bar(s.state==='warn'?'unknown':s.state)}<p class="action">${s.state==='warn'?'코치는 참여자에게 앱 재접속을 안내해 주세요.':s.state==='live'?'코치는 수신을 기다려 주세요.':'추가 조치는 없어요.'}</p><button onclick="openSheet(${s.id},this)">이 회차 자세히 보기 →</button></article>`).join('')}</div><details class="group" style="margin-top:14px"><summary>같은 10회차를 표로 보기</summary>${table(rows)}</details>`:['warn','live','ok'].map(state=>{let group=rows.filter(s=>s.state===state);return `<details class="group" ${state==='warn'?'open':''}><summary>${state==='warn'?'확인 필요':state==='live'?'수신 대기':'그 외'} · ${group.length}회차<small>${state==='warn'?'참여자에게 앱 재접속 안내':state==='live'?'현재 수신을 기다리는 회차':'확인된 기대 범위 모두 수신'}</small></summary>${table(group)}</details>`}).join('')}${pager(page,all.length,'changePage')}<p class="foot">확인 필요 회차는 대상 범위 미확인 1명이 있어 전체 진행량을 표시하지 않아요. 수치는 대상이 확인된 38명 기준이며 기대량 미확인 1명의 기록은 합산하지 않아요. feature와 원시는 별도 근거이며 진행 막대는 feature 기준이에요.</p>`}
function personStory(p){return p.state==='warn'?'받은 기록 사이에 빈 구간이 있어요. 코치는 앱 재접속을 안내해 주세요.':p.state==='unknown'?'수신 기록은 있지만 전체 기대량이 미확인이에요.':p.state==='excluded'?'이번 회차는 수집 제외예요. 추가 조치는 없어요.':'확인된 기대 범위 모두 수신 · 추가 조치 없음'}
function participantTable(){const all=people.filter(p=>p.name.includes(pq)&&(!pf||p.state===pf));let rows=all.slice(pp*10,pp*10+10);return `<section id="participants"><div class="line"><h3>참여자 40명</h3><small>한 페이지 10명</small></div><p class="scope">전체: 모두 수신 36 · 확인 필요 2 · 기대량 미확인 1 · 수집 제외 1</p>${tools(true)}<div class="tablebox"><table><thead><tr><th>참여자</th><th>상황 · 다음 행동</th><th>근거</th></tr></thead><tbody>${rows.map(p=>`<tr class="person-row"><td><strong>${p.name}</strong><small>${labels[p.state]}</small></td><td>${personStory(p)}</td><td><button class="row-open" aria-expanded="false" aria-label="${p.name} 근거" onclick="togglePerson(this)">⌄</button></td></tr><tr class="inline-detail" hidden><td colspan="3"><p>${p.state==='excluded'?'미착용·해당 수집 동의 제외는 밴드 수집 제외, 마이크 OFF는 음성 수집 제외예요. 서로 다른 수집 범위를 구분하며 재접속 안내 대상이 아니에요.':p.state==='unknown'?'feature 180창 수신 · 기대량 미확인 / 원시 9건 수신 · 기대량 미확인':p.state==='warn'?`feature 120/270창 · EEG ${p.id===0?3:4}/6건 · PPG ${p.id===0?3:4}/6건 · ACC ${p.id===0?4:3}/6건` :'feature 185/185창 · EEG 3/3건 · PPG 3/3건 · ACC 3/3건'}</p><p>마지막 수신 14:32:05 · 폰 대기량 미확인 · 리포트 반영 여부는 별도예요.</p></td></tr>`).join('')}</tbody></table>${rows.length?'':'<p class="empty">조건에 맞는 참여자가 없어요.</p>'}</div>${pager(pp,all.length,'participantPage','명')}</section>`}
function togglePerson(b){let row=b.closest('tr').nextElementSibling;row.hidden=!row.hidden;b.setAttribute('aria-expanded',String(!row.hidden))}
function stateControls(){return variant===1?`<label class="statebar">상태 변주<select aria-label="상태 변주" onchange="scenario=this.value;if(opened!==null)sheetRender();else render()">${[['mixed','일부 확인 필요'],['ok','모두 수신'],['unknown','기대량 미확인'],['live','측정 진행 중'],['offline','오프라인'],['error','조회 실패']].map(([v,t])=>`<option value="${v}" ${v===scenario?'selected':''}>${t}</option>`).join('')}</select></label>`:''}
function detail(){const s=sessions[opened===null?selected:opened];let st=variant===1?scenario:s.state==='warn'?'mixed':s.state;let unknown=st==='unknown',failed=['offline','error'].includes(st);let sentence=failed?'최신 현황을 확인하지 못했어요. 코치는 연결을 확인한 뒤 새로고침해 주세요.':unknown?'수신 기록은 있지만 전체 기대량이 미확인이에요. 코치는 최신 기록을 확인해 주세요.':st==='ok'?'확인된 기대 범위는 모두 수신됐어요. 추가 조치는 없어요.':st==='live'?stories.live:'2명의 수신 근거 확인이 필요해요. 코치는 해당 참여자에게 앱 재접속을 안내해 주세요.';return `${stateControls()}<div class="crumb">마음 돌봄 클래스 &gt; ${s.title} ${s.seq}회차 (김서연 코치)</div><section class="hero detailhero"><div class="label">${failed?'마지막 성공 조회 14:32:08 · 이전 결과':st==='live'?'측정 진행 중 · 잠정 범위':'회차 종료 · 서버 수신 기준'}</div><h2>${sentence}</h2><p class="evidence">${evidence(unknown?'unknown':st==='ok'?'ok':st==='live'?'live':'warn')}</p>${bar(unknown||st==='mixed'||failed?'unknown':st==='ok'?'ok':st==='live'?'live':'warn')}<p class="state-note">${unknown?'일부 기대량이 미확인이므로 전체 진행량을 표시하지 않아요.':st==='live'?'현재 확인된 범위예요. 최종 기대량은 아직 확정되지 않았어요.':st==='ok'?'막대는 feature 기준 · 원시 EEG 120/120 · PPG 120/120 · ACC 120/120건':'참여자 40명 중 대상 확인 38명 · 대상 범위 미확인 1명 · 수집 제외 1명. feature·원시는 확인된 기대 범위 기준 / 원시 EEG·PPG·ACC 각 115/120건. 전체 진행량 미확인'}</p><details class="guide"><summary>수신 근거와 역할별 안내</summary><p>${st==='ok'?'추가 조치는 없어요. 수신 근거를 확인할 수 있어요.':st==='live'?'코치: 수신을 기다려 주세요. 회원: 앱을 켠 채 측정을 이어가 주세요.':unknown?'코치: 새로고침으로 최신 기록을 확인해 주세요. 회원: 현재 받은 기록을 확인할 수 있어요.':failed?'코치·회원: 화면의 인터넷 연결을 확인한 뒤 새로고침해 주세요. 참여자 폰 상태는 알 수 없어요.':'코치: 참여자에게 앱 재접속과 와이파이 연결을 안내해 주세요. 회원: 앱을 켜 둔 채 와이파이에 연결하고, 측정 종료 후에도 같으면 앱을 다시 실행해 주세요.'}</p><p>기관관리자: 담당 김서연 코치에게 확인해 주세요.</p><p>폰 대기량과 지연 원인은 미확인 · 수집 제외는 조치 대상이 아니에요.</p>${st==='mixed'?'<button onclick="copyGuide(this)">안내 문구 복사</button>':''}</details></section>${st!=='mixed'?'<p class="scope">상태 변주 단독 예시 · 참여자 표는 일부 확인 필요 예시에서 확인해요.</p>':variant===2?`<details class="group" ${participantExpanded?'open':''} ontoggle="if(this.isConnected)participantExpanded=this.open"><summary>참여자 40명 보기 · 10명씩</summary>${participantTable()}</details>`:variant===3?`<details class="group" open><summary>참여자 확인 · 2명 확인 필요 / 전체 40명</summary>${participantTable()}</details>`:participantTable()}`}
function copyGuide(b){const t='측정을 마쳤다면 앱을 켜 둔 채 와이파이에 연결해 주세요. 이후에도 같으면 앱을 다시 실행해 확인해 주세요.';if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>b.textContent='문구 복사됨').catch(()=>b.textContent='위 안내문을 선택해 복사해 주세요');else b.textContent='위 안내문을 선택해 복사해 주세요'}
function member(){let s=sessions[picked];let pending=picked===0;return `<div class="crumb">내 클래스 &gt; ${s.title} ${s.seq}회차 · ${s.date}</div><section class="hero"><div class="label">내 데이터 · 서버 수신 기준</div><h2>${pending?'서버에 등록된 3건의 수신을 기다리고 있어요. 앱을 켠 채 와이파이 연결을 유지해 주세요.':'확인된 기대 범위는 모두 수신됐어요. 추가 조치는 없어요.'}</h2><p class="evidence">feature ${pending?'174/180':'180/180'}창 · 원시 ${pending?'6/9':'9/9'}건</p>${bar(pending?'warn':'ok')}<small>막대는 본인 feature ${pending?'174/180':'180/180'}창 기준</small><details class="guide" ${variant===2?'open':''}><summary>내 수신 근거 보기</summary><p>EEG ${pending?'2':'3'}/3 · PPG ${pending?'2':'3'}/3 · ACC ${pending?'2':'3'}/3건</p><p>서버 등록 대기 ${pending?'3':'0'}건 · 폰 대기량 미확인</p>${pending?'<p>측정 종료 후에도 같은 상태라면 앱을 다시 실행해 확인해 주세요.</p>':'<p>추가 조치는 없어요.</p>'}</details></section><details class="card member-list" open><summary>최근 참여 회차 · 10건씩 선택</summary>${sessions.slice(mp*10,mp*10+10).map(s=>`<div class="member-row"><span>${s.title} · ${s.seq}회차<small style="display:block">${s.date} · ${s.id===0?'서버 등록 3건 대기':'모두 수신'}</small></span><button aria-pressed="${picked===s.id}" onclick="picked=${s.id};render()">${picked===s.id?'선택됨':'선택'}</button></div>`).join('')}</details>${pager(mp,sessions.length,'memberPage')}<p class="foot">회원에게는 선택한 회차의 본인 기록만 표시해요.</p>`}
function render(){const main=$('main');main.className=mode==='member'?'member-main':'';$('.side').hidden=mode==='member';main.innerHTML=pageHeader()+(mode==='coach'?coach():mode==='detail'?detail():member())+'<p class="foot" id="updated" role="status">예시 마지막 조회 14:32:08 · 서버에서 받은 기록 기준</p>';if(mode==='member')document.querySelector('.member-main .bar').outerHTML=`<div class="bar" role="progressbar" aria-label="본인 feature 수신 진행" aria-valuemin="0" aria-valuemax="180" aria-valuenow="${picked===0?174:180}"><i style="width:${picked===0?96.67:100}%"></i></div>`;}
function openSheet(id,b){trigger=b;opened=id;pp=0;pq='';pf='';scenario=sessions[id].state==='live'?'live':sessions[id].state==='ok'?'ok':'mixed';$('#overlay').hidden=false;document.body.classList.add('lock');$('main').inert=true;$('.side').inert=true;sheetRender();$('#close').focus()}
function sheetRender(){$('#sheet').innerHTML='<header><h2>회차 상세</h2><button id="close" onclick="closeSheet()">닫기 ✕</button></header>'+detail()}
function closeSheet(){$('#overlay').hidden=true;$('#sheet').innerHTML='';document.body.classList.remove('lock');$('main').inert=false;$('.side').inert=false;opened=null;if(trigger?.isConnected)trigger.focus()}
document.addEventListener('keydown',e=>{if(opened!==null&&e.key==='Escape')closeSheet();if(opened!==null&&e.key==='Tab'){let a=[...$('#sheet').querySelectorAll('button,input,select,summary,a')].filter(x=>x.getClientRects().length&&!x.disabled),first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script></body></html>
