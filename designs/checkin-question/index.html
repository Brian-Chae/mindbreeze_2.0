*{box-sizing:border-box}body{margin:0;font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",sans-serif;background:#F5EDFC;color:#241B2E}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #B373EF;outline-offset:4px}button{min-height:48px} .compare{padding:40px;max-width:1600px;margin:auto}.eyebrow{font-size:13px;letter-spacing:.13em;font-weight:700}.compare h1{font-size:40px;margin:12px 0}.intro{color:#51415D;line-height:1.7}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.tools button,.tools a{background:white;color:#5F0080;border:1px solid #D2AEFC;border-radius:12px;padding:14px;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.tile h2{font-size:24px}.tile p{line-height:1.6;min-height:52px}.tile iframe{display:block;width:390px;max-width:100%;height:844px;border:0;border-radius:24px;box-shadow:0 12px 40px #241B2E22;background:#241B2E}.links{display:flex;gap:16px;margin:20px 0}.links a{color:#5F0080;min-height:48px;padding:14px 0} .screen{min-height:100svh;position:relative;isolation:isolate;display:flex;flex-direction:column;background:#180C24;color:#F7F4F0;overflow:hidden}.photo{position:absolute;inset:0;z-index:-2;background:url('../../frontend/public/images/background3.webp') center/cover}.scrim{position:absolute;inset:0;z-index:-1;background:rgba(18,8,28,.76)}.topbar{height:100px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 48px}.topbar button{border:1px solid #CFC6D6;background:#180C24;color:#F7F4F0;width:48px;border-radius:50%;font-size:23px}.progress{display:flex;align-items:center;gap:8px}.progress i{width:7px;height:7px;background:#CFC6D6;border-radius:100%}.progress i.active{width:27px;background:#D2AEFC}.topmeta{display:flex;flex-direction:column;align-items:center;gap:12px}.topmeta span{font-size:12px;color:#F7F4F0}.content{flex:1;width:min(100% - 48px,560px);margin:30px auto 24px;display:flex;flex-direction:column;justify-content:center}.head h1{font-size:40px;line-height:1.3;letter-spacing:-.035em;margin:0;font-weight:800;word-break:keep-all}.head p{font-size:16px;line-height:1.6;margin:14px 0 0;color:#F7F4F0}.stages{display:flex;gap:0;margin:28px 0 22px;list-style:none;padding:0}.stages li{flex:1;padding:12px 0;text-align:center;font-size:14px;color:#CFC6D6;border-bottom:2px solid #CFC6D6}.stages li.current{color:#F7F4F0;border-color:#D2AEFC;font-weight:800}.options{display:flex;flex-direction:column;gap:10px}.option{background:#F7F4F0;color:#241B2E;border:2px solid transparent;border-radius:16px;min-height:58px;padding:15px 22px;display:flex;align-items:center;gap:16px;text-align:left;font-size:18px;font-weight:600;line-height:1.4}.radio{width:20px;height:20px;border:2px solid #6E1A8C;border-radius:50%;flex:none}.option[aria-checked=true]{background:#5F0080;color:#FFFFFF;border-color:#D2AEFC}.option[aria-checked=true] .radio{border-color:white;box-shadow:inset 0 0 0 4px #5F0080;background:white}.foot{display:flex;flex-direction:column;gap:6px;margin-top:28px}.next{background:#5F0080;color:white;border:1px solid #D2AEFC;border-radius:999px;font-size:17px;font-weight:700;min-height:56px}.next:disabled{background:#F5EDFC;color:#51415D;border-color:#CFC6D6;cursor:default}.skip{background:transparent;border:0;color:#F7F4F0;font-size:15px;text-decoration:underline;text-underline-offset:4px}.a .head{text-align:center}.a .content{width:min(100% - 48px,520px)}.b .scrim{background:rgba(18,8,28,.35)}.b .content{background:#F7F4F0;color:#241B2E;border-radius:24px;padding:36px 40px;max-width:620px;margin:12px auto 36px}.b .head h1{font-size:36px}.b .head p{color:#51415D}.b .stages{order:-1;margin:0 0 28px}.b .stages li{color:#51415D;border-color:#CFC6D6}.b .stages li.current{color:#5F0080;border-color:#5F0080}.b .options{gap:0;margin-top:26px;border:1px solid #CFC6D6;border-radius:16px;overflow:hidden}.b .option{border-radius:0;background:#FFFFFF;border:0;border-bottom:1px solid #CFC6D6;min-height:60px}.b .option:last-child{border-bottom:0}.b .option[aria-checked=true]{background:#5F0080;color:white}.b .skip{color:#5F0080}.b .foot{margin-top:24px}.c .content{width:min(100% - 48px,1000px)}.c .head{text-align:center}.c .head h1{font-size:44px}.c .stages{max-width:560px;width:100%;align-self:center;margin:32px 0 42px}.c .stages li{border:0;color:#F7F4F0}.c .stages li.current{background:#F5EDFC;color:#5F0080;border-radius:999px}.c .options{flex-direction:row;gap:0;background:#F7F4F0;border-radius:24px;padding:8px}.c .option{flex:1;justify-content:center;border-radius:18px;background:transparent;padding:32px 10px;min-height:112px;text-align:center;border:0;border-right:1px solid #CFC6D6}.c .option:last-child{border:0}.c .option .radio{display:none}.c .option[aria-checked=true]{background:#5F0080;box-shadow:0 0 0 2px #D2AEFC}.c .foot{width:400px;max-width:100%;align-self:center;margin-top:56px}.note{width:100%;min-height:170px;background:#F7F4F0;color:#241B2E;border:1px solid #6E1A8C;border-radius:16px;padding:20px;font-size:17px}.count{text-align:right;color:inherit;font-size:14px}.result{background:#F7F4F0;color:#241B2E;padding:24px;border-radius:16px;line-height:1.7}.design-label{position:fixed;bottom:8px;left:12px;font-size:11px;background:#180C24;color:#F7F4F0;padding:4px 8px;border-radius:8px}
@media(max-width:700px){.compare{padding:24px}.compare h1{font-size:30px}.grid{grid-template-columns:1fr}.topbar{height:88px;padding:0 20px}.content{margin:14px auto 20px;width:calc(100% - 40px);justify-content:center}.head h1,.b .head h1,.c .head h1{font-size:28px}.head p{font-size:15px;margin-top:12px}.stages{margin:26px 0 20px}.stages li{font-size:13px}.option{font-size:18px;min-height:58px;padding:14px 18px}.foot{margin-top:24px}.a .content{width:calc(100% - 40px)}.b .content{width:calc(100% - 32px);padding:26px 20px;margin:8px auto 24px;flex:0}.b .stages{margin-bottom:26px}.b .head h1{font-size:28px}.b .option{min-height:60px}.b .options{margin-top:24px}.b .foot{margin-top:22px}.c .content{width:calc(100% - 40px)}.c .stages{margin:26px 0}.c .options{flex-direction:column;padding:6px;border-radius:22px}.c .option{justify-content:flex-start;text-align:left;min-height:58px;padding:14px 20px;border-right:0;border-bottom:1px solid #CFC6D6;border-radius:0}.c .option:first-child{border-radius:16px 16px 0 0}.c .option:last-child{border-radius:0 0 16px 16px}.c .option[aria-checked=true]{border-radius:16px;box-shadow:none}.c .foot{margin-top:28px}.design-label{display:none}}
</style></head><body>
<script src="survey-data.js"></script><script>
const params=new URLSearchParams(location.search),variant=params.get('v');
const names={A:['질문이 먼저','큰 질문과 밝은 단색 카드. 한 문장과 한 선택에 집중합니다.'],B:['한 장에 모으기','불투명한 종이색 패널. 사진의 밝기와 무관하게 안정적으로 읽습니다.'],C:['느낌의 흐름','단어로 이어지는 다섯 단계. 데스크톱은 가로, 모바일은 세로로 고릅니다.']};
if(!variant){document.body.innerHTML=`<main class="compare"><div class="eyebrow">MIND BREEZE · CHECK-IN STUDY</div><h1>지금의 마음을, 더 또렷하게.</h1><p class="intro">체크인 질문 화면 · 디자인 검토용 시안 3안<br>모든 안은 같은 문항·선택 값·진행 규칙을 사용합니다. 아래 화면에서 직접 선택할 수 있습니다.</p><div class="tools"><button onclick="setAll('arousal',false)">집중 · 선택 전</button><button onclick="setAll('arousal',true)">집중 · 선택 후</button><button onclick="setAll('emotion',false)">감정 · 선택 전</button><button onclick="setAll('emotion',true)">감정 · 선택 후</button></div><div class="grid">${Object.entries(names).map(([k,n])=>`<section class="tile"><h2>${k} / ${n[0]}</h2><p>${n[1]}</p><iframe title="${k} 모바일 시안" src="?v=${k}"></iframe><div class="links"><a href="?v=${k}" target="_blank">전체 화면 열기 ↗</a><a href="screenshots/${k}-desktop-emotion-selected.png">데스크톱 캡처 ↗</a></div></section>`).join('')}</div><p class="intro">상단 점 = 클래스 입장 전체 진행 · 네 항목 = 체크인 내부 진행(클릭 탭 아님). 숫자 점수는 표시하지 않습니다.<br>건너뛰기는 다음 문항으로 넘어가는 동작이 아니라 기존 onSkip 종료 콜백을 모사합니다. 실제 저장·입장은 연결하지 않습니다.</p></main>`;window.setAll=(q,s)=>document.querySelectorAll('iframe').forEach((f,i)=>f.src=`?v=${['A','B','C'][i]}&q=${q}&selected=${s?'4':''}`)}else{
let step=Math.max(0,surveyData.findIndex(q=>q.axis===params.get('q'))),draft={arousal:null,valence:null,emotion:null,note:''};if(params.get('selected'))draft[surveyData[step].axis]=Number(params.get('selected'));
const render=()=>{const q=surveyData[step],isNote=step===3;document.body.innerHTML=`<main class="screen pz-root ${variant.toLowerCase()}"><div class="photo"></div><div class="scrim"></div><header class="topbar"><button aria-label="이전" id="back">‹</button><div class="topmeta"><span>클래스 입장 준비</span><div class="progress" aria-label="전체 입장 진행 중 체크인 단계">${[0,1,2,3,4].map(i=>`<i class="${i===2?'active':''}"></i>`).join('')}</div></div><button aria-label="나가기" id="exit">×</button></header><section class="content"><div class="head"><h1>${isNote?'상담사에게 전하고 싶은 말이 있나요?':q.heading}</h1><p>${isNote?'선택이에요. 적지 않아도 괜찮아요.':'가장 가까운 느낌을 하나 골라 주세요.'}</p></div><ol class="stages" aria-label="체크인 문항 진행">${['집중','편안함','감정','전할 말'].map((c,i)=>`<li class="${i===step?'current':''}" ${i===step?'aria-current="step"':''}>${c}</li>`).join('')}</ol>${isNote?`<textarea class="note" aria-label="상담사에게 전하고 싶은 말" maxlength="200" placeholder="예: 오늘 목이 조금 불편해서 소리를 내기 어려워요">${draft.note}</textarea><p class="count">${draft.note.length} / 200</p>`:`<div class="options" role="radiogroup" aria-label="${q.chip}">${q.options.map(o=>`<button class="option" role="radio" aria-checked="${draft[q.axis]===o.value}" data-value="${o.value}" tabindex="${draft[q.axis]===o.value||draft[q.axis]===null&&o.value===1?0:-1}"><span class="radio" aria-hidden="true"></span>${o.label}</button>`).join('')}</div>`}<footer class="foot"><button class="next" ${!isNote&&draft[q.axis]===null?'disabled':''}>${isNote?'남기고 계속하기':'다음'}</button><button class="skip">건너뛰기</button></footer></section><span class="design-label">시안 ${variant} · ${names[variant][0]}</span></main>`;
document.querySelectorAll('.option').forEach(b=>{b.onclick=()=>{draft[q.axis]=Number(b.dataset.value);render();document.querySelector('.option[aria-checked=true]').focus()};b.onkeydown=e=>{if(['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();let n=Number(b.dataset.value);n=e.key==='Home'?1:e.key==='End'?5:((n-1+(['ArrowDown','ArrowRight'].includes(e.key)?1:4))%5)+1;draft[q.axis]=n;render();document.querySelector('.option[aria-checked=true]').focus()}}});
const note=document.querySelector('.note');if(note)note.oninput=()=>{draft.note=note.value;document.querySelector('.count').textContent=note.value.length+' / 200'};
const end=kind=>{window.prototypeResult={kind,draft:structuredClone(draft)};document.querySelector('.content').innerHTML=`<div class="result" role="status">${kind==='skip'?'onSkip':'onNext'} コールバック相当<br>デザイン確認用の終点</div>`.replace('コールバック相当','콜백에 해당하는 동작').replace('デザイン確認用の終点','시안 확인용 종료 지점입니다. 실제 저장·입장은 실행하지 않습니다.')};document.querySelector('.next').onclick=()=>{if(step<3){step++;render()}else end('next')};document.querySelector('.skip').onclick=()=>end('skip');document.querySelector('#back').onclick=()=>{if(step>0){step--;render()}else end('back')};document.querySelector('#exit').onclick=()=>end('exit');};render();}
</script></body></html>
