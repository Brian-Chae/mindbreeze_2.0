function review(){return state==='empty'?'':`<section class="review" id="reports"><div><b>검토를 기다리는 리포트가 3건 있어요</b><p>완료된 기록을 확인하고 리포트를 전달해 주세요.</p></div>${btn('리포트 검토 →','리포트 검토 /reports?status=pending','primary')}</section>`}
function hero(){let empty=state==='empty',live=state==='live';return `<section class="hero" aria-label="다음 일정"><div><div class="chips"><span class="chip">${empty?'예정 없음':live?'진행 중':'다음 일정'}</span>${empty?'':`<span class="chip">${live?'진행 중 회차':'오늘 오후 3:00'}</span>`}</div><h2>${empty?'오늘, 새로운 클래스를<br>열어 볼까요?':state==='long'?'마음의 소리를 천천히 알아차리는 일상 속 마음챙김 명상 클래스 · 4회차':'고요하게 시작하는<br>아침 명상 · 4회차'}</h2><p>${empty?'일정이 없어도 바로 시작할 수 있어요.':'10월 22일 (목) 오후 3:00'}</p><div class="hero-guide">${empty?'새 클래스에서 여러 회차를 미리 편성할 수도 있어요.':live?'진행 중인 회차를 이어서 운영해 주세요.':'회차 상세에서 준비 상태와 참여자를 확인해 주세요.'}</div></div><div class="hero-action">${btn(empty?'지금 바로 시작':'회차 상세 보기',empty?'즉석 클래스 /classes/now':'회차 상세 /classes/sample/sessions/sample')}<small>${empty?'클래스 개설 화면으로 이동해요':live?'상세에서 진행·참관 권한에 맞게 이동':'열기·시작은 상세에서 권한 확인 후 진행'}</small></div></section>`}
function classes(){let missing=state==='missing';return `<section id="classes"><div class="sec-head"><h2>내 클래스</h2><a href="#" data-demo="전체 클래스 /classes">전체 보기 →</a></div><p class="section-sub">진행 중 · 준비 중을 먼저, 완료 클래스는 뒤에</p>${state==='empty'?`<div class="empty"><b>첫 클래스를 만들어 보세요</b><p>일정을 편성하고 회원과 함께 시작해요.</p>${btn('새 클래스 만들기','새 클래스 /classes/new','primary')}</div>`:state==='partial'?`<div class="error"><div><b>클래스를 불러오지 못했어요</b><p>다른 업무는 계속 이용할 수 있어요.</p></div><button class="btn" id="retry">다시 불러오기</button></div>`:`<div class="strip" tabindex="0" aria-label="내 클래스 가로 스크롤">${cards.map((c,i)=>`<article class="class-card"><a class="card-link" href="#" data-demo="클래스 상세 /classes/sample-${i}"><div class="card-top"><span class="chip">${c.status}</span><small>명상</small></div><h3>${missing&&i===1?'이름 없는 클래스':state==='long'&&i===0?'마음의 소리를 천천히 알아차리는 일상 속 마음챙김 명상 클래스':c.title}</h3>${missing&&i===1?`<div class="muted" style="font-size:13px;margin-bottom:20px">완료한 회차 2회</div>`:`<div class="progress-meta"><span>클래스 진행</span><span>${c.done} / ${c.total}회</span></div><progress value="${c.done}" max="${c.total}" aria-label="클래스 회차 진행"></progress>`}<div class="card-next"><b>${state==='live'&&i===0?'열린 회차가 있어요':c.seq?missing&&i===1?'다음 일정 확인 중':`다음 ${c.seq}회차`:'모든 회차를 마쳤어요'}</b>${state==='live'&&i===0?'<p>클래스 상세에서 진행 회차를 확인하세요.</p>':c.date&&!(missing&&i===1)?`<p>${c.date}</p><p>지도사 · ${c.host}</p>`:`<p>${c.seq?'일정이 정해지면 여기에 표시해요.':'클래스 상세에서 기록을 확인하세요.'}</p>`}</div></a></article>`).join('')}</div><div class="strip-tools"><small>좌우로 넘겨 모든 클래스 보기</small><button class="arrow" id="prev" aria-label="이전 클래스">←</button><button class="arrow" id="next" aria-label="다음 클래스">→</button></div>`}</section>`}
function schedule(){return `<section class="panel" id="schedule"><div class="sec-head"><h2>오늘 · 다가오는 일정</h2><a href="#" data-demo="일정 목록 /classes">전체 보기 →</a></div>${state==='empty'?'<p class="muted">예정된 일정이 없어요.</p>':[['15:00','오늘','고요하게 시작하는 아침 명상','4회차 · 명상'],['19:00','오늘','하루를 마무리하는 명상','2회차 · 명상'],['19:00','10/23','나를 돌보는 저녁의 시간','3회차 · 명상']].map(([t,d,title,sub])=>`<a class="schedule-row" href="#" data-demo="회차 상세 · ${title}"><div class="time">${t}<small>${d}</small></div><div class="row-text"><b>${title}</b><p>${sub}</p></div><span class="chip ${state==='live'&&sub==='4회차 · 명상'?'live':''}">${state==='live'&&sub==='4회차 · 명상'?'진행 중':'예정'}</span></a>`).join('')}${state==='empty'?'':`<div class="session-ops"><b>${state==='live'?'진행 중 · ':''}아침 명상 · 4회차</b><p>참여 8명 · 게스트 1명 · 가상 회차 코드 DEMO24</p><div class="actions">${btn('코드 복사','가상 회차 코드 DEMO24 · 시안은 복사 안내만 표시')}${btn(state==='live'?'진행·참관 확인':'참여자·회차 상세','회차 상세 /classes/sample/sessions/sample')}</div></div>`}<details class="past" ${state==='empty'?'hidden':''}><summary>지난 회차 · 기록 보기 →</summary><a class="schedule-row" href="#" data-demo="지난 회차 기록 /sessions/sample-past/record"><div class="row-text"><b>아침 명상 · 3회차</b><p>10월 20일 · 완료</p></div><span class="chip">기록 보기</span></a></details><details class="code" id="code"><summary><span>내 상담사 코드<br><b>DE••••</b></span><span>보기 +</span></summary><p><b>DEMO42</b> · 시안용 가상 코드<br>내담자와 상담 관계를 연결할 때 공유해 주세요.</p>${btn('코드 복사','가상 코드 DEMO42 · 실제 클립보드 복사는 수행하지 않음')}</details><div class="legacy-links"><a href="#" data-demo="AI 공개 시에만 노출 /chat/lucy">루시 브리핑</a><a href="#" data-demo="미완성 프로필에서만 안내 /onboarding/counselor">프로필 완성</a></div></section>`}
function messages(){return `<section class="panel" id="messages"><div class="sec-head"><h2>최근 대화</h2><a href="#" data-demo="최근 대화 /chat">전체 →</a></div>${state==='empty'?'<p class="muted">아직 대화가 없어요.</p>':[['가','가상 회원 A','오늘 클래스에서 뵐게요.','10분 전'],['나','가상 회원 B','안내 감사합니다.','1시간 전']].map(([a,n,t,d])=>`<a class="message" href="#" data-demo="대화방 /chat/sample"><span class="avatar">${a}</span><div><b>${n}</b><p>${t}</p><small>${d}</small></div></a>`).join('')}</section>`}
function notifications(){return `<section class="panel" id="notifications"><div class="sec-head"><h2>새 알림</h2><a href="#" data-demo="알림 /notifications">전체 →</a></div>${state==='empty'?'<p class="muted">새로운 알림이 없어요.</p>':`<a class="message" href="#" data-demo="알림 상세 · 읽음 처리 동작 유지"><div><b>새 리포트 검토 요청</b><p>아침 명상 · 3회차</p><small>30분 전</small></div></a><a class="message" href="#" data-demo="알림 상세"><div><b>클래스에 새 회원이 합류했어요</b><p>주말 마음챙김 클래스</p><small>2시간 전</small></div></a>`}</section>`}
function oldSchedule(){return `<section class="panel" id="schedule"><div class="sec-head"><h2>오늘 · 다가오는 일정</h2><small class="muted">오늘 2건</small></div>${[['15:00','오늘','고요하게 시작하는 아침 명상'],['19:00','오늘','하루를 마무리하는 명상'],['19:00','10/23','나를 돌보는 저녁의 시간']].map(([t,d,title])=>`<a class="schedule-row" href="#" data-demo="기존 회차 상세"><div class="time">${t}<small>${d}</small></div><div class="row-text"><b>${title}</b><p>명상 · 참여 1명</p></div><span class="chip">예정</span></a>`).join('')}</section>`}
function old(){return `<div class="old-grid"><div class="old-main"><section class="old-hero"><small>다음 세션</small><h2>고요하게 시작하는 아침 명상</h2><p>10. 22. 오후 03:00 · 참여자 1명</p><div class="actions">${btn('상세 보기','기존 회차 상세')}</div></section>${review()}${oldSchedule()}<section id="classes"><div class="sec-head"><h2>내 클래스</h2><a href="#" data-demo="클래스 목록">전체 보기</a></div><p class="section-sub">진행 중 · 예정</p><div class="old-cards">${['고요하게 시작하는 아침 명상','나를 돌보는 저녁의 시간','고요하게 시작하는 아침 명상','주말 마음챙김 클래스'].map(t=>`<article class="old-card"><b>${t}</b><span class="chip">예정</span><p>명상수업 · 참여 1명</p></article>`).join('')}</div><p class="muted" style="margin:16px 0 8px;font-size:12px">지난 세션</p><div class="old-cards"><article class="old-card"><b>고요하게 시작하는 아침 명상</b><span class="chip">완료</span><p>명상수업 · 참여 1명</p></article></div></section></div><div class="old-rail">${stats()}${messages()}${notifications()}<div class="panel"><small>내 상담사 코드</small><p style="color:var(--brand)">DE••••</p></div></div></div>`}
function render(){stripObserver?.disconnect();document.querySelector('.head .btn.soft').style.display=view==='current'?'none':'';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));select.disabled=view==='current';document.querySelector('#screen').innerHTML=`<div class="prototype-label"><b>${view==='current'?'현재 구성 · 코드 기반 재구성':'제안 A · 회원 홈과 같은 흐름, 상담사 업무는 그대로'}</b><span>샘플 데이터 · 1440 / 1194 / 390 대응</span></div>`+(view==='current'?old():`${hero()}${review()}${stats()}${classes()}<div class="work">${schedule()}<aside class="rail">${messages()}${notifications()}</aside></div>`)+`<p class="foot">디자인 검토용 · 실제 서비스 연결 없음 · ${view==='current'?'현행 코드의 구성·위계를 재현한 비교용 화면':'표시된 진행률은 완료 회차 비율이며 웰니스 점수가 아닙니다'}</p>`;const track=document.querySelector('.strip');if(track){const prev=document.querySelector('#prev'),next=document.querySelector('#next');const step=()=>track.querySelector('.class-card').offsetWidth+parseFloat(getComputedStyle(track).gap);const update=()=>{prev.disabled=track.scrollLeft<=2;next.disabled=track.scrollLeft>=track.scrollWidth-track.clientWidth-2};prev.onclick=()=>track.scrollTo({left:Math.max(0,track.scrollLeft-step()),behavior:'instant'});next.onclick=()=>track.scrollTo({left:track.scrollLeft+step(),behavior:'instant'});track.onscroll=update;stripObserver=new ResizeObserver(update);stripObserver.observe(track);update()}const retry=document.querySelector('#retry');if(retry)retry.onclick=()=>{state='normal';select.value=state;render()};window.__ready=true}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});select.onchange=()=>{state=select.value;render()};document.addEventListener('click',e=>{const target=e.target.closest('[data-demo]');if(target){e.preventDefault();document.querySelector('#demo-text').textContent=target.dataset.demo+' · 실제 이동·변경 없이 목적지만 표시합니다.';document.querySelector('#demo').showModal()}});render();
</script></body></html>
