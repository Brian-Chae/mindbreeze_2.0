<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>MIND BREEZE · 회원 시안 B — 입장 준비 · 시작 대기 · 종료</title>
<link rel="stylesheet" href="../class-player-redesign/tokens.css">
<link rel="stylesheet" href="flow-base.css">
<style>
/* 워커 전용 스타일(.w-) — flow-base.css 는 수정하지 않는다 */
html, body { height: 100dvh; overflow: hidden; background: #12081C; }
body { word-break: keep-all; overflow-wrap: break-word; }
:where(.fl-root, .w-scrim) :is(h1, h2, h3, p, ul) { margin: 0; padding: 0; }
:where(.fl-root, .w-scrim) ul { list-style: none; }
:where(.fl-root) button { padding: 0; }
:where(.fl-root) input, :where(.fl-root) textarea { font-family: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--mb-pale); outline-offset: 2px; }
.fl-root .fl-layer { right: var(--side, 0px); }
.fl-root .ic.s { width: 20px; height: 20px; }
.fl-chip .ic.s { width: 16px; height: 16px; }
@media (max-height: 760px) { .fl-body { padding-top: 8px; padding-bottom: 8px; } }

/* 상단·공통 */
.w-ph { display: block; width: 44px; height: 44px; visibility: hidden; }
.w-head { display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
.w-head .fl-sub { text-wrap: balance; }
.w-slot { min-height: 44px; margin: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
.w-c { padding: 0 16px; gap: 8px; }
.w-tag { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 9999px; font-size: var(--fs-12); font-weight: 700; line-height: 1; white-space: nowrap; background: rgba(255,255,255,0.14); color: var(--tx-mid); flex: none; }
.w-tag.req { background: rgba(179,115,239,0.28); color: var(--mb-pale); }
.fl-btn.w-mini { min-height: var(--tap); padding: 0 16px; font-size: var(--fs-13); }
.fl-btn .ic { width: 20px; height: 20px; }
.fl-btn.w-dark { background: var(--sheet-bg-strong); border: 1px solid var(--sheet-border); }
.fl-btn.done { background: rgba(125,227,200,0.12); border: 1px solid rgba(125,227,200,0.5); color: var(--ok); opacity: 1; }

/* FM06a */
.w-info { display: flex; flex-direction: column; gap: 8px; }
.w-irow { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 24px; font-size: var(--fs-15); }
.w-il { display: flex; align-items: center; gap: 8px; min-width: 0; }
.w-il b { font-weight: 700; white-space: nowrap; }
.w-il .ic { width: 20px; height: 20px; color: var(--mb-pale); flex: none; }
.w-iv { font-size: var(--fs-13); color: var(--tx-mid); text-align: right; white-space: nowrap; }
.w-checks { display: flex; flex-direction: column; gap: 8px; }
.w-check { display: flex; align-items: flex-start; gap: 16px; width: 100%; min-height: 56px; padding: 16px; border-radius: var(--r-card); text-align: left; background: rgba(255,255,255,0.08); border: 1px solid var(--sheet-border); }
.w-check[aria-checked="true"] { background: rgba(179,115,239,0.18); border-color: rgba(210,174,252,0.55); }
.w-box { flex: none; width: 24px; height: 24px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.55); display: grid; place-items: center; }
.w-box .ic { width: 16px; height: 16px; stroke-width: 3; display: none; }
.w-check[aria-checked="true"] .w-box { background: var(--mb-purple); border-color: var(--mb-pale); color: #fff; }
.w-check[aria-checked="true"] .w-box .ic { display: block; }
.w-ct { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.w-ct b { display: flex; align-items: center; gap: 8px; font-size: var(--fs-15); line-height: 24px; }
.w-ct .d { font-size: var(--fs-13); line-height: 20px; color: var(--tx-mid); }

/* FM06b */
.w-axes { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.w-ax { display: flex; flex-direction: column; gap: 8px; align-items: center; min-height: 32px; font-size: var(--fs-13); line-height: 20px; font-weight: 600; color: var(--tx-lo); white-space: nowrap; }
.w-ax i { display: block; width: 100%; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.25); }
.w-ax.on { color: var(--tx-hi); } .w-ax.on i { background: #fff; }
.w-ax.done { color: var(--tx-mid); } .w-ax.done i { background: var(--mb-lavender); }
.w-opts { display: flex; flex-direction: column; gap: 8px; }
.w-opt { display: flex; align-items: center; gap: 16px; min-height: 52px; padding: 0 16px; border-radius: var(--r-card); text-align: left; font-size: var(--fs-15); font-weight: 600; background: rgba(255,255,255,0.1); border: 1px solid var(--sheet-border); }
.w-opt[aria-checked="true"] { background: var(--mb-purple); border-color: var(--mb-pale); }
.w-radio { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); display: grid; place-items: center; }
.w-radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0; }
.w-opt[aria-checked="true"] .w-radio { border-color: #fff; } .w-opt[aria-checked="true"] .w-radio::after { opacity: 1; }
.fl-input.w-ta { height: 144px; padding: 16px; resize: none; line-height: 24px; }
.w-count { text-align: right; font-size: var(--fs-13); color: var(--tx-lo); }

/* FM06c */
.w-band { display: flex; flex-direction: column; gap: 16px; }
.w-bh { display: flex; align-items: center; gap: 16px; }
.w-bi { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; flex: none; background: rgba(179,115,239,0.22); color: var(--mb-pale); }
.w-bi.ok { background: rgba(125,227,200,0.16); color: var(--ok); }
.w-bi.warn { background: var(--warn-bg); color: var(--warn); }
.w-bi .ic { width: 28px; height: 28px; }
.w-bt { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.w-bt b { display: flex; align-items: center; gap: 8px; font-size: var(--fs-15); line-height: 24px; white-space: nowrap; }
.w-bb { min-height: 168px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.w-li { display: flex; align-items: center; gap: 16px; min-height: 48px; padding: 0 16px; border-radius: var(--r-card); background: rgba(255,255,255,0.06); font-size: var(--fs-15); }
.w-li .ic { flex: none; color: var(--mb-pale); }
.w-li.warn .ic { color: var(--warn); }
.w-li > span { min-width: 0; }
.w-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; flex: 1; }
.w-center .ic { width: 40px; height: 40px; color: var(--mb-pale); }
.w-center b { font-size: var(--fs-15); line-height: 24px; }
.w-center .d { font-size: var(--fs-13); line-height: 20px; color: var(--tx-mid); }
.w-spin { animation: wspin 1.1s linear infinite; }
@keyframes wspin { to { transform: rotate(360deg); } }
.w-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.w-tile { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--r-card); background: rgba(255,255,255,0.06); min-width: 0; }
.w-tile .l { display: flex; align-items: center; gap: 8px; font-size: var(--fs-13); color: var(--tx-mid); line-height: 20px; }
.w-tile .l .ic { width: 20px; height: 20px; }
.w-tile .v { font-size: var(--fs-15); font-weight: 700; line-height: 24px; }
.w-tile.ok .l .ic, .w-tile.ok .v { color: var(--ok); }
.w-segbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.w-segbar i { height: 4px; border-radius: 4px; background: rgba(255,255,255,0.25); }
.w-segbar i.on { background: var(--ok); }

/* FM06c 전극 접촉 트래커 (SensorTracker 재현) */
.w-trk { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 288px; max-width: 100%; align-self: center; }
.w-trk svg { display: block; width: 288px; height: 64px; }
.w-trk .lbs { position: relative; width: 288px; height: 20px; }
.w-trk .lbs span { position: absolute; top: 0; transform: translateX(-50%); font-size: var(--fs-12); line-height: 20px; white-space: nowrap; color: var(--tx-mid); }
.w-trk .lbs span.bad { color: var(--tx-hi); font-weight: 700; }
.w-trk .lg { display: flex; align-items: center; justify-content: center; gap: 24px; min-height: 24px; font-size: var(--fs-13); color: #EFEFEF; }
.w-trk .lg span { display: inline-flex; align-items: center; gap: 8px; }
.w-trk .lg i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
.w-bb.trk { min-height: 0; gap: 16px; }
.w-li.sm { font-size: var(--fs-13); line-height: 18px; min-height: 40px; }

/* FM06d 내 영상·소리 (합친 컴포넌트) */
.fl-card.w-av { padding: 8px; border: 0; box-shadow: inset 0 0 0 1px var(--sheet-border); border-radius: var(--r-sheet); display: flex; flex-direction: column; gap: 8px; }
.fl-card.w-av.low { padding: 16px; }
.w-vid { position: relative; border-radius: var(--r-card); overflow: hidden; aspect-ratio: 4 / 3; background: linear-gradient(160deg, #4A3A68 0%, #241A3E 100%); }
@media (min-width: 700px) and (min-aspect-ratio: 1/1) { .w-vid { aspect-ratio: 16 / 9; } }
.w-silh { position: absolute; inset: 0; display: grid; place-items: center; color: #B9A3DA; }
.w-silh .ic { width: 96px; height: 96px; opacity: 0.5; stroke-width: 1.5; }
.w-ovt { position: absolute; left: 8px; top: 8px; display: flex; align-items: center; gap: 8px; }
.w-ovl { background: rgba(18, 8, 28, 0.72); }
.w-ovb { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 24px 8px 8px; background: linear-gradient(to top, rgba(14, 6, 24, 0.85), rgba(14, 6, 24, 0)); }
.w-owarn { flex: 1; min-width: 0; font-size: var(--fs-13); line-height: 20px; color: var(--tx-hi); padding-left: 8px; }
.w-ovb .w-level { flex: 1; min-width: 0; padding-left: 8px; }
.w-ovb .w-level i { background: rgba(255, 255, 255, 0.3); } .w-ovb .w-level i.on { background: var(--ok); }
.w-ovb.center { justify-content: center; }
.w-tg { flex: none; width: var(--tap); height: var(--tap); border-radius: var(--r-pill); display: grid; place-items: center; background: rgba(18, 8, 28, 0.72); border: 1px solid var(--sheet-border); }
.w-tg[aria-pressed="true"] { background: var(--mb-purple); border-color: var(--mb-pale); }
.w-tg[disabled] { opacity: 0.4; }
.w-tg.ring, .w-tg.ring[aria-pressed="true"] { position: relative; background: rgba(18, 8, 28, 0.9); border: 0; }
.w-tg.ring svg.seg { position: absolute; inset: 0; width: 44px; height: 44px; transform: rotate(-90deg); }
.w-tg.ring svg.seg circle { fill: none; stroke: rgba(255, 255, 255, 0.28); stroke-width: 3; stroke-linecap: butt; }
.w-tg.ring svg.seg circle[data-on="1"] { stroke: var(--ok); }
.w-tg.ring .ic { position: relative; color: #fff; opacity: var(--io, 1); }
.w-avh { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.w-avh .l { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; }
.w-avh .r { display: flex; align-items: center; gap: 8px; flex: none; }
.w-avb { display: flex; flex-direction: column; gap: 8px; }
.w-level { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
.w-level i { height: 8px; border-radius: 8px; background: rgba(255,255,255,0.2); }
.w-level i.on { background: var(--ok); }
.w-hint { font-size: var(--fs-13); line-height: 20px; color: var(--tx-mid); }
.w-hint.warn { display: flex; align-items: flex-start; gap: 8px; color: var(--tx-hi); }
.w-hint.warn .ic { width: 20px; height: 20px; flex: none; color: var(--warn); }
.fl-card.w-spk { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.w-spk .l { display: flex; align-items: center; gap: 8px; min-width: 0; }
.w-spk .l .ic { color: var(--mb-pale); flex: none; }
.w-spk b { font-size: var(--fs-15); white-space: nowrap; }
.w-howto { display: flex; flex-direction: column; gap: 8px; }
@media (max-height: 760px) { .w-slot { min-height: 24px; } }

/* FM06e */
.w-hi { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(125,227,200,0.16); color: var(--ok); }
.w-hi .ic { width: 28px; height: 28px; }
.w-sum { display: flex; flex-direction: column; gap: 8px; }
.w-srow { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 56px; padding: 0 16px; border-radius: var(--r-card); text-align: left; background: rgba(255,255,255,0.08); border: 1px solid var(--sheet-border); }
.w-srow > .ic { flex: none; color: var(--mb-pale); }
.w-srow b { flex: none; font-size: var(--fs-15); white-space: nowrap; }
.w-srow .v { flex: 1; min-width: 0; text-align: right; font-size: var(--fs-13); line-height: 20px; color: var(--tx-mid); }
.w-srow .chev { flex: none; color: var(--tx-lo); }
.w-srow.warn .v, .w-srow.warn > .ic:first-child { color: var(--warn); }

/* FM07 */
.w-time { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.w-time .fl-num { line-height: 48px; }
.w-ready { display: flex; flex-direction: column; gap: 8px; }
.w-rrow { display: flex; align-items: center; gap: 16px; min-height: 24px; font-size: var(--fs-15); font-weight: 600; }
.w-rrow .ic { flex: none; color: var(--mb-pale); }
.w-bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,0.25); overflow: hidden; }
.w-bar i { display: block; height: 100%; border-radius: 4px; background: var(--ok); }
.w-slotcard { min-height: 112px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.w-bgmh { display: flex; align-items: center; gap: 16px; }
.w-bgmh > .ic { flex: none; color: var(--mb-pale); }
.w-bgmh .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.w-bgmh .tx b { font-size: var(--fs-15); line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-bgmh .tx span { font-size: var(--fs-13); line-height: 20px; color: var(--tx-mid); }
.w-bgmr { display: flex; align-items: center; gap: 16px; }
.w-bgmr > .ic { flex: none; color: var(--tx-mid); }
.w-range { flex: 1; min-width: 0; height: 44px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.w-range::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: rgba(255,255,255,0.3); }
.w-range::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px; border-radius: 50%; border: 0; background: #fff; }
.w-range:disabled { opacity: 0.4; }
.w-place { display: flex; align-items: flex-start; gap: 16px; }
.w-place > .ic { flex: none; color: var(--mb-pale); }
.w-place .tx { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.w-place b { font-size: var(--fs-15); line-height: 24px; }
.w-place .d { font-size: var(--fs-13); line-height: 20px; color: var(--tx-mid); }

/* FM08 · FM09 전체 화면 카드 */
.fl-layer.w-fullview { align-items: center; justify-content: center; padding: 16px; }
.w-fv { width: min(100%, 420px); padding: 32px 24px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; box-shadow: 0 16px 32px rgba(10,4,18,0.35); }
.w-fv .w-logo { width: 56px; height: 26px; fill: var(--mb-pale); }
.w-fv .w-ficon { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(179,115,239,0.22); color: var(--mb-pale); }
.w-fv .w-ficon.ok { background: rgba(125,227,200,0.16); color: var(--ok); }
.w-fv .w-ficon .ic { width: 28px; height: 28px; }
.w-ftx { display: flex; flex-direction: column; gap: 8px; }
.w-ftx p { font-size: var(--fs-15); line-height: 24px; color: var(--tx-mid); text-wrap: balance; }
.w-finfo { width: 100%; display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--r-card); background: rgba(255,255,255,0.07); text-align: left; }
.w-finfo div { display: flex; justify-content: space-between; gap: 16px; font-size: var(--fs-13); line-height: 20px; color: var(--tx-lo); }
.w-finfo b { font-size: var(--fs-15); font-weight: 600; color: var(--tx-hi); text-align: right; }
.w-fnote { font-size: var(--fs-13); line-height: 20px; color: var(--tx-mid); text-wrap: balance; }
.w-fbtns { width: 100%; display: flex; flex-direction: column; gap: 8px; }

/* 시트: 모바일·태블릿 세로 = 바텀, 가로형 = 우측 사이드 */
.fl-scrim.w-scrim { z-index: 8; }
.w-sheet { display: flex; flex-direction: column; gap: 16px; padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px)); }
.w-sh { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; }
.w-sub { font-size: var(--fs-13); line-height: 20px; color: var(--tx-mid); }
.w-ro { display: flex; align-items: center; color: var(--tx-mid); }
.w-scale { display: flex; flex-direction: column; gap: 8px; }
.w-scale .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.w-scale .row button { min-height: 56px; padding: 0; border-radius: var(--r-card); font-size: var(--fs-13); line-height: 16px; font-weight: 600; text-align: center; background: rgba(255,255,255,0.1); border: 1px solid var(--sheet-border); }
.w-scale .row button[aria-checked="true"] { background: var(--mb-purple); border-color: var(--mb-pale); }
.w-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fl-codebox.w-code > span { height: 56px; }
@media (min-width: 1100px) and (min-aspect-ratio: 1/1) {
  .fl-root[data-sheet] { --side: 436px; }
  .fl-scrim.w-scrim { align-items: center; justify-content: flex-end; padding: 16px; }
  .w-sheet { width: 420px; max-height: 100%; border-radius: var(--r-sheet); }
}

/* 개발자 인덱스 (?index=1) */
.w-index { position: fixed; inset: 0; overflow: auto; background: #F7F4F0; color: #1F1F1F; font-family: var(--font); padding: 24px; }
.w-index h1 { font-size: var(--fs-24); margin: 0 0 8px; }
.w-index p { font-size: var(--fs-15); line-height: 24px; margin: 0 0 8px; color: #6F6F6F; }
.w-index table { border-collapse: collapse; width: 100%; background: #fff; margin: 16px 0 24px; }
.w-index th, .w-index td { border: 1px solid #ECE6F0; padding: 8px 16px; text-align: left; vertical-align: top; font-size: var(--fs-13); line-height: 24px; }
.w-index th { background: #F5EDFC; }
.w-index a { display: inline-block; margin: 0 8px 8px 0; padding: 0 8px; min-height: 24px; border-radius: 8px; background: #F5EDFC; color: #5F0080; text-decoration: none; font-size: var(--fs-12); }
</style>

    var bgmoff = has('bgmoff');
    var chips = '<div class="fl-chiprow">' + chip(C.online ? 'monitor' : 'pin', C.online ? '온라인' : '대면') + chip(C.solo ? 'user' : 'users', C.solo ? '1:1' : '그룹') + chip('activity', C.band === 'none' ? 'LINK BAND 사용 안 함' : 'LINK BAND ' + MODE[C.band]) + '</div>';
    var time = '<div class="w-time"><span class="fl-label">시작 예정</span><span class="fl-num">' + TIME + '</span><span class="fl-sub">약 5분 뒤에 시작해요</span></div>';
    var ready = C.solo
      ? '<section class="fl-card sm w-ready"><div class="w-rrow">' + ic('userCheck') + '<span>내 준비를 마쳤어요</span></div><div class="w-bar" aria-hidden="true"><i style="width:100%"></i></div><p class="w-hint">' + HOST + '가 곧 시작해요.</p></section>'
      : '<section class="fl-card sm w-ready"><div class="w-rrow">' + ic('users') + '<span>6명 중 4명이 준비를 마쳤어요</span></div><div class="w-bar" aria-hidden="true"><i style="width:66.7%"></i></div></section>';
    var slot = C.online
      ? '<section class="fl-card sm w-slotcard w-media"><div class="w-bgmh">' + ic('music') + '<div class="tx"><b>심신이완 앰비언트</b><span>대기실 BGM · ' + (bgmoff ? '꺼짐' : '재생 중') + '</span></div>' + iconbtn(bgmoff ? 'play' : 'pause', bgmoff ? '재생' : '일시정지') + '</div><div class="w-bgmr">' + ic(bgmoff ? 'volX' : 'vol') + '<input class="w-range" type="range" min="0" max="100" value="60" aria-label="볼륨"' + (bgmoff ? ' disabled' : '') + '></div></section>'
      : '<section class="fl-card sm w-slotcard"><div class="w-place">' + ic('pin') + '<div class="tx"><b>' + PLACE + '</b><span class="d">' + (C.band === 'none' ? '자리에 앉아 기다려 주세요. 휴대폰은 무음으로 해 주세요.' : '이마에 LINK BAND를 착용하고 자리에 앉아 기다려 주세요.') + '</span></div></div></section>';
    var inner = '<div class="fl-layer">' +
      top(iconbtn('x', '나가기'), '<div class="fl-top-title">' + TITLE + '</div>', '<span class="w-ph" aria-hidden="true"></span>') +
      '<main class="fl-body"><div class="fl-col">' + chips + time + ready + slot + '</div></main>' +
      foot({ label: '준비 다시 확인하기', icon: 'refresh' }, { note: '상담사가 시작하면 자동으로 입장해요.' }, 'soft w-dark') + '</div>';
    return root(BG.FM07, inner);
  }

  /* ───────── FM08 대기열 ───────── */
  function fv(bg, inner, sheetHtml) { return root(bg, '<div class="fl-layer w-fullview">' + inner + '</div>', sheetHtml); }
  function FM08() {
    var off = !C.online;
    var h = off ? '현장 자리가 가득 찼어요' : '지금은 자리가 가득 찼어요';
    var p = off ? '자리가 나면 이 화면에서 알려 드려요.<br>가까운 곳에서 잠시 기다려 주세요.' : '자리가 나면 자동으로 입장해요.<br>이 화면을 열어 둬 주세요.';
    var card = '<section class="fl-card strong w-fv" aria-labelledby="fvt"><svg class="w-logo" viewBox="0 0 414.72 188.928" aria-hidden="true"><use href="#brandMark"/></svg><span class="w-ficon">' + ic('clock') + '</span><div class="w-ftx"><h1 class="fl-h1" id="fvt">' + h + '</h1><p>' + p + '</p></div>' +
      '<div class="w-finfo"><div><span>클래스</span><b>' + TITLE + '</b></div><div><span>' + (off ? '장소' : '진행자') + '</span><b>' + (off ? '5층 명상실' : HOST) + '</b></div><div><span>시작</span><b>' + TIME + '</b></div></div>' +
      '<p class="w-fnote">입장 알림은 이 기기로도 보내 드려요.</p><div class="w-fbtns"><button class="fl-btn soft block" type="button">대기 그만하기</button></div></section>';
    return fv(BG.FM08, card);
  }

  /* ───────── FM09 종료 + 시트 ───────── */
  function scale(k, L, sel) {
    return '<div class="w-scale"><span class="fl-label">' + k + '</span><div class="row" role="radiogroup" aria-label="' + k + '">' + L.map(function (l, i) { return '<button type="button" role="radio" aria-checked="' + (i === sel) + '">' + l + '</button>'; }).join('') + '</div></div>';
  }
  function FM09() {
    var checked = has('checked');
    var sh = '';
    if (has('checkin') || has('checkinempty')) {
      var e = has('checkinempty'), sel = [3, 2, 3];
      sh = sheet('오늘 상태 남기기', '<p class="w-sub">뇌파를 측정하지 않아도 이 기록은 리포트에 남아요.</p>' + AX.map(function (a, i) { return scale(a.k, a.L, e ? -1 : sel[i]); }).join('') +
        '<div class="fl-field"><label class="fl-label" for="onel">한 줄 소감 (선택)</label><input class="fl-input" id="onel" placeholder="예: 한결 가벼워졌어요"></div>' +
        '<div class="w-fbtns"><button class="fl-btn primary block" type="button"' + (e ? ' disabled' : '') + '>남기기</button><button class="fl-btn ghost block" type="button" data-close="1">건너뛰기</button></div>');
    } else if (has('reportsent')) {
      sh = sheet('리포트 받기', '<div class="w-center" style="padding:16px 0"><span class="w-hi">' + ic('checkCircle') + '</span><b>신청했어요</b><span class="d">상담사가 확인하면 이메일로 보내 드려요.</span></div><button class="fl-btn primary block" type="button" data-close="1">확인</button>');
    } else if (has('report')) {
      sh = sheet('리포트 받기', '<div class="fl-field"><span class="fl-label">받는 이메일</span><div class="fl-input w-ro">se***@example.com</div></div><p class="w-sub">리포트는 상담사가 확인한 뒤 계정 이메일로 보내 드려요. 영업일 기준 1~2일 걸릴 수 있어요.</p><button class="fl-btn primary block" type="button" data-open="reportsent">' + ic('mail') + '리포트 신청하기</button>');
    }
    var card = '<section class="fl-card strong w-fv" aria-labelledby="fvt"><svg class="w-logo" viewBox="0 0 414.72 188.928" aria-hidden="true"><use href="#brandMark"/></svg><span class="w-ficon ok">' + ic('checkCircle') + '</span><div class="w-ftx"><h1 class="fl-h1" id="fvt">수고하셨어요</h1><p>리포트는 준비되면 메일로 보내 드려요.</p></div>' +
      '<div class="w-finfo"><div><span>클래스</span><b>' + TITLE + '</b></div><div><span>함께한 시간</span><b>30분</b></div><div><span>리포트</span><b>준비되면 메일 발송</b></div></div>' +
      '<p class="w-fnote">AI 기록과 리포트를 만드는 데 몇 분 걸릴 수 있어요.</p>' +
      '<div class="w-fbtns"><button class="fl-btn primary block" type="button" data-open="report">' + ic('mail') + '리포트 받기</button>' +
      (checked ? '<button class="fl-btn done block" type="button" disabled>' + ic('checkCircle') + '오늘 상태를 남겼어요</button>' : '<button class="fl-btn soft block" type="button" data-open="checkin">' + ic('smile') + '오늘 상태 남기기</button>') +
      '<button class="fl-btn ghost block" type="button">홈으로</button></div></section>';
    return fv(BG.FM09, card, sh);
  }

  /* ───────── 개발자 인덱스 ───────── */
  function INDEX() {
    var rows = Object.keys(CASES).map(function (id) {
      var links = CASES[id].map(function (c) { return '<a href="?screen=' + id + '&case=' + c + '">' + c + '</a>'; }).join('');
      return '<tr><td><b>' + id + '</b></td><td>' + META[id].name + '</td><td>' + META[id].type + '</td><td>' + links + '</td><td>' + META[id].assume + '</td></tr>';
    }).join('');
    var n = Object.keys(CASES).reduce(function (s, k) { return s + CASES[k].length; }, 0);
    return '<div class="w-index"><h1>회원 시안 B — 입장 준비 마법사 · 시작 대기 · 종료</h1>' +
      '<p>개발자용 인덱스입니다. 화면 ' + Object.keys(CASES).length + '개 · 케이스 ' + n + '개. 주소 형식은 <code>?screen=FM06c&amp;case=on-group-opt-member-leadoff</code> 입니다.</p>' +
      '<p>케이스 토큰: 방식 <code>on</code>/<code>off</code> · 인원 <code>group</code>/<code>solo</code> · LINK BAND 모드 <code>none</code>/<code>opt</code>/<code>req</code> · 회원 <code>member</code> (생략하면 on · group · opt · member). 나머지 토큰은 화면별 상태입니다.</p>' +
      '<p>단계 수: 온라인은 안내 · 상태 · LINK BAND · 기기 · 완료 5단계, 오프라인은 기기 점검이 없어 4단계, LINK BAND 사용 안 함이면 LINK BAND 단계도 없어 진행 점이 줄어듭니다. 그래서 FM06c는 모드가 선택·필수인 케이스만, FM06d는 온라인 케이스만 있습니다. 접촉 불량은 leadoffl(왼쪽만 실패) · leadoffr(오른쪽만 실패) · leadoff(둘 다 실패) 3종입니다.</p>' +
      '<table><thead><tr><th>화면</th><th>설명</th><th>유형</th><th>케이스</th><th>가정</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* ───────── 렌더 ───────── */
  var R = { FM06a: FM06a, FM06b: FM06b, FM06c: FM06c, FM06d: FM06d, FM06e: FM06e, FM07: FM07, FM08: FM08, FM09: FM09 };
  mount.innerHTML = q.get('index') ? INDEX() : (R[SCREEN] || FM06a)();

  /* 가벼운 상호작용: 시트 열고 닫기 */
  document.addEventListener('click', function (e) {
    var o = e.target.closest('[data-open]');
    if (o) { go(o.dataset.open === 'sheet' ? ['sheet'] : [o.dataset.open], o.dataset.open === 'reportsent' ? ['report'] : []); return; }
    var closeBtn = e.target.closest('[data-close]');
    if (closeBtn || e.target.id === 'scrim') go([], ['sheet', 'report', 'reportsent', 'checkin', 'checkinempty', 'started']);
  });
  window.__ready = true;
})();
</script>
</body>
</html>
