<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>MIND BREEZE · 상담사 시안 B — 세팅·로비·시작·종료</title>
<link rel="stylesheet" href="../class-player-redesign/tokens.css">
<link rel="stylesheet" href="flow-base.css">
<style>
/* 상담사 시안 B 전용 스타일 (.w- 접두어). 공용은 flow-base.css 를 그대로 쓴다. */
html, body { overflow: hidden; }
body { background: #12081C; font-size: var(--fs-15); line-height: 1.4; word-break: keep-all; }
body.w-index { overflow: auto; height: auto; background: #F7F4F0; color: var(--ink); }
button { padding: 0; }
button:focus-visible { outline: 2px solid var(--mb-lavender); outline-offset: 2px; }

/* 레이아웃 뼈대: 상단 바는 메인 영역 안에 두어, 사이드 시트가 열리면 축이 함께 이동한다 */
.w-stage { flex: 1; min-height: 0; display: flex; }
.w-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.w-main > .fl-body { overflow: hidden; }
.w-main > .fl-body > .fl-col { max-height: 100%; min-height: 0; }
.w-top { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; align-items: center; height: 56px; padding: 0 8px; flex: none; }
.w-top > .fl-iconbtn { justify-self: start; }
.w-top > .w-ph { justify-self: end; width: 44px; height: 44px; }
.w-ttl { min-width: 0; text-align: center; }
.w-ttl h1 { margin: 0; font-size: var(--fs-15); font-weight: 700; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-ttl p { margin: 0; font-size: var(--fs-13); line-height: 16px; color: var(--tx-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-fnote.two { white-space: normal; overflow: visible; }
.w-fnote { margin: 0; min-height: 16px; text-align: center; font-size: var(--fs-13); line-height: 16px; color: var(--tx-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 아이콘·칩·행 */
.w-ico { width: 40px; height: 40px; border-radius: var(--r-pill); display: grid; place-items: center; flex: none; background: rgba(255,255,255,0.1); }
.w-ico .ic { width: 20px; height: 20px; }
.w-ico.lg { width: 56px; height: 56px; } .w-ico.lg .ic { width: 24px; height: 24px; }
.w-ico.ok { color: var(--ok); background: rgba(125,227,200,0.14); }
.w-ico.warn { color: var(--warn); background: var(--warn-bg); }
.w-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 16px; border-radius: var(--r-pill); font-size: var(--fs-13); font-weight: 600; background: rgba(255,255,255,0.1); border: 1px solid var(--sheet-border); white-space: nowrap; flex: none; }
.w-chip .ic { width: 16px; height: 16px; }
.w-chip.ok { color: var(--ok); border-color: rgba(125,227,200,0.5); }
.w-chip.warn { color: var(--warn); border: 1px dashed var(--warn); background: var(--warn-bg); }

.w-row { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; border-radius: var(--r-card); background: rgba(255,255,255,0.08); border: 1px solid var(--sheet-border); }
.w-row.strong { background: var(--sheet-bg); }
.w-rt { flex: 1; min-width: 0; }
.w-rt b { display: block; font-size: var(--fs-15); font-weight: 700; line-height: 24px; }
.w-rt span { display: block; font-size: var(--fs-13); line-height: 16px; color: var(--tx-mid); }
.w-rt span.warn { color: var(--warn); }
.w-btn44 { min-height: 44px; padding: 0 16px; font-size: var(--fs-13); }
.w-btn44 .ic { width: 20px; height: 20px; }
.fl-btn .ic { width: 20px; height: 20px; }
.w-ok { color: var(--ok); } .w-dim { color: var(--tx-lo); } .w-mid { color: var(--tx-mid); } .w-warn { color: var(--warn); }

/* FH05 내 영상·소리 (영상+음성 합친 큰 컴포넌트) */
.w-media { position: relative; flex: 0 1 auto; height: min(448px, 52dvh); min-height: 220px; border-radius: var(--r-sheet); overflow: hidden; border: 1px solid var(--sheet-border); background: linear-gradient(160deg, #1E3A44, #2B2342); }
@media (min-width: 600px) and (orientation: portrait) { .w-media { height: auto; aspect-ratio: 4 / 3; } }
@media (min-width: 600px) and (orientation: landscape) { .w-media { height: auto; aspect-ratio: 16 / 9; } }
.w-media.low { height: auto; min-height: 0; aspect-ratio: auto; background: var(--sheet-bg); display: flex; flex-direction: column; gap: 16px; padding: 16px; }
.w-lowrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.w-vid { position: absolute; inset: 0; }
.w-sil { position: absolute; inset: 0; width: 100%; height: 100%; }
.w-vtag { position: absolute; top: 16px; left: 16px; }
.w-vtag .w-chip, .w-lowrow .w-chip { background: rgba(18,8,28,0.7); }
.w-vbar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: linear-gradient(to top, rgba(8,4,14,0.85), rgba(8,4,14,0)); }
.w-vbar .w-meter, .w-media.low .w-meter { flex: 1; min-width: 0; }
.w-mi { flex: none; display: grid; place-items: center; }
.w-mi .ic { width: 20px; height: 20px; }
.w-tg { display: flex; gap: 8px; flex: none; }
.w-tg .fl-iconbtn.off { color: var(--warn); border: 1px dashed var(--warn); background: var(--warn-bg); }
.w-tg .fl-iconbtn[disabled] { opacity: 0.4; }
.w-slot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 56px 24px 80px; text-align: center; background: rgba(24,12,36,0.5); }
.w-slot h2 { margin: 0; font-size: var(--fs-15); font-weight: 700; line-height: 24px; }
.w-slot p { margin: 0; font-size: var(--fs-13); line-height: 16px; color: var(--tx-mid); max-width: 420px; }
.w-meter { display: flex; align-items: flex-end; gap: 8px; height: 24px; }

.w-meter i.on { background: var(--ok); }

/* 카메라 켜짐: 마이크 버튼 둘레 5단계 링(아이콘 미터) + 하단 가운데 토글 쌍 */
.w-vtg { position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; gap: 16px; }
.w-vtg .fl-iconbtn.off { color: var(--warn); border: 1px dashed var(--warn); background: var(--warn-bg); }
.w-ringbtn { border: 0; position: relative; background: var(--ring, rgba(255,255,255,0.22)); }
.w-ringbtn::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #1B0F26; }
.w-ringbtn .ic { position: relative; opacity: var(--op, 1); }
.w-vtg .w-ringbtn.off { border: 0; background: var(--ring); }
.w-ringbtn.off .ic { color: var(--warn); opacity: 1; }

/* 전극 접촉 UI (SensorTracker 재현) */
.w-led { width: 32px; height: 20px; border-radius: 10px; border: 2px solid #606276; display: inline-grid; place-items: center; flex: none; }
.w-led.ok { background: #01F0C8; color: #04211C; } .w-led.bad { background: #D33F3F; color: #fff; }
.w-lead { display: flex; gap: 8px; flex-basis: 100%; margin-left: 40px; }
.w-lx { display: inline-flex; flex-direction: column; align-items: center; font-size: var(--fs-13); font-weight: 600; line-height: 16px; }
.w-lx > .w-led { margin-bottom: 0; }
.w-trk { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.w-trksvg { display: block; max-width: 100%; }
.w-legend { display: flex; justify-content: center; gap: 24px; font-size: var(--fs-13); }
.w-legend > span { display: inline-flex; align-items: center; }
.w-legend > span > i { margin-right: 8px; width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; }
.w-legend i.ok { background: #01F0C8; color: #04211C; } .w-legend i.bad { background: #D33F3F; color: #fff; }
.w-num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; background: rgba(255,255,255,0.14); font-size: var(--fs-13); font-weight: 700; }
.w-how { display: flex; flex-direction: column; gap: 8px; }
.w-how > div { display: flex; gap: 16px; align-items: flex-start; font-size: var(--fs-13); line-height: 24px; color: var(--tx-mid); }

/* FH06 로비 */
.w-invite { display: flex; align-items: center; gap: 16px; }
.w-invite .l { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.w-invite .r { display: flex; flex-direction: column; gap: 8px; flex: none; }
.w-inv-n { font-size: var(--fs-18); font-weight: 800; line-height: 32px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-link { font-size: var(--fs-13); line-height: 16px; color: var(--tx-mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-listcard { display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; background: var(--sheet-bg); border: 1px solid var(--sheet-border); border-radius: var(--r-card); overflow: hidden; }
.w-lhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px; padding: 0 16px; flex: none; border-bottom: 1px solid var(--sheet-border); }
.w-lhead b { font-size: var(--fs-15); font-weight: 700; }
.w-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: 1fr; }
.w-mrow { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.08); min-width: 0; }
.w-mrow.bad { flex-wrap: wrap; padding: 8px 16px; row-gap: 8px; }
.w-mrow .av { width: 32px; height: 32px; border-radius: var(--r-pill); display: grid; place-items: center; font-size: var(--fs-13); font-weight: 700; background: rgba(255,255,255,0.12); flex: none; }
.w-mrow .nm { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-cells { display: flex; gap: 8px; flex: none; }
.w-cell { display: inline-flex; align-items: center; font-size: var(--fs-13); font-weight: 600; white-space: nowrap; }
.w-cell .ic { width: 16px; height: 16px; margin-right: 8px; }
.w-cell.bad { color: var(--warn); }
.w-cell.ok { color: var(--ok); } .w-cell.wait { color: var(--tx-mid); } .w-cell.skip { color: var(--tx-lo); }
.w-list.two .w-mrow:nth-child(odd) { border-right: 1px solid rgba(255,255,255,0.08); }
@media (min-width: 600px) { .w-list.two { grid-template-columns: 1fr 1fr; } }
.w-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px 16px; text-align: center; }
.w-empty h2 { margin: 0; font-size: var(--fs-15); font-weight: 700; line-height: 24px; }
.w-empty p { margin: 0; font-size: var(--fs-13); line-height: 16px; color: var(--tx-mid); }
.w-dock { display: flex; gap: 8px; flex: none; }
.w-dk { flex: 1 1 0; min-width: 0; min-height: 56px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: var(--r-card); background: var(--sheet-bg); border: 1px solid var(--sheet-border); font-size: var(--fs-13); font-weight: 600; line-height: 16px; }
.w-dk .ic { width: 24px; height: 24px; }
.w-venue .w-rt b { font-size: var(--fs-15); }

/* 시트 */
.w-wrap { position: absolute; inset: 0; z-index: 8; background: rgba(12,6,20,0.55); display: flex; align-items: flex-end; justify-content: center; }
.w-sheet { background: rgba(24,12,36,0.96); max-height: calc(100dvh - 72px); overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 1000px) and (orientation: landscape) {
  .w-wrap.tool { position: static; inset: auto; z-index: auto; background: none; width: 416px; flex: none; align-items: center; padding: 16px 16px 16px 0; }
  .w-wrap.tool .w-sheet { width: 100%; max-height: 100%; border-radius: var(--r-sheet); padding-bottom: 24px; }
}
@media (max-height: 760px) { .w-sheet { gap: 8px; padding-top: 16px; } }
.w-sh-h { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.w-sh-h h2 { margin: 0; font-size: var(--fs-18); font-weight: 700; }
.w-ctr { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.w-ctr h2 { margin: 0; font-size: var(--fs-18); font-weight: 700; line-height: 24px; }
.w-ctr p { margin: 0; font-size: var(--fs-13); line-height: 20px; color: var(--tx-mid); max-width: 480px; }
.w-act { display: flex; flex-direction: column; gap: 8px; }
.w-two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.w-opt { display: flex; align-items: flex-start; gap: 16px; text-align: left; padding: 16px; width: 100%; min-height: 72px; border-radius: var(--r-card); border: 1px solid var(--sheet-border); background: rgba(255,255,255,0.08); }
.w-opt .w-ot { display: block; flex: 1; min-width: 0; }
.w-opt b { display: block; font-size: var(--fs-15); font-weight: 700; line-height: 24px; }
.w-opt .w-od { display: block; font-size: var(--fs-13); line-height: 20px; color: var(--tx-mid); }
.w-opt.danger { border-color: var(--warn); background: var(--warn-bg); }
.w-opt.danger b { color: var(--warn); }
.w-sw { width: 52px; height: 44px; position: relative; flex: none; }
.w-sw::before { content: ""; position: absolute; left: 0; top: 6px; width: 52px; height: 32px; border-radius: var(--r-pill); background: rgba(255,255,255,0.18); }
.w-sw::after { content: ""; position: absolute; top: 10px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; }
.w-sw.on::before { background: var(--mb-purple); } .w-sw.on::after { left: 24px; }
.w-cb { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--tx-mid); display: grid; place-items: center; flex: none; }
.w-cb .ic { width: 16px; height: 16px; opacity: 0; }
.w-cb.on { background: var(--mb-purple); border-color: transparent; } .w-cb.on .ic { opacity: 1; }
.w-cb.dis { opacity: 0.4; }
.w-facts { display: flex; flex-wrap: wrap; gap: 8px; }
.w-fact { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 8px; border-radius: var(--r-pill); background: rgba(255,255,255,0.1); border: 1px solid var(--sheet-border); font-size: var(--fs-13); font-weight: 700; }
.w-fact .ic { width: 20px; height: 20px; flex: none; }
.w-bar { height: 8px; border-radius: var(--r-pill); background: rgba(255,255,255,0.14); overflow: hidden; }
.w-bar > i { display: block; height: 100%; width: var(--p, 0); background: var(--mb-lavender); border-radius: var(--r-pill); }
.w-slider { position: relative; height: 8px; border-radius: var(--r-pill); background: rgba(255,255,255,0.18); flex: 1; }
.w-slider > i { display: block; height: 100%; width: 60%; border-radius: var(--r-pill); background: var(--mb-lavender); }
.w-slider::after { content: ""; position: absolute; top: -8px; left: calc(60% - 12px); width: 24px; height: 24px; border-radius: 50%; background: #fff; }
.w-bubble { max-width: 80%; padding: 8px 16px; border-radius: var(--r-card); background: rgba(255,255,255,0.1); font-size: var(--fs-13); line-height: 20px; }
.w-bubble.me { align-self: flex-end; background: var(--mb-purple); }
.w-bubble small { display: block; font-size: var(--fs-12); color: var(--tx-mid); line-height: 16px; }
.w-msgs { display: flex; flex-direction: column; gap: 8px; }

/* FH07 시작 확인 — 준비 인원 카드 + 준비 중 회원 목록 */
.w-stat { border-radius: var(--r-card); background: rgba(255,255,255,0.08); border: 1px solid var(--sheet-border); }
.w-sr { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 16px; }
.w-sr + .w-sr, .w-pl + .w-sr { border-top: 1px solid var(--sheet-border); }
.w-pl { border-top: 1px solid var(--sheet-border); padding: 8px 0; display: flex; flex-direction: column; }
.w-pr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 32px; padding: 0 16px 0 72px; font-size: var(--fs-13); }
.w-pr b { min-width: 40px; font-size: var(--fs-13); font-weight: 700; }
.w-pmore { color: var(--tx-mid); }
.w-pn { display: flex; gap: 8px; align-items: flex-start; margin: 0; padding: 8px 16px 0 72px; font-size: var(--fs-13); line-height: 20px; color: var(--tx-mid); }
.w-mchip { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: var(--r-pill); background: rgba(255,255,255,0.1); border: 1px solid var(--sheet-border); font-size: var(--fs-13); font-weight: 600; color: var(--tx-mid); white-space: nowrap; }
.w-mchip .ic { width: 16px; height: 16px; margin-right: 8px; }
.w-mchip.bad { color: var(--warn); border: 1px dashed var(--warn); }

/* FH09·FH10 */
.w-step { display: flex; align-items: center; gap: 16px; min-height: 48px; }
.w-step .ic { width: 24px; height: 24px; flex: none; }
.w-step .tx { flex: 1; font-weight: 700; }
.w-step .st { font-size: var(--fs-13); color: var(--tx-mid); }
.w-step.done .ic { color: var(--ok); } .w-step.now .ic { color: var(--mb-pale); animation: w-spin 1.4s linear infinite; } .w-step.todo { color: var(--tx-lo); } .w-step.skip { color: var(--tx-lo); }
@keyframes w-spin { to { transform: rotate(360deg); } }
.w-steps { display: flex; flex-direction: column; }
.w-scene { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.w-scene .fl-h1 { margin-top: 8px; }
.w-scene .fl-sub { max-width: 480px; }
@media (max-height: 760px) { .w-step { min-height: 40px; } }

/* 인덱스 */
.w-ix { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
.w-ix h1 { font-size: var(--fs-24); margin: 0 0 8px; }
.w-ix p { color: var(--ink-mid); margin: 0 0 16px; }
.w-ix table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--shell-line); border-radius: 16px; overflow: hidden; }
.w-ix th, .w-ix td { text-align: left; vertical-align: top; padding: 16px; border-bottom: 1px solid var(--shell-line); font-size: var(--fs-13); line-height: 24px; }
.w-ix th { background: var(--mb-purple-cream); color: var(--mb-purple); }
.w-ix a { display: inline-block; margin: 0 8px 8px 0; padding: 0 16px; line-height: 32px; border-radius: 9999px; background: var(--mb-purple-cream); color: var(--mb-purple); text-decoration: none; font-weight: 600; }
.w-ix a:hover { background: var(--mb-purple); color: #fff; }
</style>

<script>

  'mic-off': '<path d="m2 2 20 20"/><path d="M18.9 13.2A7 7 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.3V5a3 3 0 0 0-5.7-1.3"/><path d="M9 9v3a3 3 0 0 0 5.1 2.1"/><path d="M12 19v3"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',

  const p = lobbyParts(key);

  const manual = micOff || noC;
  const empty = !p.ms.length;
  const people = empty ? '아직 아무도 입장하지 않았어요' : statusLine(p.ms.length, p.ready, p.wait);
  const rowPeople = `<div class="w-sr"><span class="w-ico ${p.wait || empty ? '' : 'ok'}">${ic('users')}</span><div class="w-rt"><b>준비 인원</b><span>${people}</span></div></div>`;

  const shown = pend.length >= 6 ? pend.slice(0, 3) : pend;
  const stepChips = (m) => [[m.s === 'wait', '설문', 'clock'], [m.b === 'wait' || m.b === 'bad', 'LINK BAND', m.b === 'bad' ? 'alert' : 'clock'], [m.d === 'wait', '기기', 'clock']]
    .filter((x) => x[0]).map((x) => `<span class="w-mchip${x[2] === 'alert' ? ' bad' : ''}">${ic(x[2])}${x[1]}</span>`).join('');
  const plist = empty ? `<div class="w-pl"><p class="w-pn" style="padding-top:0">시작하면 초대한 회원이 이후에 입장해요</p></div>` : pend.length ? `<div class="w-pl" aria-label="준비 중인 회원 ${pend.length}명">${shown.map((m) => `<div class="w-pr"><b>${m.name}</b>${stepChips(m)}</div>`).join('')}${pend.length > shown.length ? `<div class="w-pr w-pmore">외 ${pend.length - shown.length}명</div>` : ''}
    <p class="w-pn">준비 중인 회원은 시작 후에도 입장해서 이어서 준비할 수 있어요</p></div>` : '';
  const rowMic = off ? `<div class="w-sr"><span class="w-ico ok">${ic('map-pin')}</span><div class="w-rt"><b>장소</b><span>${ADDR}</span></div></div>`
    : micOff ? `<div class="w-sr"><span class="w-ico warn">${ic('mic-off')}</span><div class="w-rt"><b>마이크</b><span class="warn">꺼져 있어요</span></div><button class="fl-btn soft w-btn44">${ic('mic')}켜기</button></div>`
    : `<div class="w-sr"><span class="w-ico ok">${ic('mic')}</span><div class="w-rt"><b>마이크</b><span>켜져 있어요</span></div>${chip('켜짐', 'ok', 'circle-check')}</div>`;
  const checked = !manual;
  const consent = `<div class="fl-card sm" style="display:flex;flex-direction:column;gap:8px">
    <div class="w-facts"><span class="w-fact">${ic('calendar')}30일 보관</span><span class="w-fact">${ic('shield')}나와 담당 상담사만 열람</span></div>
    <div class="w-row" role="checkbox" aria-checked="${checked}" style="min-height:48px;padding:0 16px"><span class="w-cb ${checked ? 'on' : ''}${micOff ? ' dis' : ''}">${ic('check')}</span><div class="w-rt"><b style="font-size:15px">녹음하고 AI 기록지를 만들어요</b></div></div></div>`;
  const note = manual ? '녹음 없이 수동 기록으로 진행해요. 메모로 기록지를 만들어요.' : '녹음은 언제든 멈출 수 있어요.';
  const html = `<div class="w-ctr"><h2>시작 전에 확인해요</h2></div><div class="w-stat">${rowPeople}${plist}${rowMic}</div>${consent}
    <p class="fl-note" style="margin:0;display:flex;gap:8px;align-items:center">${ic('info', 'w-mid').replace('class="ic', 'style="width:16px;height:16px;flex:none" class="ic')}${note}</p>
    <div class="w-act">${cta(pend.length || empty ? '지금 시작하기' : '시작하기', 'play')}<button class="fl-btn ghost block">${pend.length || empty ? '조금 더 기다리기' : '돌아가기'}</button></div>`;
  return frame({ id: 'FH07', bg: 'background4', left: LEFT_BACK, title: CLASS_TITLE, sub: p.sub, body: p.body, foot: p.foot, sheet: { kind: 'conf', label: '시작 확인', html } });

/* ───────── FH09 종료 ───────── */
function fh09(c) {
  if (c === 'confirm' || c === 'confirm-busy') {
    const busy = c === 'confirm-busy';
    const li = (i, t) => `<div class="w-row"><span class="w-ico">${ic(i)}</span><div class="w-rt"><b style="font-size:13px;line-height:20px;font-weight:600">${t}</b></div></div>`;
    const html = `<div class="w-ctr"><span class="w-ico lg">${ic('flag')}</span><h2>클래스를 끝낼까요?</h2></div>
      <div class="w-msgs">${li('save', '녹음과 녹화가 저장돼요')}${li('file', '상담사·회원 리포트가 자동으로 만들어져요')}${li('users', '참여 중인 회원 8명의 화면도 함께 끝나요')}</div>
      <div class="w-act">${cta(busy ? '끝내는 중이에요' : '클래스 끝내기', busy ? 'loader' : 'flag', busy, 'danger')}<button class="fl-btn soft block"${busy ? ' disabled' : ''}>계속 진행</button></div>`;
    return frame({ id: 'FH09', bg: 'background8', left: LEFT_BACK, title: CLASS_TITLE, sub: '진행 중 · 온라인 · 그룹', body: '', foot: '', sheet: { kind: 'conf', label: '클래스 종료 확인', html } });
  }
  const manual = c.startsWith('manual');
  const stage = { 'end-saving': 0, 'end-stt': 1, 'end-ai': 2, 'end-done': 4, 'manual-ing': 3, 'manual-done': 4 }[c];
  const done = stage === 4;
  const defs = manual ? [['save', '녹음 저장', '녹음 없음'], ['wave', '음성 인식', '건너뜀'], ['spark', 'AI 요약', '건너뜀'], ['file', '리포트 완료', done ? '완료' : '메모로 만드는 중']]
    : [['save', '녹음 저장', ''], ['wave', '음성 인식', ''], ['spark', 'AI 요약', ''], ['file', '리포트 완료', '']];
  const steps = defs.map((d, i) => {
    let st, label = d[2];
    if (manual && i < 3) st = 'skip';
    else if (stage > i) st = 'done'; else if (stage === i) st = 'now'; else st = 'todo';
    if (!manual) label = { done: '완료', now: '진행 중', todo: '기다리는 중' }[st];
    if (manual && i === 3) st = done ? 'done' : 'now';
    const icn = st === 'done' ? 'circle-check' : st === 'now' ? 'loader' : st === 'skip' ? 'minus-circle' : 'clock';
    return `<div class="w-step ${st}">${ic(icn)}<span class="tx">${d[1]}</span><span class="st">${label}</span></div>`;
  }).join('');
  const pct = manual ? (done ? '100%' : '70%') : ['25%', '50%', '75%', '90%', '100%'][stage];
  const sub = done ? (manual ? '수동 기록 모드로 진행했어요. 내 메모로 리포트를 만들었어요.' : '48분 동안 8명이 함께했어요. 리포트가 준비됐어요.')
    : manual ? '수동 기록 모드로 진행했어요. 녹음 없이 내 메모로 리포트를 만들어요.' : '48분 동안 8명이 함께했어요. 녹음이 저장됐고 리포트를 만들고 있어요.';
  const body = `<div class="w-scene"><span class="w-ico lg ok">${ic('flag')}</span><h1 class="fl-h1">클래스가 끝났어요</h1><p class="fl-sub">${sub}</p></div>

      <div class="w-bar" style="--p:${pct}"><i></i></div><div class="w-steps">${steps}</div></div>`;
  return frame({ id: 'FH09', bg: 'background8', left: LEFT_HOME, title: '클래스 종료', sub: CLASS_TITLE, body, foot: cta('기록 보기', 'file') + `<p class="w-fnote">${done ? '리포트는 기록에서 언제든 볼 수 있어요' : '화면을 닫아도 리포트는 계속 만들어져요'}</p>` });

/* ───────── 라우팅 ───────── */
function renderIndex() {
  document.body.classList.add('w-index');
  const rows = Object.entries(REG).map(([id, r]) => `<tr><td><b>${id}</b></td><td>${r.name}</td><td>${Object.entries(r.cases).map(([k, d]) => `<a href="?screen=${id}&case=${k}" title="${d}">${k}</a>`).join('')}</td><td>${r.assume}</td></tr>`).join('');
  document.getElementById('app').innerHTML = `<div class="w-ix"><h1>상담사 시안 B — 화면·케이스 인덱스</h1><p>개발자용. 화면 선택은 ?screen=FH06&amp;case=g-on-3 형태이고, 파라미터가 없으면 FH05 첫 케이스가 열려요.</p>
    <table><thead><tr><th>화면 ID</th><th>화면</th><th>케이스</th><th>가정</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function render() {
  const P = new URLSearchParams(location.search);
  if (P.get('index')) return renderIndex();
  const id = REG[P.get('screen')] ? P.get('screen') : 'FH05';
  const keys = Object.keys(REG[id].cases);
  const c = keys.includes(P.get('case')) ? P.get('case') : keys[0];
  const html = { FH05: fh05, FH06: fh06, FH06a: fh06a, FH07: fh07, FH08: fh08, FH09: fh09, FH10: fh10 }[id](c);
  document.getElementById('app').innerHTML = html;
  document.body.dataset.screen = id; document.body.dataset.case = c; document.body.dataset.ready = '1';
}
render();
