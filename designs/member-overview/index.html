function list(){main.innerHTML=`<section class="intro"><div><div class="eyebrow" style="margin-bottom:8px">MEMBER OVERVIEW</div><h1>회원 한눈에 보기</h1><p>기본정보부터 최근 활동까지, 다음 만남을 준비하세요.</p></div><div class="switch" aria-label="목록 보기"><button data-mode="table" aria-pressed="${mode==='table'}">☷　표</button><button data-mode="cards" aria-pressed="${mode==='cards'}">▦　카드</button></div></section><section class="filters" aria-label="회원 검색과 필터"><form class="searchrow" id="searchform"><input class="search" id="search" aria-label="회원 검색" placeholder="이름 또는 이메일 검색"><button class="primary">검색</button></form><div class="filterrow"><label>접속 상태<select id="online">${options(['전체','온라인','오프라인','확인 불가','비공개'],state.online)}</select></label><label>소속 클래스<select id="cls">${options(['전체','아침 호흡','저녁 이완','미소속'],state.cls)}</select></label><label>최근 활동<select id="days">${options(['전체','최근 7일','최근 30일','최근 90일'],state.days)}</select></label><label>그룹핑<select id="group">${options(['없음','클래스','접속 상태'],state.group)}</select></label><button class="quiet" id="reset">초기화</button></div></section><div class="listbar"><span id="count"></span><span class="notice">개인정보는 기본 마스킹<br>접속 상태는 가상 예시입니다</span></div><div id="results"></div><p class="footnote">선택한 업무 공간에서 열람 가능한 회원과 기록만 표시합니다.<br>접속 여부는 수업 참여나 출석을 뜻하지 않습니다. · 기준: 2026.10.22 10:24 KST</p>`;
document.getElementById('search').value=state.q;document.getElementById('searchform').onsubmit=e=>{e.preventDefault();state.q=document.getElementById('search').value.trim();rows()};
['online','cls','days','group'].forEach(k=>document.getElementById(k).onchange=e=>{state[k]=e.target.value;rows()});document.getElementById('reset').onclick=()=>{state={q:'',online:'전체',cls:'전체',days:'전체',group:'없음'};list()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;location.hash=mode;list()});rows();}
function rows(){const data=members.filter(m=>(m.name.includes(state.q)||(`sample${m.id}@example.invalid`).includes(state.q))&&(state.online==='전체'||m.online===state.online)&&(state.cls==='전체'||m.cls===state.cls)&&(state.days==='전체'||m.days<parseInt(state.days.replace(/\D/g,''))));document.getElementById('count').innerHTML=`전체 6명 중 <b>${data.length}명</b>`;let groups=state.group==='없음'?{'':data}:Object.groupBy(data,m=>state.group==='클래스'?m.cls:m.online);if(!data.length){document.getElementById('results').innerHTML='<div class="empty"><h2>조건에 맞는 회원이 없습니다</h2><p class="muted">검색어나 필터를 변경해 주세요.</p></div>';return;}
const tr=m=>`<tr><td><div class="person"><span class="avatar">${m.name[0]}</span><a href="#detail" data-id="${m.id}">${m.name}</a></div></td><td>${m.gender}</td><td>${m.age}</td><td class="date">${m.phone}</td><td>${status(m)}</td><td class="date">${m.login}</td><td>${m.activity}<span class="sub">${m.date}</span></td><td><span class="tag">${m.cls}</span></td></tr>`;
const card=m=>`<article class="membercard"><div class="cardhead"><span class="avatar">${m.name[0]}</span><h3><a href="#detail" data-id="${m.id}">${m.name}</a></h3>${status(m)}</div><dl><div><dt>성별 · 나이</dt><dd>${m.gender} · ${m.age}</dd></div><div><dt>연락처</dt><dd>${m.phone}</dd></div><div><dt>최근 접속</dt><dd>${m.login}</dd></div><div><dt>소속 클래스</dt><dd>${m.cls}</dd></div></dl><div class="cardbottom"><span class="muted">최근 활동 · ${m.date}</span><h3 style="font-size:14px;margin-top:4px">${m.activity}</h3><a href="#detail" data-id="${m.id}">활동과 리포트 보기　→</a></div></article>`;
document.getElementById('results').innerHTML=mode==='table'?`<div class="panel"><div class="scrollhint">이름을 눌러 회원 상세 보기 · 좁은 화면에서는 표를 좌우로 스크롤하세요 →</div><div class="tablewrap" tabindex="0" aria-label="회원 표 가로 스크롤"><table><thead><tr>${['이름','성별','만 나이','연락처','온라인','최근 접속','최근 활동','소속 클래스'].map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${Object.entries(groups).map(([g,ms])=>(g?`<tr class="group"><td colspan="8">${g} · ${ms.length}명</td></tr>`:'')+ms.map(tr).join('')).join('')}</tbody></table></div><div class="pager"><span>6명 중 ${data.length}명 표시 · 1 / 1 페이지</span><div><button disabled>이전</button> <button disabled>다음</button></div></div></div>`:Object.entries(groups).map(([g,ms])=>`${g?`<h2 style="margin:20px 0 12px">${g} · ${ms.length}명</h2>`:''}<div class="cards">${ms.map(card).join('')}</div>`).join('');document.querySelectorAll('[data-id]').forEach(a=>a.onclick=()=>{selected=members.find(m=>m.id===Number(a.dataset.id));timelineType='전체';detail()});}
function detail(){const m=selected,hasHistory=m.id===1;main.innerHTML=`<a href="#${mode}" class="back">←　회원 목록으로</a><section class="panel"><div class="detailheader"><div class="avatar">${m.name[0]}</div><div class="detailidentity"><div class="eyebrow" style="margin-bottom:5px">MEMBER PROFILE</div><h1>${m.name}</h1><div class="detailfacts"><span>${m.gender} · ${m.age.endsWith('세')?'만 ':''}${m.age}</span><span>${m.phone}</span><span>가상 마음숲 상담센터</span></div><div style="margin-top:12px">${status(m)} <span class="sub" style="display:inline">· 최근 접속 ${m.login}</span></div></div><button id="reveal">개인정보 열람</button></div><div class="privacy">담당 관계와 동의 범위 내에서만 열람 · 다른 기관의 기록은 포함되지 않습니다.</div><div class="statstrip"><div><small>최근 30일 출석</small><strong>${hasHistory?'4':'—'} <span>회</span></strong></div><div><small>상담 완료</small><strong>${hasHistory?'2':'—'} <span>회</span></strong></div><div><small>유효 밴드 측정</small><strong>${hasHistory?'3':'—'} <span>회</span></strong></div><div><small>열람 가능한 리포트</small><strong>${hasHistory?'3':'—'} <span>건</span></strong></div></div></section>${hasHistory?detailBody():`<section class="panel section" style="margin-top:20px"><h2>활동 기록</h2><p class="muted" style="margin-top:12px">이 회원의 상세 이력은 시안에 준비되어 있지 않습니다.</p><button id="example" style="margin-top:16px">윤가온 회원의 예시 상세 보기</button></section>`}<p class="footnote">가상 인물·가상 활동·가상 변화량입니다. 원본 열기·개인정보 열람은 실제로 실행되지 않습니다.<br>LINK BAND 미사용 시에도 상담·체크인·리포트를 이용할 수 있습니다.</p>`;document.getElementById('reveal').onclick=()=>toast('시안: 실제 열람은 업무 목적·권한·동의 확인 및 감사 기록 후 가능합니다.');document.getElementById('example')?.addEventListener('click',()=>{selected=members[0];detail()});document.querySelectorAll('[data-origin]').forEach(a=>a.onclick=e=>{e.preventDefault();toast('가상 데이터 시안입니다. 실제 원본과 연결되지 않았습니다.')});timelineType='전체';timelinePeriod='최근 30일';document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{timelineType=b.dataset.type;applyTimelineFilters()});document.getElementById('period')?.addEventListener('change',e=>{timelinePeriod=e.target.value;applyTimelineFilters()});}
function applyTimelineFilters(){document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type===timelineType)));document.querySelectorAll('.timeline-day').forEach(d=>{const inPeriod=timelinePeriod!=='최근 7일'||d.dataset.old!=='true';d.querySelectorAll('.event').forEach(e=>e.hidden=!inPeriod||(timelineType!=='전체'&&e.dataset.kind!==timelineType));d.hidden=![...d.querySelectorAll('.event')].some(e=>!e.hidden)});}
function detailBody(){return `<div class="detailgrid"><section class="panel section"><div class="sectionhead"><h2>활동 타임라인</h2><select id="period" aria-label="활동 기간"><option>최근 30일</option><option>최근 7일</option></select></div><div class="timelinefilters" aria-label="활동 유형">${['전체','출석','상담','체크인','밴드'].map(t=>`<button data-type="${t}" aria-pressed="${t===timelineType}">${t}</button>`).join('')}</div><div class="timeline-day"><div class="day">오늘 · 2026.10.22</div><div class="event" data-kind="출석"><span class="time">10:00</span><span class="tag">클래스 출석</span><h3>아침 호흡 · 4회차</h3><p>출석 확인 · 입장 09:58<br>현재 접속 상태와 별도로 기록됩니다.</p><a href="#" data-origin>회차 기록 보기 →</a></div><div class="event" data-kind="체크인"><span class="time">09:56</span><span class="tag">수업 전 체크인</span><h3>“오늘은 차분하게 시작하고 싶어요.”</h3><p>회원이 직접 남긴 소감 · 편안함 ‘보통’</p></div></div><div class="timeline-day"><div class="day">10월 20일 · 화요일</div><div class="event" data-kind="출석"><span class="time">10:00</span><span class="tag">클래스 출석</span><h3>아침 호흡 · 3회차</h3><p>출석 확인 · 밴드 미착용<br>리포트는 측정 없이도 이용할 수 있습니다.</p><a href="#" data-origin>회차 기록 보기 →</a></div></div><div class="timeline-day"><div class="day">10월 17일 · 토요일</div><div class="event" data-kind="상담"><span class="time">14:00</span><span class="tag">상담 완료</span><h3>개인 상담 · 일상 속 긴장 알아차리기</h3><p>가상 상담사 · 개인상담 내용은 담당자만 열람</p><a href="#" data-origin>상담 기록 보기 →</a></div></div><div class="timeline-day" data-old="true"><div class="day">10월 15일 · 목요일</div><div class="event" data-kind="밴드"><span class="time">10:30</span><span class="tag">밴드 측정</span><h3>아침 호흡 · 2회차</h3><p>유효 측정 24분 · EEG 수집 동의 확인<br>회차 전반과 후반의 변화 기록이 있습니다.</p><a href="#" data-origin>측정 기록 보기 →</a></div></div><p class="notice" style="text-align:left;max-width:none">최근 30일 주요 활동 예시입니다.<br>AI 안부 기록은 기능 공개·열람 동의 시에만 추가됩니다.</p></section><div class="rightcol"><section class="panel section"><div class="sectionhead"><h2>리포트 기록</h2><span class="muted" style="font-size:12px">3건 · 최근 30일</span></div><a href="#" class="report" data-origin><div class="reporttop"><span class="date muted">활동 10.22 · 생성 10.22</span><span class="tag">검토 중</span></div><b>아침 호흡 · 4회차　↗</b><p>회원용 · 담당 상담사 검토용 · 회원에게는 아직 미공개</p></a><a href="#" class="report" data-origin><div class="reporttop"><span class="date muted">활동 10.20 · 생성 10.20</span><span class="tag">승인 완료</span></div><b>아침 호흡 · 3회차　↗</b><p>회원용 · 밴드 미착용 · 수업 소감 중심</p></a><a href="#" class="report" data-origin><div class="reporttop"><span class="date muted">활동 10.15 · 생성 10.16</span><span class="tag">승인 완료</span></div><b>아침 호흡 · 2회차　↗</b><p>회원용 · 서사와 회차 내 변화 포함</p></a></section><section class="panel section"><div class="sectionhead"><h2>변화 기록</h2><span class="tag">회차 안에서의 변화</span></div><div class="trendnote">각 수업의 전반과 후반을 비교합니다.<br>날짜 사이의 수치를 연결해 호전·악화를 판단하지 않습니다.</div><div class="change"><div class="changehead"><span>10.20 · 아침 호흡 3회차</span><span class="muted">밴드 미착용</span></div><strong>수업 후, 한결 편안해졌다는 소감</strong><p>회원 직접 소감: “호흡에 집중하니 마음이 가벼워졌어요.”<br>EEG 변화량은 제공하지 않습니다.</p><a href="#" data-origin>근거 리포트 보기 →</a></div><div class="change"><div class="changehead"><span>10.15 · 아침 호흡 2회차</span><span class="muted">승인된 리포트</span></div><strong>후반에 휴식 상태로 이동 · +8%p</strong><p>가상 리포트 서사: 호흡이 이어지며 후반에 이완되는 흐름이 관찰되었습니다.<br>해당 회차 전반 대비 후반 변화 · 정규화 단위 예시 · 유효 24분</p><a href="#" data-origin>근거 리포트 보기 →</a></div></section><section class="panel section"><div class="sectionhead"><h2>상담사 비공개 메모</h2><span class="tag">나만 보기</span></div><p class="memo">다음 만남에서는 일상에서 호흡을 시도한 경험을 함께 살펴보기.<br>이 메모는 회원이나 다른 상담사에게 공유되지 않습니다.</p></section></div></div>`;}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,4500)}
window.addEventListener('hashchange',()=>{if(location.hash==='#detail')detail();else{mode=location.hash==='#cards'?'cards':'table';list()}window.scrollTo(0,0)});if(location.hash==='#detail')detail();else list();
</script></body></html>
