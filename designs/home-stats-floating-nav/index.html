function action(label){if(label==='더보기'){document.querySelector('#drawer')?.removeAttribute('hidden');return}let el=document.createElement('div');el.textContent='시안 · '+label+' 이동 (제품 연결 없음)';el.style='position:fixed;top:70px;left:20px;right:20px;background:#5f0080;color:white;padding:16px;border-radius:12px;z-index:90';document.body.append(el);setTimeout(()=>el.remove(),1600)}
</script></body></html>
