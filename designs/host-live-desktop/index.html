</style><body><div id="app"></div><script>

function gallery(){document.querySelector('#app').innerHTML=`<main class="gallery"><div class="eyebrow">MIND BREEZE · DESIGN REVIEW · 2026.10.22</div><h1>모바일의 익숙함을, 데스크톱에도.</h1><p class="intro">신호는 도크 바로 위에서, 체크인은 수업 상태 안에서. 상단부터 하단까지 같은 폭으로 정렬합니다. 아래 이미지는 1440·390 비교이며, 화면 열기에서는 브라우저 폭에 맞게 반응합니다. 모든 이름·수치는 샘플 데이터입니다.</p><div class="compare">${[['current','현재 · SDD-235 실제 하니스','전체 폭 상단 바, 1000px 본문, 640px 도크가 분리되어 있습니다. 기존 저장 캡처이며 dev 실사용 캡처는 아닙니다.'],['A','A · 한 컬럼 유지 / 추천','1000px 컬럼에 모든 영역을 정렬. 모바일 헤드와 신호 위치 유지, 체크인 도크 제거. 지표 기준은 기존 위치 유지.'],['B','B · 참가자 우선','1200px 컬럼과 4열 참가자 영역. 내 영상도 그리드로 이동. 수업 상태를 도크에 두고 지표는 상단 카드로 접근.']].map(([v,t,d])=>`<article class="option"><h2>${t}</h2><p>${d}</p><div class="links"><a href="?variant=${v}">화면 열기 ↗</a></div><img alt="${t} 데스크톱 1440" src="${v==='current'?'../../specs/sdd-235-host-mobile-signals/screens/none-1440.png':`screenshots/${v}-none-1440.png`}"><img class="mobile-img" alt="${t} 모바일 390" src="${v==='current'?'../../specs/sdd-235-host-mobile-signals/screens/none-390.png':`screenshots/${v}-none-390.png`}"></article>`).join('')}</div><section class="states"><h2>토스트 · 수업 상태 시트</h2><p>첫 신호는 수신 즉시, 이후에는 같은 카드 갱신. 이름과 현재 상태를 함께 확인합니다. 아래는 시간 흐름을 멈춘 디자인 샘플입니다.</p>${['A','B'].map(v=>`<div class="links">${states.map(([s,t])=>`<a href="?variant=${v}&state=${s}">${v} · ${t}</a>`).join('')}</div>`).join('')}<p class="intro">모바일·데스크톱의 모든 상태 캡처는 screenshots/에 있습니다. <a href="README.md">정책·근거·구현 범위 읽기</a></p></section></main>`}
let handCount=state==='hand-one'?1:state==='hand-many'?3:0,quietCount=state==='quiet-one'?1:state==='quiet-many'?3:0;
const self=()=>`<div class="self"><div class="silhouette"></div><button aria-label="내 미디어 열기" data-open="미디어">${icon('mic')}</button><span class="self-label">내 화면</span></div>`;
const statusButton=()=>`<button class="status" data-open="수업 상태">수업 상태 ${icon('arrow')}</button>`;
const names=['지은','민수','서연','도윤','하늘','유진'];
function toast(){if(!handCount&&!quietCount)return '';let title=handCount?(handCount===1?'지은님이 손을 들었어요':'지은 외 2명이 손을 들었어요'):(quietCount===1?'지은 · 조금 어려워요':'서연 · 잠시 쉴게요');let sub=handCount?`현재 대기 ${handCount}명 · 발언권 0명`:(quietCount===1?'전체: 어려워요 1':'전체: 어려워요 2 · 잠시 쉴게요 1');return `<div class="toast" role="status"><button class="toast-main" data-open="${handCount?'손든 회원':'조용한 신호'}"><b>${title}</b><small>${sub}</small><small>${handCount?'탭해서 대기 회원 확인':(quietCount>1?'지은·민수: 어려워요 · 최근 10초':'최근 10초 · 탭해서 확인')}</small></button><button class="toast-close" aria-label="신호 알림 닫기" onclick="this.closest('.toast').remove()">×</button></div>`}
function screen(){document.querySelector('#app').innerHTML=`<main class="pz-root screen ${variant}"><span class="sample">${variant}안 · 샘플 데이터</span><div class="column"><header class="top panel"><div class="top-info"><div class="top-row"><h1>마음챙김 명상수업 · 4회차</h1><span class="code"><small>코드 :</small> 4829</span></div><div class="top-row"><span>12:34 <small>/ 30:00</small></span><small>접속 5 / 6</small></div></div><button class="end" data-open="종료 안내">종료</button></header><div class="head"><${variant==='B'?'button':'div'} class="notice panel" ${variant==='B'?'data-open="지표 기준" aria-label="지표 기준 열기"':''}>${icon('circle')}<span><b>이번 수업은 밴드 없이 진행 중이에요</b><small>측정 없이도 수업은 그대로 진행돼요${variant==='B'?' · 지표 기준 ↗':''}</small></span></${variant==='B'?'button':'div'}>${self()}</div><div class="section-title"><small>참가자 6명</small>${variant==='A'?statusButton():''}</div><div class="toast-slot">${toast()}</div><div class="participants">${variant==='B'?self():''}${names.map((n,i)=>`<button class="tile ${i<handCount?'hand':''}" data-open="${n} · 참가자 상세"><span class="avatar">${n[0]}</span><b>${n}</b><small>${i<handCount?'손듦 · 대기 중':i===5?'현재 미접속':i===4?'체크인 전 · 참여 중':'체크인 완료 · 참여 중'}</small></button>`).join('')}</div><footer class="footer"><div class="signals"><button class="${handCount?'':'empty'}" data-open="손든 회원">${icon('hand')}<span><b>손들기 ${handCount}</b><small>발언권 0명</small></span></button><button class="${quietCount?'':'empty'}" data-open="조용한 신호">${icon('activity')}<span><b>조용한 신호 ${quietCount}</b><small>최근 10초</small></span></button></div><nav class="dock panel" aria-label="수업 도구">${variant==='A'?`<button data-open="지표 기준">${icon('activity')}지표 기준</button>`:statusButton()}<button data-open="채팅">${icon('chat')}채팅</button><button data-open="미디어">${icon('video')}미디어</button><button data-open="도구">${icon('tools')}도구</button></nav></footer></div></main>`;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSheet(b.dataset.open,b));if(state==='status')openSheet('수업 상태',document.querySelector('.status'))}
let opener;function closeSheet(){document.querySelector('.shade')?.remove();document.querySelector('.sheet')?.remove();document.querySelector('.screen').inert=false;opener?.focus()}
function openSheet(title,button){opener=button;const status=`<p class="secondary">체크인과 수업 운영 상태를 함께 확인해요.</p><section class="sheet-section"><h3>자가 체크인</h3><div class="row"><span>응답 완료</span><b>4 / 6명</b></div><div class="progress"><i></i></div><p class="secondary">응답 전 2명 · 미응답은 이상 상태가 아니에요</p><details><summary>체크인 응답 보기</summary><div class="row"><span>지은 · 차분해요</span></div><div class="row"><span>민수 · 조금 피곤해요</span></div><div class="row"><span>서연 · 편안해요</span></div><div class="row"><span>도윤 · 긴장돼요</span></div><p class="secondary">샘플 응답 · 실제 기록 아님</p></details></section><section class="sheet-section"><h3>참여 현황</h3><div class="row"><span>접속 중</span><b>5 / 6명</b></div><div class="row"><span>입장 대기</span><b>0명</b></div><div class="row"><span>밴드 연결 / 미착용</span><b>0 / 6명</b></div></section><section class="sheet-section"><h3>기록 · 미디어</h3><div class="row"><span>마이크 / 카메라</span><b>켜짐</b></div><div class="row"><span>AI 기록</span><b>녹음 중</b></div></section>`;let content=title==='지표 기준'?'<p>지금은 밴드 없이 진행 중이에요.</p><section class="sheet-section"><h3>밴드 연결 후 볼 수 있는 지표</h3><p>이완도 · 집중도 · 정서 균형</p><p class="secondary">지표 선택 기능은 제품 구현 단계에서 연결합니다.</p></section>':title==='수업 상태'?status:title==='조용한 신호'?`<p>이름과 선택은 상담사에게만 보여요.</p><p class="secondary">최근 10초 · 회원별 최신 선택 1건</p><section class="sheet-section"><div class="row"><span>조금 어려워요</span><b>${quietCount>1?2:quietCount}</b></div><div class="row"><span>잠시 쉴게요</span><b>${quietCount>1?1:0}</b></div><div class="row"><span>잘 따라가요</span><b>0</b></div></section><section class="sheet-section">${quietCount?`<p>지은 · 조금 어려워요</p>${quietCount>1?'<p>민수 · 조금 어려워요</p><p>서연 · 잠시 쉴게요</p>':''}`:'최근 10초 동안 받은 신호가 없어요.'}</section>`:title==='손든 회원'?`<p>현재 대기 ${handCount}명 · 발언권 0명</p><section class="sheet-section">${handCount?names.slice(0,handCount).map(n=>`<div class="row"><b>${n}</b><span>발언 대기</span></div>`).join(''):'손든 회원이 없어요.'}</section><p class="secondary">실제 발언권 조치는 제품 구현 단계에서 연결합니다.</p>`:`<p>시안에서 ${title} 진입 위치를 확인합니다.</p><p class="secondary">이 화면의 실제 기능은 연결하지 않았어요.</p>`;document.querySelector('.screen').inert=true;document.body.insertAdjacentHTML('beforeend',`<div class="shade"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-header"><h2>${title}</h2><button aria-label="시트 닫기" onclick="closeSheet()">×</button></div>${content}</section>`);document.querySelector('.sheet button').focus();document.querySelector('.shade').onclick=closeSheet}
document.addEventListener('keydown',e=>{if(!document.querySelector('.sheet'))return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const items=[...document.querySelectorAll('.sheet button,.sheet summary')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
if(!variant)gallery();else if(variant==='current'){document.querySelector('#app').innerHTML=`<img class="current-img" alt="SDD-235 실제 컴포넌트 하니스 저장 캡처" src="../../specs/sdd-235-host-mobile-signals/screens/none-${innerWidth<700?'390':'1440'}.png">`}else screen();
</script></body></html>
