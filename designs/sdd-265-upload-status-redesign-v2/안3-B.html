<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>안 3-B · 데이터 상황판</title><style>
*{box-sizing:border-box}body{margin:0;background:#F7F4F0;color:#29232e;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}button,input,select{font:inherit;min-height:40px;border:1px solid #E8E2ED;border-radius:10px;background:white;color:#5F0080;padding:7px 10px;max-width:100%;min-width:0}button,summary{cursor:pointer}button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9964ac}button:disabled{opacity:.4}h1,h2,p{margin:0}h1{font-size:26px}h2{font-size:18px}small,.muted{color:#776D7B;font-size:12px}.shell{max-width:1220px;margin:auto;padding:24px}nav{display:flex;gap:6px;margin:16px 0}.active{background:#5F0080;color:white}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:11px;color:#776D7B}.hero,.panel,.group{background:white;border:1px solid #E8E2ED;border-radius:20px;padding:20px;margin:14px 0}.hero{border-top:3px solid #5F0080}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.metric{padding:16px;background:#F8F5FA;border-radius:16px;min-width:0}.metric strong{display:block;font-size:29px;letter-spacing:-1px;margin:4px 0}.metric small{display:block}.badge{display:inline-block;border-radius:30px;padding:3px 9px;background:#E8F3ED;color:#226146;font-size:12px}.warn{background:#FFF2DD;color:#805000}.pending{background:#F2EFF5;color:#655173}.live{background:#F4EDF8;color:#5F0080}.progress{display:flex;justify-content:space-between;margin-top:16px}.bar{height:8px;background:#EEE8F1;border-radius:10px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#5F0080}.unknown{background:repeating-linear-gradient(90deg,#E8E2ED 0 8px,#F8F5FA 8px 16px)}.tools{display:flex;gap:8px;margin:14px 0}.tools input{flex:1}.group{padding:0;overflow:hidden}.group>summary,.gtitle{padding:12px 16px;font-weight:700;color:#655173}.session{display:grid;grid-template-columns:1.3fr 3fr auto;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid #EEE8F1}.session .nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.nums b{display:block;font-size:17px}.session .bar{height:4px;margin:4px 0}.session small{display:block}.action{color:#805000;font-size:12px;margin-top:5px}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.people{width:100%;border-collapse:collapse;text-align:left}.people th{background:#F2F3F8;font-size:12px}.people td,.people th{padding:12px;border-bottom:1px solid #EEE8F1}.people td small{display:block}.normal summary{padding:10px 0;color:#5F0080}.evidence{padding:10px;background:#F8F5FA;border-radius:10px;margin:8px 0}.member{max-width:620px;margin:auto}.member .hero{margin-top:16px}.member select{width:100%;margin:16px 0 0}.state{display:flex;align-items:center;gap:8px;margin:10px 0}.state select{flex:1}.notice{margin-top:12px;padding:12px;background:#F4EDF8;border-radius:12px;color:#5F0080}.overlay{position:fixed;inset:0;background:#24152b66;display:flex;justify-content:flex-end;z-index:10}.sheet{width:760px;max-width:100%;height:100%;overflow:auto;background:#F7F4F0;padding:20px}.sheet>header{display:flex;justify-content:space-between;align-items:center}.B .metric{background:white;border:1px solid #E8E2ED;padding:12px}.B .metric strong{font-size:25px}.B .session{padding:9px 16px}.B .nums>div{padding:6px 10px;border-radius:9px;background:#F8F5FA}.B .hero{border-top:1px solid #E8E2ED}.foot{margin-top:14px;font-size:11px;color:#776D7B}[hidden]{display:none!important}@media(max-width:650px){.shell{padding:14px}h1{font-size:22px}.tag{font-size:10px}.hero,.panel{padding:16px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:12px}.metric strong{font-size:25px}.session{grid-template-columns:1fr auto;gap:6px;padding:10px 12px}.session .nums{grid-column:1/-1;grid-row:2;gap:6px}.session .nums b{font-size:14px}.session .nums small{font-size:10px}.session .title small{display:inline;margin-left:6px}.session .title b{font-size:13px}.session .action{grid-column:1/-1;margin:0}.group>summary,.gtitle{padding:10px 12px}.tools{gap:6px}.tools select{width:120px}.people thead{display:none}.people tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #EEE8F1}.people td{padding:9px 5px;border:0;font-size:12px}.people td:nth-child(3),.people td:nth-child(4){grid-column:1/-1}.B .session{padding:8px 10px}.B .nums>div{padding:4px}.B .nums b{font-size:13px}.sheet{padding:14px}.member .metric strong{font-size:27px}}
@media(max-width:650px){.hero{margin:10px 0;padding:12px}.metric{padding:9px}.metrics{margin-top:10px}.session{padding:7px 10px}.group{margin:9px 0}nav{margin:10px 0}.tools{margin:10px 0}}@media(max-width:650px){.nums .badge{font-size:10px;padding:3px;word-break:keep-all;line-height:1.35}.nums small{word-break:keep-all}.B .nums>div{min-width:0}} </style><body class="B"><main class="shell" id="app"></main><div class="overlay" id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-label="회차 상세" id="sheet"></section></div><script>
const sessions=Array.from({length:10},(_,i)=>({id:i,name:['저녁 마음챙김','호흡 명상','아침 마음챙김'][i%3],date:'10.'+(31-i),state:i<2?'warn':i===2?'live':'ok'}));let mode='list',scenario='warn',q='',filter='',page=0,personPage=0,picked=0,selected=0,trigger;const $=s=>document.querySelector(s);const names={ok:'모두 도착',warn:'확인할 사람 2명',pending:'집계 대기',live:'측정 중',offline:'오프라인'};const badge=s=>`<span class="badge ${s}">${names[s]}</span>`;function setMode(v){mode=v;render()}function stateControl(){return `<label class="state">상태 예시<select aria-label="상태 변주" onchange="scenario=this.value;render()">${Object.keys(names).map(s=>`<option value="${s}" ${s===scenario?'selected':''}>${mode==='member'&&s==='warn'?'확인 필요':mode==='member'&&s==='live'?'전송 중':names[s]}</option>`).join('')}</select></label>`}function progress(s,p){return `<div class="progress"><b>전송 현황</b><b>${s==='pending'||s==='offline'?'집계 대기':p+'%'}</b></div><div class="bar ${s==='pending'||s==='offline'?'unknown':''}" ${s==='pending'||s==='offline'?'':`role="progressbar" aria-label="전송 현황" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"`}><i style="width:${s==='pending'||s==='offline'?0:p}%"></i></div>`}function metrics(s,member=false){let uncertain=['pending','offline'].includes(s),ok=s==='ok';return `<div class="metrics"><div class="metric"><small>${member?'내 상태':'상태'}</small><strong style="font-size:22px">${badge(s)}</strong><small>${ok?'추가 조치 없음':s==='warn'?'앱 연결 확인':s==='live'?'현재까지 도착한 기록':'최신 현황 확인 대기'}</small></div><div class="metric"><small>${member?'내 측정 길이':'참여자'}</small><strong>${member?'52분':uncertain?'—':ok?'40/40명':'36/38명'}</strong><small>${member?'선택한 회차':'도착 / 확인된 대상'}</small></div><div class="metric"><small>${member?'내 데이터 크기':'데이터 크기'}</small><strong>${uncertain?'—':member?(ok?'31MB':'27MB'):ok?'1.31GB':s==='live'?'0.78GB':'1.18GB'}</strong><small>${uncertain?'연결 후 확인':member?'예상 31MB':ok?'예상 1.31GB':'예상 1.25GB · 확인된 범위'}</small></div><div class="metric"><small>${member?'전송 현황':'측정 길이'}</small><strong>${member?(uncertain?'—':ok?'100%':'87%'):ok?'60분':'52분'}</strong><small>${member?'도착한 크기 기준':(ok?'전체 40명 · 합계 40시간':'전체 40명 · 합계 34.7시간')}</small></div></div>`}function sessionRow(s){let p=s.state==='ok'?100:s.state==='live'?62:94;return `<article class="session"><div class="title"><b>${s.name} · ${10-s.id}회차</b><small>${s.date} · 마지막 도착 14:32</small></div><div class="nums"><div>${badge(s.state)}</div><div><b>${s.state==='ok'?'40/40명':'36/38명'}</b><small>도착한 참여자</small></div><div><b>${p}%</b><small>전송 현황</small><div class="bar"><i style="width:${p}%"></i></div></div><div><b>${s.state==='ok'?'1.31':s.state==='live'?'0.78':'1.18'}GB</b><small>데이터 크기</small></div><div><b>${s.state==='ok'?'60':'52'}분</b><small>합계 ${s.state==='ok'?'40':'34.7'}시간</small></div></div><button aria-label="${10-s.id}회차 상세" onclick="openSheet(${s.id},this)">상세</button>${s.state==='warn'?'<p class="action">2명이 앱을 다시 켜면 이어서 도착해요</p>':''}</article>`}function list(){let found=sessions.filter(s=>(s.name+String(10-s.id)).includes(q)&&(!filter||s.state===filter)),shown=found.slice(page*5,page*5+5);return `<section class="hero"><small>최근 10회차 · 확인할 곳 먼저</small><h2>확인할 회차 2건</h2>${document.body.classList.contains('A')?'<div class="metrics"><div class="metric"><small>확인할 사람</small><strong>4명</strong></div><div class="metric"><small>측정 중</small><strong>1회차</strong></div><div class="metric"><small>모두 도착</small><strong>7회차</strong></div><div class="metric"><small>최근 회차</small><strong>10건</strong></div></div>':''}</section><div class="tools"><input aria-label="회차 검색" placeholder="클래스·회차 검색" value="${q}" oninput="q=this.value;page=0;updateList()"><select aria-label="상태 필터" onchange="filter=this.value;page=0;updateList()"><option value="">전체 상태</option>${['warn','live','ok'].map(s=>`<option value="${s}" ${filter===s?'selected':''}>${names[s]}</option>`).join('')}</select></div><div id="rows">${groups(shown)}</div><div class="pager"><button onclick="page--;updateList()" ${page===0?'disabled':''}>이전</button><span id="pageInfo">${page+1} / ${Math.max(1,Math.ceil(found.length/5))} · ${found.length}회차</span><button id="next" onclick="page++;updateList()" ${(page+1)*5>=found.length?'disabled':''}>다음</button></div>`}function groups(rows){return rows.length?['warn','live','ok'].map(s=>{let a=rows.filter(r=>r.state===s);return a.length?`<details class="group" ${s==='ok'?'':'open'}><summary>${s==='warn'?'확인할 곳 먼저':names[s]} · ${a.length}회차</summary>${a.map(sessionRow).join('')}</details>`:''}).join(''):'<p class="panel">검색 결과가 없어요</p>'}function updateList(){let input=$('[aria-label="회차 검색"]'),pos=input?.selectionStart;render();input=$('[aria-label="회차 검색"]');if(input){input.focus();input.setSelectionRange(pos,pos)}}function normalRows(){return Array.from({length:36},(_,i)=>i+1).slice(personPage*10,personPage*10+10).map(i=>`<tr><td>참여자 ${String(i).padStart(2,'0')}</td><td>14:32</td><td>모두 도착 · 31MB</td><td><details><summary>기록 보기</summary><div class="evidence">분석 데이터 · 모두 도착<br>측정 기록 파일 · 모두 도착<br>뇌파·맥박·움직임 · 모두 도착</div></details></td></tr>`).join('')}function detail(s=scenario){return `<div class="hero"><small>${sessions[selected].name} · ${10-selected}회차 / ${sessions[selected].date}</small><h2>회차 데이터 상황판</h2>${metrics(s)}${progress(s,s==='ok'?100:s==='live'?62:94)}<small>${s==='warn'?'확인된 38명 기준 · 1명 집계 대기 · 1명 수집 제외':s==='ok'?'40명 모두 도착':s==='live'?'측정 중 · 예상 크기는 바뀔 수 있어요':'전체 예상 크기 확인 전'}</small><p class="action">${s==='warn'?'2명이 앱을 다시 켜면 이어서 도착해요':s==='offline'?'연결 후 다시 확인해 주세요':s==='pending'?'예상 크기를 확인하고 있어요':s==='live'?'앱을 켠 채 측정을 이어가 주세요':'추가 조치는 없어요'}</p><details class="evidence"><summary>전송 세부 보기</summary>분석 데이터 · ${s==='ok'?'모두 도착':['pending','offline'].includes(s)?'집계 대기':'일부 도착'}<br>측정 기록 파일 · ${s==='ok'?'모두 도착':['pending','offline'].includes(s)?'집계 대기':'일부 도착'}<br><small>두 항목 합계 크기 기준 · 리포트 반영 여부는 별도</small></details></div>${s==='warn'?`<section class="panel"><h2>조치할 사람 · 2명</h2><table class="people"><thead><tr><th>이름</th><th>마지막 도착</th><th>덜 도착한 기록</th><th>할 일</th></tr></thead><tbody><tr><td>참여자 37</td><td>14:21</td><td>측정 기록 파일 · 12MB 남음</td><td>앱 다시 켜기</td></tr><tr><td>참여자 38</td><td>14:19</td><td>분석 데이터 · 3MB 남음</td><td>와이파이 연결</td></tr></tbody></table><details class="normal"><summary>모두 도착 36명 보기</summary><table class="people"><tbody id="normalRows">${normalRows()}</tbody></table><div class="pager"><button id="prevPerson" onclick="personPage--;refreshPeople()" ${personPage===0?'disabled':''}>이전 10명</button><span id="personInfo">${personPage+1} / 4 · 36명</span><button id="nextPerson" onclick="personPage++;refreshPeople()" ${personPage===3?'disabled':''}>다음 10명</button></div></details><details class="normal"><summary>집계 대기 1명 · 수집 제외 1명</summary><p>참여자 39 · 예상 크기 집계 대기</p><p>참여자 40 · 밴드 미착용, 수집 제외</p></details></section>`:s==='ok'?`<section class="panel"><details><summary>모두 도착 40명 보기</summary>${Array.from({length:4},(_,n)=>`<details class="evidence"><summary>${n*10+1}~${n*10+10}번 참여자</summary>${Array.from({length:10},(_,i)=>`<p>참여자 ${n*10+i+1} · 모두 도착 · 60분</p>`).join('')}</details>`).join('')}</details></section>`:''}`}function refreshPeople(){$('#normalRows').innerHTML=normalRows();$('#personInfo').textContent=(personPage+1)+' / 4 · 36명';$('#prevPerson').disabled=personPage===0;$('#nextPerson').disabled=personPage===3}function member(){let s=picked===0?scenario:'ok';return `<div class="member"><select aria-label="내 회차 선택" onchange="picked=Number(this.value);render()">${sessions.map((r,i)=>`<option value="${i}" ${picked===i?'selected':''}>${r.date} · ${r.name} ${10-i}회차</option>`).join('')}</select><section class="hero"><h2>내 데이터 저장 현황</h2>${metrics(s,true).replace('확인할 사람 2명','확인 필요').replace('측정 중','전송 중')}${progress(s,s==='ok'?100:87)}<p class="notice">${s==='ok'?'모두 도착했어요':s==='offline'?'연결 후 다시 확인해 주세요':s==='pending'?'예상 크기를 확인하고 있어요':'앱을 켠 채 와이파이에 연결해 주세요'}</p></section></div>`}function render(){$('#app').innerHTML=`<div class="top"><div><small>MIND BREEZE</small><h1>데이터 현황</h1></div><span class="tag">안 3-B · 가상 예시</span></div><nav>${[['list','코치 목록'],['detail','회차 상세'],['member','회원']].map(([v,t])=>`<button class="${mode===v?'active':''}" onclick="setMode('${v}')">${t}</button>`).join('')}</nav>${mode==='list'?'':stateControl()}${mode==='list'?list():mode==='detail'?detail():member()}<p class="foot">가상 데이터 시안 · 마지막 도착 14:32 · 서버에 도착한 기록 기준</p>`}function openSheet(id,b){selected=id;trigger=b;personPage=0;$('#sheet').innerHTML='<header><h2>회차 상세</h2><button id="close" onclick="closeSheet()">닫기</button></header>'+detail(sessions[id].state);$('#overlay').hidden=false;$('#app').inert=true;document.body.style.overflow='hidden';$('#close').focus()}function closeSheet(){$('#overlay').hidden=true;$('#sheet').innerHTML='';$('#app').inert=false;document.body.style.overflow='';trigger?.focus()}document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){let a=[...$('#sheet').querySelectorAll('button,summary,select,input')].filter(x=>x.getClientRects().length&&!x.disabled),f=a[0],l=a.at(-1);if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});render();
</script></body></html>
