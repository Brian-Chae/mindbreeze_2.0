  const SV_P = '<svg class="sv-p" viewBox="0 0 96 128" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="96" height="128" fill="url(#svg-bg)"/><circle cx="48" cy="60" r="16" fill="rgba(255,255,255,.3)"/><path d="M16 128c0-24 14-40 32-40s32 16 32 40z" fill="rgba(255,255,255,.22)"/></svg>';
  const SV_L = '<svg class="sv-l" viewBox="0 0 200 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="200" height="120" fill="url(#svg-bg)"/><circle cx="100" cy="52" r="15" fill="rgba(255,255,255,.3)"/><path d="M62 120c0-24 17-40 38-40s38 16 38 40z" fill="rgba(255,255,255,.22)"/></svg>';
  // 헤드 행 오른쪽 슬롯: 온라인=셀프뷰, 오프라인=셀프뷰 없이 수업 요약 패널
  function renderSlot() {
    const slot = $('#hslot');
    if (loc === 'offline') {
      const L = people();
      const joined = L.filter(p => p.band !== 'lost').length;
      const answered = L.length === 1 ? 1 : Math.max(0, joined - 1);
      const rec = state.rec === 'paused' ? '<b>정지됨</b>' : `<b><i class="rdot"></i>${REC_T}</b>`;
      slot.innerHTML = `<div class="sumpanel" id="sumpanel" role="group" aria-label="수업 요약"><div class="sp-r"><span>녹음</span>${rec}</div><div class="sp-r"><span>체크인</span><b>${answered}/${joined}</b></div><div class="sp-r"><span>밴드</span><b>${L.filter(p => p.band === 'on').length}/${L.length}</b></div></div>`;
      return;
    }
    const big = state.camBig && !scn.camDenied && !(isBottomSheet() && state.sheet);
    $('#head').classList.toggle('big', big);
    const micOff = !state.mic || scn.micDenied;
    const camTxt = scn.camDenied ? '카메라 사용 불가' : (state.cam ? '카메라 켜짐' : '카메라 꺼짐');
    const dot = scn.camDenied ? 'lost' : (state.cam ? 'on' : 'off');
    const body = scn.camDenied
      ? `<span class="sv-off deny">${icon('videooff')}<span>카메라를 쓸 수 없어요</span><small>설정 안내 ›</small></span>`
      : (state.cam ? `<span class="sv-vid">${SV_P}${SV_L}</span>` : `<span class="sv-off">${icon('videooff')}카메라 꺼짐</span>`);
    slot.innerHTML = `<button class="selfview ${scn.camDenied ? 'deny' : ''}" id="selfview" aria-label="내 화면 ${camTxt}, 마이크 ${micOff ? '꺼짐' : '켜짐'}. ${scn.camDenied ? '탭하면 설정 안내' : '탭하면 크기 전환'}">${body}
      ${scn.camDenied ? '' : `<span class="sv-ic sv-sz" aria-hidden="true">${icon(big ? 'shrink' : 'expand')}</span>`}
      <span class="sv-ic sv-mic ${micOff ? 'off' : ''}" aria-hidden="true">${icon(micOff ? 'micoff' : 'mic')}</span>
      <span class="sv-lb"><i class="dot ${dot}"></i>내 화면</span></button>`;
  }

  // 칩 줄: 우선순위 순서. 한 줄을 넘으면 뒤에서부터 생략하고 "+N" 더보기 칩을 둔다
  let chipCache = [];
  function chipItems() {
    const L = people();
    const c = k => L.filter(p => p.band === k).length;
    const online = loc === 'online';
    const items = [];
    if (state.rec) {
      const paused = state.rec === 'paused';
      items.push({ key: 'rec', label: paused ? '기록 일시정지' : `녹음 중 ${REC_T}`, sheet: 'media',
        html: `<button class="achip" data-sheet="media" aria-label="${paused ? '기록 일시정지' : '녹음 중 ' + REC_T}"><span class="ap ${paused ? 'pause' : 'rec'}">${paused ? icon('pause') + '기록 일시정지' : `<i class="rdot"></i>녹음 중 <b>${REC_T}</b>`}</span></button>` });
    }
    if (scn.allOff) items.push({ key: 'checkin', label: `체크인 ${Math.max(0, L.length - 2)}/${L.length}`, sheet: 'checkin', html: `<button class="achip" data-sheet="checkin"><span class="ap">${icon('check')}체크인 <b>${Math.max(0, L.length - 2)}/${L.length}</b></span></button>` });
    const sp = L.find(p => p.speaking);
    if (online && sp) items.push({ key: 'speak', label: `${sp.name} 말하는 중`, sheet: 'hands',
      html: `<button class="achip" data-sheet="hands"><span class="ap sp">${icon('mic')}${sp.name} 말하는 중</span></button><button class="achip" data-act="revoke" aria-label="${sp.name} 발언권 회수"><span class="ap act">회수</span></button>` });
    const hands = L.filter(p => p.hand);
    if (online && hands.length) items.push({ key: 'hands', label: `손든 회원 ${hands.length}`, sheet: 'hands', html: `<button class="achip" data-sheet="hands"><span class="ap hd">${icon('hand')}손든 회원 <b>${hands.length}</b></span></button>` });
    const lead = c('leadoff'), bat = L.filter(p => p.lowbat).length;
    if (lead || bat) {
      const parts = [lead ? `접촉 확인 <b>${lead}</b>` : '', bat ? `배터리 <b>${bat}</b>` : ''].filter(Boolean).join(' · ');
      items.push({ key: 'actions', label: `필요 조치 · 접촉 확인 ${lead} · 배터리 ${bat}`, sheet: 'actions', html: `<button class="achip" data-sheet="actions"><span class="ap ${lead ? 'warn' : 'cau'}">${icon('alert')}${parts}</span></button>` });
    }
    if (state.queue > 0) items.push({ key: 'queue', label: `입장 대기 ${state.queue}`, sheet: 'queue', html: `<button class="achip" data-sheet="queue"><span class="ap">${icon('users')}대기 <b>${state.queue}</b></span></button>` });
    if (scn.selfBand) {
      const on = scn.selfBand === 'on';
      items.push({ key: 'myband', label: on ? '내 밴드 연결됨' : '내 밴드 미착용', sheet: 'myband',
        html: `<button class="achip" data-sheet="myband"><span class="ap"><i class="dot ${on ? 'on' : 'off'}"></i>${on ? '내 밴드 연결됨 · 이완 <b>72</b>' : '내 밴드 미착용 · 선택'}</span></button>` });
    }
    if (online && hands.length) items.push({ key: 'first', label: '손든 회원 우선 정렬', act: 'handsfirst', html: `<button class="achip" data-act="handsfirst" aria-pressed="${state.handsFirst}"><span class="ap ${state.handsFirst ? 'on' : ''}">${icon('sort')}손든 회원 우선</span></button>` });
    if (scn.solo) items.push({ key: 'band', label: BAND_TXT[L[0].band], html: `<span class="achip" role="group" aria-label="밴드 상태"><span class="ap sm"><span class="sg"><i class="dot ${bandDot(L[0].band)}"></i>밴드 ${BAND_TXT[L[0].band]}</span></span></span>` });
    else items.push({ key: 'band', label: `연결 ${c('on')} · 미착용 ${c('off')} · 끊김 ${c('lost')}`,
      html: `<span class="achip" role="group" aria-label="밴드 상태 요약"><span class="ap sm"><span class="sg"><i class="dot on"></i>연결 <b>${c('on')}</b></span><span class="sg"><i class="dot off"></i>미착용 <b>${c('off')}</b></span><span class="sg"><i class="dot lost"></i>끊김 <b>${c('lost')}</b></span></span></span>` });
    items.push({ key: 'range', opt: true, html: `<span class="achip"><span class="ap" id="rangechip"><b id="rangetxt">1–1 / ${L.length}명</b></span></span>` });
    return items;
  }
  function renderChips() {
    chipCache = chipItems();
    $('#chipline').innerHTML = chipCache.map(i => `<span class="grp ${i.opt ? 'gopt' : ''}" ${i.opt ? 'data-skip="1"' : ''}>${i.html}</span>`).join('') + `<button class="achip more" data-sheet="alerts" aria-label="나머지 보기" hidden><span class="ap"><b>+0</b></span></button>`;
    fitChips();
  }
  function fitChips() {
    const line = $('#chipline');
    if (!line) return;
    const all = $$(':scope > .grp', line).filter(k => !k.dataset.skip);
    const more = $('.more', line);
    if (!all.length) return;
    all.forEach(k => { k.hidden = false; });
    more.hidden = true;
    const avail = line.clientWidth, gap = 4;
    const sum = list => list.reduce((a, k) => a + k.offsetWidth, 0) + gap * Math.max(0, list.length - 1);
    // 1) 선택 칩(범위)을 먼저 생략, 2) 그래도 넘치면 뒤에서부터 생략하고 "+N" 더보기
    let kids = all;
    if (sum(kids) > avail) { all.filter(k => k.classList.contains('gopt')).forEach(k => { k.hidden = true; }); kids = all.filter(k => !k.hidden); }
    if (sum(kids) > avail) {
      more.hidden = false;
      more.querySelector('b').textContent = `+${kids.length - 1}`;
      const mw = more.offsetWidth;
      let n = kids.length;
      while (n > 1 && sum(kids.slice(0, n)) + gap + mw > avail) n -= 1;
      kids.slice(n).forEach(k => { k.hidden = true; });
      more.querySelector('b').textContent = `+${kids.length - n}`;
    }
  }

  function bannerSpec() {
    if (scn.net === 'down') return { tone: 'coral', ic: 'wifioff', t: '연결이 끊겼어요', d: '밴드 데이터는 기기에 보관 중이에요. 복구되면 이어서 기록돼요.', btn: '다시 연결', act: 'retry' };
    if (scn.net) return { tone: 'coral', ic: 'wifioff', t: '연결이 불안정해요', d: '데이터 수신이 잠시 중단됐어요. 복구되면 이어서 기록돼요.' };
    if (loc === 'online' && scn.micDenied) return { tone: 'coral', ic: 'micoff', t: '마이크를 쓸 수 없어요', d: '허용하면 AI 기록이 시작돼요. 허용하지 않아도 수업은 계속돼요.', btn: '허용 방법', sheet: 'permmic' };
    if (loc === 'online' && !state.mic) return { tone: 'info', ic: 'micoff', t: '마이크 꺼짐', d: '이 구간은 AI 기록에서 빠져요. 뇌파는 계속 기록돼요.', btn: '마이크 켜기', act: 'mic' };
    return null;
  }
  function renderBanner() {
    const b = bannerSpec();
    const el = $('#banner');
    if (!b) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.className = `banner ${b.tone === 'coral' ? 'coral' : ''}`;
    el.setAttribute('role', 'status');
    el.innerHTML = `<span class="bn-ic">${icon(b.ic)}</span><span class="bn-tx"><b>${b.t}</b>${b.d}</span>${b.btn ? `<button class="bn-btn" ${b.sheet ? `data-sheet="${b.sheet}"` : `data-act="${b.act}"`}>${b.btn}</button>` : ''}`;
  }
  function renderDock() {
    const btn = $('.dk[data-sheet="media"]');
    btn.innerHTML = loc === 'offline' ? `<span class="ico">${icon('mic')}</span>녹음` : `<span class="ico">${icon('video')}</span>미디어`;
    if (loc === 'online' && scn.camDenied) btn.setAttribute('aria-label', '미디어, 카메라 사용 불가');
  }
  function renderStrip() {
    const strip = $('#mstrip');
    if (scn.allOff) {
      strip.classList.add('nobd'); strip.disabled = true; strip.removeAttribute('data-sheet');
      strip.style.setProperty('--mcol', 'var(--tx-mid)');
      strip.setAttribute('aria-label', '이번 수업은 밴드 없이 진행 중이에요');
      strip.innerHTML = `<span class="mg" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7"/></svg></span><span class="mtx"><b class="mnote">이번 수업은 밴드 없이 진행 중이에요</b><span class="msub">측정 없이도 수업은 그대로 진행돼요</span></span>`;
      return;
    }
    const m = MKEY[state.metric];
    const a = avgOf(m.key);
    const showAvg = !scn.solo;
    strip.style.setProperty('--mcol', mcol(m.key));
    strip.innerHTML = `<span class="mg" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="5"/><circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="70 100" transform="rotate(-90 20 20)"/></svg></span>
      <span class="mtx"><span class="mtop"><span class="mlb">${scn.solo ? '강조해서 보는 지표' : '지금 보는 지표'}</span><span class="mrot" ${state.rotate ? '' : 'hidden'}>${icon('rot')}<span><span class="lgx">10초마다 </span>순환 중</span></span></span><b class="mnm" id="mstrip-name" data-key="${m.key}"><i></i>${m.label}<small>${m.unit}</small></b></span>
      ${showAvg ? `<span class="mavg"><small>그룹 평균</small><b>${a === null ? '—' : a}</b></span>` : ''}${icon('chev', 'chev')}`;
  }

  // ── 시트 ──
  const SHEET_TITLE = { metric: '지표 기준', chat: '채팅', media: '미디어', checkin: '체크인 요약', tools: '도구' };

  function seriesFor(p, key) {
    const m = MKEY[key];
    const end = p.v ? p.v[key] : 0;
    const span = m.max - m.min;
    return Array.from({ length: 60 }, (_, i) => {
      const f = (59 - i) / 59;
      const wave = Math.sin(i / 5 + p.id * 1.7) * span * 0.05 * (0.4 + f) + Math.sin(i / 11 + p.id) * span * 0.03 + Math.sin(i * 1.9 + p.id * 3) * span * 0.012;
      const drift = -(((p.id * 3) % 7) - 3) * span * 0.018 * f;
      return Math.max(m.min, Math.min(m.max, end + wave + drift * 2));
    });
  }
  function trendSVG(pts, m) {
    const lo = Math.min(...pts), hi = Math.max(...pts);
    const pad = (hi - lo) * 0.2 || 4;
    const y = v => 44 - ((v - (lo - pad)) / ((hi + pad) - (lo - pad))) * 40 - 2;
    const d = pts.map((v, i) => `${i ? 'L' : 'M'}${(i / 59 * 300).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 300 44" preserveAspectRatio="none" aria-label="최근 5분 ${m.label} 추이" style="color:${mcol(m.key)}"><path d="${d} L300 44 L0 44 Z" fill="currentColor" fill-opacity=".16"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
  }

  function miniHTML(p, x) {
    const v = p.v ? p.v[x.key] : null;
    const live = p.band === 'on' && v !== null;
    return `<div class="mini ${x.key === state.metric ? 'sel' : ''}" style="--mcol:${mcol(x.key)}"><div class="ring">${live ? ringSVG(pctOf(x, v), 'ok', x.key) : ringSVG(0, p.band === 'off' ? 'off' : 'lost')}<div class="val"><b class="num" ${live ? '' : 'style="color:var(--tx-lo)"'}>${live ? v : '—'}</b></div></div><span class="ml">${x.short}</span></div>`;
  }
  function trendHTML(p, m) {
    if (p.band === 'on') {
      const pts = seriesFor(p, m.key);
      const dlt = Math.round(pts[59] - pts[0]);
      return `<div class="trend"><div class="th"><span>최근 5분 · ${m.label}</span><b style="color:${mcol(m.key)}">${dlt > 0 ? '+' : ''}${dlt}</b></div>${trendSVG(pts, m)}<div class="axis"><span>5분 전</span><span>지금</span></div></div>`;
    }
    const msg = p.band === 'lost' ? `LINK BAND 연결이 ${p.ago}부터 끊겼어요. 다시 연결되면 지표가 이어서 표시돼요.` : (p.band === 'leadoff' ? '접촉이 불안정해요. 밴드를 이마에 밀착하도록 안내해 주세요.' : 'LINK BAND 없이 참여 중이에요. 체크인 응답으로 상태를 살펴보세요.');
    return `<div class="noband">${msg}</div>`;
  }
  const qaHTML = p => p.ci.map(([q, a]) => `<div class="qa"><span class="q">${q}</span><span class="a">${a}</span></div>`).join('');
  function soloHTML(p) {
    const m = MKEY[state.metric];
    return `<div class="solowrap"><div class="solo">
      <section class="card"><header class="solo-h"><span class="av">${p.name[0]}</span><b>${p.name}</b><span class="chip"><i class="dot ${bandDot(p.band)}"></i>${BAND_TXT[p.band]}</span></header><div class="minis">${METRICS.map(x => miniHTML(p, x)).join('')}</div></section>
      <section class="solo-r">${trendHTML(p, m)}<div class="card qas"><p class="lbl">체크인 응답</p>${qaHTML(p)}</div></section></div></div>`;
  }
  const personRow = (p, small, btn) => `<div class="lrow"><div class="l"><span class="av">${p.name[0]}</span><div class="tx"><b>${p.name}</b>${small}</div></div>${btn || ''}</div>`;
  const stepsHTML = what => `<ol class="steps"><li>브라우저 주소창 왼쪽의 자물쇠 아이콘을 눌러요</li><li>${what}을 &quot;허용&quot;으로 바꿔요</li><li>이 화면을 새로고침해요</li></ol>`;

  function sheetContent() {
    const s = state.sheet;
    if (s === 'metric') {
      const m = MKEY[state.metric];
      const grp = g => `<div class="sec"><p class="lbl">${g}</p><div class="opts" role="radiogroup" aria-label="${g} 지표">${METRICS.filter(x => x.group === g).map(x => `<button class="opt" role="radio" data-metric="${x.key}" style="--mcol:${mcol(x.key)}" aria-checked="${x.key === state.metric}"><span class="od"></span>${x.label}<small>${x.unit}</small></button>`).join('')}</div></div>`;
      return { title: SHEET_TITLE.metric, body: `${grp('MIND')}${grp('BODY')}
        <div class="row"><div class="tx"><b>10초마다 지표 순환</b><small>${state.rotate ? '순환 중 · 지금 ' + m.label : '꺼짐 · 선택한 지표를 고정해요'}</small></div><button class="sw" role="switch" data-act="rotate" aria-checked="${state.rotate}" aria-label="10초 순환"><span class="trk"></span></button></div>` };
    }
    if (s === 'chat') {
      const msgs = state.messages.map(x => `<div class="msg ${x.me ? 'me' : ''}"><span class="meta">${x.me ? '나' : x.who} · ${x.t}</span><span class="bub">${x.x}</span></div>`).join('');
      return { title: SHEET_TITLE.chat, tall: true, body: `<div class="chat-list" id="chat-list">${msgs}</div>
        <form class="composer" id="composer"><input id="chat-in" type="text" placeholder="참가자에게 메시지 보내기" aria-label="메시지 입력" autocomplete="off"><button class="ib send" type="submit" aria-label="보내기">${icon('send')}</button></form>`, flush: true };
    }
    if (s === 'media') {
      const bars = [6, 10, 14, 9, 16, 12, 8, 5, 3, 3, 3, 3].map((h, i) => `<i class="${i > 7 ? 'q' : ''}" style="height:${h}px"></i>`).join('');
      const sw = (act, on, label) => `<button class="sw" role="switch" data-act="${act}" aria-checked="${on}" aria-label="${label}"><span class="trk"></span></button>`;
      const bgmBlock = `<div class="sec"><div class="row"><div class="l"><span class="lead">${icon('music')}</span><div class="tx"><b>배경 음악(BGM)</b><small>${state.bgm || '꺼짐'}</small></div></div></div>
        <div class="chips" role="radiogroup" aria-label="BGM 선택">${['숲속 새벽', '계곡 물소리', '고요한 종소리'].map(t => `<button class="pill" role="radio" data-bgm="${t}" aria-checked="${state.bgm === t}">${t}</button>`).join('')}</div>
        <div class="vol"><input type="range" min="0" max="100" value="${state.vol}" id="vol" aria-label="BGM 음량"><span id="vol-v">${state.vol}%</span></div></div>`;
      const paused = state.rec === 'paused';
      const recBtn = `<button class="btn ghost" data-act="recpause" style="padding:0 12px">${icon(paused ? 'play' : 'pause')}${paused ? '재개' : '일시정지'}</button>`;
      if (loc === 'offline') {
        return { title: '녹음', body: `
          <div class="row"><div class="l"><span class="lead">${icon('mic')}</span><div class="tx"><b>녹음 마이크</b><small>${paused ? '기록 일시정지' : '녹음 중 · ' + REC_T}</small></div></div>${recBtn}</div>
          <p class="sh-note">멈춘 구간은 AI 기록에서 빠져요. 뇌파는 계속 기록돼요.</p>${bgmBlock}` };
      }
      const camRow = scn.camDenied
        ? `<div class="row"><div class="l"><span class="thumb">${icon('videooff')}</span><div class="tx"><b>내 카메라</b><small class="coral" style="color:var(--mb-coral)">권한이 필요해요</small></div></div><button class="btn ghost" data-sheet="permcam" style="padding:0 12px">설정 안내</button></div>`
        : `<div class="row"><div class="l"><span class="thumb">${icon('person')}</span><div class="tx"><b>내 카메라</b><small>${state.cam ? '참가자에게 보이는 중' : '꺼짐'}</small></div></div>${sw('cam', state.cam, '카메라')}</div>`;
      const micRow = scn.micDenied
        ? `<div class="row"><div class="l"><span class="lead">${icon('micoff')}</span><div class="tx"><b>마이크</b><small style="color:var(--mb-coral)">권한이 필요해요</small></div></div><button class="btn ghost" data-sheet="permmic" style="padding:0 12px">허용 방법</button></div>`
        : `<div class="row"><div class="l"><span class="lead">${icon(state.mic ? 'mic' : 'micoff')}</span><div class="tx"><b>마이크</b><small>${state.mic ? '켜짐' : '꺼짐 · AI 기록 제외'}</small></div></div>${state.mic ? `<div class="meter" aria-hidden="true">${bars}</div>` : ''}${sw('mic', state.mic, '마이크')}</div>`;
      const recRow = state.rec ? `<div class="row"><div class="l"><span class="lead">${icon('pause')}</span><div class="tx"><b>AI 기록</b><small>${paused ? '일시정지' : '녹음 중 · ' + REC_T}</small></div></div>${recBtn}</div>` : '';
      return { title: SHEET_TITLE.media, body: `${camRow}${micRow}${recRow}${bgmBlock}` };
    }
    if (s === 'checkin') {
      return { title: SHEET_TITLE.checkin, body: `
        <div class="sec"><div class="q" style="display:flex;justify-content:space-between;font-size:var(--fs-13);color:var(--tx-mid)"><span>자가 체크인 응답</span><span><b style="color:var(--tx-hi);font-size:var(--fs-15)">6</b> / 7명</span></div><div class="prog" role="progressbar" aria-valuenow="86" aria-valuemin="0" aria-valuemax="100"><i style="width:86%"></i></div></div>
        <div class="dist"><div class="q"><span>오늘 마음의 날씨</span></div><div class="stack"><i class="c1" style="flex:3"></i><i class="c2" style="flex:1"></i><i class="c3" style="flex:2"></i></div><div class="leg"><span><em class="c1"></em>잔잔 3</span><span><em class="c2"></em>들뜸 1</span><span><em class="c3"></em>무거움 2</span></div></div>
        <div class="dist"><div class="q"><span>몸 상태</span></div><div class="stack"><i class="c1" style="flex:3"></i><i class="c2" style="flex:2"></i><i class="c3" style="flex:1"></i></div><div class="leg"><span><em class="c1"></em>편안 3</span><span><em class="c2"></em>뻐근 2</span><span><em class="c3"></em>피곤 1</span></div></div>
        <div class="sec"><p class="lbl">살펴볼 응답</p>
          <button class="note" data-detail="5"><span><b>서아</b><span>어깨가 많이 뻐근해요</span></span>${icon('chev')}</button>
          <button class="note" data-detail="6"><span><b>도윤</b><span>거의 못 잤어요</span></span>${icon('chev')}</button></div>` };
    }
    if (s === 'tools') {
      const seg = (k, t) => `<button class="seg" role="radio" data-sort="${k}" aria-checked="${state.sort === k}">${t}</button>`;
      return { title: SHEET_TITLE.tools, body: `
        <div class="sec"><p class="lbl">정렬</p><div class="segs" role="radiogroup" aria-label="정렬">${seg('join', '입장순')}${seg('low', '낮은 순')}${seg('high', '높은 순')}</div></div>
        ${loc === 'online' && !scn.solo ? `<div class="row"><div class="l"><span class="lead">${icon('hand')}</span><div class="tx"><b>손든 회원 우선</b><small>손든·말하는 회원을 맨 위에</small></div></div><button class="sw" role="switch" data-act="handsfirst" aria-checked="${state.handsFirst}" aria-label="손든 회원 우선"><span class="trk"></span></button></div>` : ''}
        <div class="row"><div class="l"><span class="lead">${icon('table')}</span><div class="tx"><b>표로 보기</b><small>6개 지표를 한눈에 비교</small></div></div><button class="sw" role="switch" data-act="table" aria-checked="${state.table}" aria-label="표로 보기"><span class="trk"></span></button></div>
        <div class="sec"><p class="lbl">참여 코드</p><div class="code"><b>MIND24</b><button class="btn" data-act="copy">${icon('copy')}코드 복사</button></div></div>` };
    }
    if (s === 'detail') {
      const p = people().find(x => x.id === state.detail) || people()[0];
      const m = MKEY[state.metric];
      const chipTxt = BAND_TXT[p.band];
      return { title: `<span class="who"><span class="av">${p.name[0]}</span>${p.name}<span class="chip"><i class="dot ${bandDot(p.band)}"></i>${chipTxt}</span></span>`, body: `<div class="minis">${METRICS.map(x => miniHTML(p, x)).join('')}</div>${trendHTML(p, m)}<div class="qas"><p class="lbl">체크인 응답</p>${qaHTML(p)}</div>` };
    }
    if (s === 'hands') {
      const L = people();
      const hs = L.filter(p => p.hand), sp = L.find(p => p.speaking);
      const cur = sp ? personRow(sp, '<small>말하는 중</small>', '<button class="btn coral" data-act="revoke">회수</button>') : '';
      const rows = hs.map(p => personRow(p, '<small>손들었어요 · 방금</small>', `<button class="btn" data-grant="${p.id}">발언권 부여</button>`)).join('');
      return { title: `손든 회원 ${hs.length}`, body: `${cur}${rows}${!cur && !rows ? '<p class="sh-note">지금 손든 회원이 없어요.</p>' : ''}<p class="sh-note">발언권을 주면 회원 마이크가 켜져요. 켜진 구간은 AI 기록에 포함돼요.</p>` };
    }
    if (s === 'actions') {
      const L = people();
      const lead = L.filter(p => p.band === 'leadoff'), bat = L.filter(p => p.lowbat);
      return { title: '필요 조치', body: `
        ${lead.length ? `<div class="sec"><p class="lbl">접촉 확인 ${lead.length}</p>${lead.map(p => personRow(p, '<small class="coral">접촉 불량 · 이마에 밀착</small>')).join('')}</div>` : ''}
        ${bat.length ? `<div class="sec"><p class="lbl">배터리 낮음 ${bat.length}</p>${bat.map(p => personRow(p, '<small class="cau">배터리 낮음 · 충전 안내</small>')).join('')}</div>` : ''}
        <button class="btn" data-act="notify" style="justify-content:center">${icon('send')}모두에게 안내 보내기</button>` };
    }
    if (s === 'queue') {
      const names = WAIT_NAMES.slice(WAIT_NAMES.length - state.queue);
      return { title: `입장 대기 ${state.queue}`, body: `${names.map((n, i) => `<div class="lrow"><div class="l"><span class="av">${n[0]}</span><div class="tx"><b>${n}</b><small>자리 대기 중</small></div></div><button class="btn" data-approve="1">입장 승인</button></div>`).join('') || '<p class="sh-note">대기 중인 회원이 없어요.</p>'}${state.queue ? '<button class="btn ghost" data-act="approveall" style="justify-content:center">모두 승인</button>' : ''}` };
    }
    if (s === 'alerts') {
      const rows = chipCache.filter(i => !i.opt && (i.sheet || i.act)).map(i => `<div class="lrow"><div class="l"><div class="tx"><b>${i.label}</b></div></div>${i.sheet ? `<button class="btn ghost" data-sheet="${i.sheet}">열기</button>` : `<button class="btn ghost" data-act="${i.act}">바꾸기</button>`}</div>`).join('');
      return { title: '알림 전체', body: rows || '<p class="sh-note">확인할 알림이 없어요.</p>' };
    }
    if (s === 'myband') {
      const on = scn.selfBand === 'on';
      return { title: '내 밴드', body: on
        ? `<div class="row"><div class="l"><span class="lead"><i class="dot on"></i></span><div class="tx"><b>연결됨</b><small>신호 좋음 · 내 이완도 72</small></div></div></div><div class="row"><div class="l"><span class="lead">${icon('battery')}</span><div class="tx"><b>배터리 78%</b><small>충분해요</small></div></div></div><p class="sh-note">내 지표는 나에게만 보여요. 참가자에게는 공유되지 않아요.</p>`
        : `<div class="row"><div class="l"><span class="lead"><i class="dot off"></i></span><div class="tx"><b>미착용</b><small>선택 사항이에요</small></div></div><button class="btn" data-act="notify">밴드 연결</button></div><p class="sh-note">밴드 없이도 수업은 그대로 진행돼요. 착용하면 내 지표도 볼 수 있어요.</p>` };
    }
    if (s === 'permcam' || s === 'permmic') {
      const cam = s === 'permcam';
      return { title: cam ? '카메라 허용 방법' : '마이크 허용 방법', body: `${stepsHTML(cam ? '카메라' : '마이크')}<p class="sh-note coral">${cam ? '허용하지 않아도 수업은 계속 진행할 수 있어요.' : '허용하지 않으면 이 수업은 AI 기록에서 빠져요. 뇌파는 계속 기록돼요.'}</p><button class="btn" data-act="notify" style="justify-content:center">허용했어요 · 다시 확인</button>` };
    }
    return null;
  }

  let lastSheetKey = '';
  function renderSheet() {
    const sheet = $('#sheet'), hit = $('#hit');
    const c = state.sheet ? sheetContent() : null;
    $$('.dk').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sheet === state.sheet)));
    if (!c) { document.body.classList.remove('sheet-open', 'sheet-tall'); sheet.hidden = true; hit.hidden = true; sheet.innerHTML = ''; lastSheetKey = ''; return; }
    const key = state.sheet + ':' + state.detail;
    sheet.hidden = false;
    hit.hidden = false;
    document.body.classList.add('sheet-open');
    sheet.classList.toggle('tall', !!c.tall);
    document.body.classList.toggle('sheet-tall', !!c.tall);
    sheet.setAttribute('aria-label', typeof c.title === 'string' ? c.title : '참가자 상세');
    sheet.innerHTML = `<div class="grab" aria-hidden="true"></div><div class="sh-head"><h2>${c.title}</h2><button class="ib" data-act="close" aria-label="시트 닫기">${icon('x')}</button></div><div class="sh-body" style="${c.flush ? 'gap:0' : ''}">${c.body}</div>`;
    if (key !== lastSheetKey) { sheet.style.animation = 'none'; void sheet.offsetWidth; sheet.style.animation = ''; }
    lastSheetKey = key;
    const list = $('#chat-list');
    if (list) list.scrollTop = list.scrollHeight;
    const unread = $('#bd-chat'); unread.hidden = state.sheet === 'chat';
  }

  function render() {
    document.body.classList.toggle('net-bad', !!scn.net);
    renderTitle(); renderDock(); renderTop(); renderBanner(); renderSheet(); layout(); fitChips();
  }

  // ── 이벤트 ──
  let rotateTimer = null;
  function syncRotate() {
    clearInterval(rotateTimer); rotateTimer = null;
    if (state.rotate) rotateTimer = setInterval(() => {
      const i = METRICS.findIndex(m => m.key === state.metric);
      setState({ metric: METRICS[(i + 1) % METRICS.length].key });
    }, 10000);
  }
  let toastTimer = null;
  function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 1800); }

  document.addEventListener('click', e => {
    const t = e.target.closest('button, tr[data-id]');
    if (!t) {
      if (state.sheet && isBottomSheet() && !e.target.closest('#sheet, .top, .mstrip, .dock, .modal, .toast, .head, .banner, .chipline')) setState({ sheet: null, detail: null });
      return;
    }
    if (t.id === 'btn-end') { $('#modal').hidden = false; return; }
    if (t.id === 'm-cancel') { $('#modal').hidden = true; return; }
    if (t.id === 'm-ok') { $('#modal').hidden = true; document.body.classList.add('ending'); $('#ending').hidden = false; return; }
    if (t.id === 'selfview') return scn.camDenied ? setState({ sheet: 'permcam', detail: null }) : setState({ camBig: !state.camBig });
    if (t.dataset.grant) { const id = Number(t.dataset.grant); return setState({ hands: state.hands.filter(h => h !== id), speaking: id }); }
    if (t.dataset.approve) return setState({ queue: Math.max(0, state.queue - 1) });
    if (t.id === 'btn-close') { toast('클래스 화면을 닫으면 대시보드로 돌아가요'); return; }
    if (t.dataset.sheet) { const same = state.sheet === t.dataset.sheet; return setState({ sheet: same ? null : t.dataset.sheet, detail: null }); }
    if (t.dataset.id) return setState({ sheet: 'detail', detail: Number(t.dataset.id) });
    if (t.dataset.detail) return setState({ sheet: 'detail', detail: Number(t.dataset.detail) });
    if (t.dataset.metric) return setState({ metric: t.dataset.metric });
    if (t.dataset.sort) return setState({ sort: t.dataset.sort });
    if (t.dataset.bgm) return setState({ bgm: state.bgm === t.dataset.bgm ? null : t.dataset.bgm });
    const act = t.dataset.act;
    if (act === 'close') return setState({ sheet: null, detail: null });
    if (act === 'rotate') { state = { ...state, rotate: !state.rotate }; syncRotate(); return render(); }
    if (act === 'table') return setState({ table: !state.table });
    if (act === 'revoke') return setState({ speaking: null });
    if (act === 'handsfirst') return setState({ handsFirst: !state.handsFirst });
    if (act === 'recpause') return setState({ rec: state.rec === 'paused' ? 'rec' : 'paused' });
    if (act === 'approveall') return setState({ queue: 0 });
    if (act === 'notify') { toast('안내를 보냈어요'); return; }
    if (act === 'retry') { toast('다시 연결하는 중이에요'); return; }
    if (act === 'dash') { toast('대시보드로 이동해요'); return; }
    if (act === 'cam') return setState({ cam: !state.cam });
    if (act === 'mic') return setState({ mic: !state.mic });
    if (act === 'copy') {
      try { navigator.clipboard && navigator.clipboard.writeText('MIND24'); } catch (_) { /* 시안: 복사 실패 무시 */ }
      toast('참여 코드 MIND24를 복사했어요');
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#modal').hidden) $('#modal').hidden = true; else if (state.sheet) setState({ sheet: null, detail: null }); }
    if (e.key === 'Enter' && e.target.matches('tr[data-id]')) setState({ sheet: 'detail', detail: Number(e.target.dataset.id) });
  });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'composer') return;
    e.preventDefault();
    const input = $('#chat-in'); const x = input.value.trim();
    if (!x) return;
    setState({ messages: [...state.messages, { who: '나', me: true, t: '12:34', x }] });
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'vol') { state = { ...state, vol: Number(e.target.value) }; $('#vol-v').textContent = state.vol + '%'; }
  });

  $('#gridscroll').addEventListener('scroll', updateScrollHints, { passive: true });
  new ResizeObserver(() => layout()).observe($('#gridscroll'));
  window.addEventListener('resize', () => { render(); });
  new ResizeObserver(() => fitChips()).observe($('#chipline'));
  syncRotate();
  if (params.get('modal') === 'end' || scn.phase === 'confirm') $('#modal').hidden = false;
  if (scn.phase === 'ending') { document.body.classList.add('ending'); $('#ending').hidden = false; }
  render();
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('no-anim')));
})();
</script>
</body>
</html>
