<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIND BREEZE · 상담사 클래스 진행 화면 시안</title>
<link rel="stylesheet" href="tokens.css">
<style>
:root { --sheet-w: 380px; --line: rgba(255,255,255,.12); --fill: rgba(255,255,255,.07);
  --mc-focus: var(--m-focus, #B373EF); --mc-relax: var(--m-relax, #01F0C8); --mc-balance: var(--m-emotion, #FF9ECB);
  --mc-bpm: var(--m-bpm, #FFC857); --mc-resp: var(--m-resp, #5BC8FF); --mc-hrv: var(--m-hrv, #A8E86B); }
@media (min-width: 1000px) { :root { --sheet-w: 400px; } }
@media (min-width: 1280px) { :root { --sheet-w: 420px; } }

html, body { height: 100dvh; overflow: hidden; margin: 0; }
body { background: #1b0f26; font-size: var(--fs-15); line-height: 1.35; }
.no-anim *, .no-anim *::before, .no-anim *::after { animation: none !important; transition: none !important; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mb-lavender); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* 배경 — 자연 창 */
.bg { position: fixed; inset: 0; background: #1b0f26 center / cover no-repeat; }
.bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, var(--scrim-top), var(--scrim-bottom)); }

.app { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }

/* ── 상단 바 ───────────────── */
.top { flex: none; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "x t e"; gap: 8px 10px; align-items: center; padding: 8px 10px; border-radius: 20px; background: var(--sheet-bg-strong); border: 1px solid var(--sheet-border); }
.top .x { grid-area: x; } .top .ttl { grid-area: t; } .top .end { grid-area: e; } .top .stats { grid-area: s; }
.ib { width: var(--tap); height: var(--tap); border-radius: 50%; display: grid; place-items: center; background: var(--fill); border: 1px solid var(--line); flex: none; }
.ib:hover { background: rgba(255,255,255,.14); }
.ttl { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.ttl h1 { margin: 0; font-size: var(--fs-15); font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.ttl h1 span { overflow: hidden; text-overflow: ellipsis; }
.ttl .logo { width: 24px; height: 11px; flex: none; color: var(--mb-lavender); }
.ttl p { display: none; margin: 2px 0 0; font-size: var(--fs-13); color: var(--tx-mid); white-space: nowrap; }
.stats { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-pill); background: var(--fill); border: 1px solid var(--line); font-size: var(--fs-13); white-space: nowrap; color: var(--tx-hi); }
.chip b { font-weight: 700; font-size: var(--fs-15); }
.chip .ic { width: 16px; height: 16px; }
.chip .lg { display: none; }
.timeblk b { font-size: var(--fs-15); }
.timeblk .tot { color: var(--tx-mid); }
.timeblk .ic { display: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.on { background: var(--mb-mint); box-shadow: 0 0 0 3px rgba(1,240,200,.2); }
.dot.off { border: 2px solid var(--tx-lo); }
.dot.lost { background: var(--mb-coral); box-shadow: 0 0 0 3px rgba(232,180,160,.22); }
.end { display: inline-flex; align-items: center; gap: 6px; height: var(--tap); padding: 0 16px 0 12px; border-radius: var(--r-pill); color: var(--mb-coral); border: 2px solid rgba(232,180,160,.6); background: rgba(232,180,160,.12); font-weight: 600; white-space: nowrap; }
.end:hover { background: rgba(232,180,160,.22); }
.end .ic { width: 20px; height: 20px; }
@media (min-width: 600px) {
  .top { grid-template-areas: "x t e" "s s s"; }
  .ttl h1 { font-size: var(--fs-18); }
  .stats { justify-content: flex-start; gap: 10px; }
  .chip .lg { display: inline; } .chip .sm { display: none; }
  .timeblk .ic { display: block; }
}
@media (min-width: 1000px) {
  .top { grid-template-columns: 44px minmax(0, 1fr) auto auto; grid-template-areas: "x t s e"; gap: 14px; padding: 10px 14px; }
  .ttl p { display: block; }
  .stats { gap: 12px; }
  .timeblk { background: none; border: 0; padding: 0; height: auto; gap: 8px; }
  .timeblk b { font-size: var(--fs-24); line-height: 1; }
  .timeblk .tot { font-size: var(--fs-15); }
}

/* ── 본문 ───────────────── */
.body { flex: 1; min-height: 0; display: flex; gap: 12px; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.mstrip { flex: none; display: flex; align-items: center; gap: 12px; min-height: 52px; width: 100%; padding: 6px 12px 6px 10px; border-radius: var(--r-card); background: var(--sheet-bg-strong); border: 1px solid var(--sheet-border); text-align: left; }
.mstrip:hover { background: rgba(24,12,36,.88); }
.mstrip .mg { width: 36px; height: 36px; flex: none; color: var(--mcol); }
.mstrip .mg svg { width: 100%; height: 100%; display: block; }
.mstrip .mtx { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.mstrip .mlb { font-size: var(--fs-12); color: var(--tx-mid); line-height: 1.2; }
.mstrip .mnm { font-size: var(--fs-18); font-weight: 700; line-height: 1.25; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.mstrip .mnm i { width: 10px; height: 10px; border-radius: 50%; background: var(--mcol); align-self: center; flex: none; }
.mstrip .mnm small { font-size: var(--fs-13); color: var(--tx-mid); font-weight: 500; }
.mstrip { container-type: inline-size; }
.mstrip .mtop { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; min-height: 20px; }
.mstrip .mrot { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px 0 6px; border-radius: var(--r-pill); background: rgba(179,115,239,.2); border: 1px solid rgba(179,115,239,.55); font-size: var(--fs-12); line-height: 1; white-space: nowrap; flex: none; }
.mstrip .mrot .ic { width: 14px; height: 14px; }
@container (max-width: 330px) { .mstrip .lgx, .mstrip .chev, .mstrip .mnm i { display: none; } }
@container (max-width: 200px) { .mstrip .mg { display: none; } }
.mstrip .mrot[hidden] { display: none; }
.mstrip .chev { width: 20px; height: 20px; color: var(--tx-mid); flex: none; }
/* 헤드 행: 지표 띠 + 보조 정보(좌) / 셀프뷰 자리(우) — 그리드와 절대 겹치지 않도록 레이아웃에서 자리를 확보 */
.head { flex: none; display: flex; gap: 10px; align-items: stretch; }
.hl { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 6px; }
.meta { display: flex; flex-direction: column; gap: 6px; }
.meta .stats { flex-wrap: wrap; justify-content: flex-start; gap: 6px; }
.bandsum { display: none; flex-wrap: wrap; gap: 6px 8px; }
.bandsum .chip { height: 32px; padding: 0 12px; gap: 8px; }
.bandsum .chip .dot { width: 8px; height: 8px; }
.selfview, .sumpanel { --svw: 96px; --svr: 3 / 4; position: relative; flex: none; width: var(--svw); aspect-ratio: var(--svr); align-self: flex-start; border-radius: var(--r-card); overflow: hidden; background: #241636; border: 1px solid var(--sheet-border); padding: 0; display: block; }
.selfview.big { --svw: 144px; }
.selfview .sv-vid { position: absolute; inset: 0; transform: scaleX(-1); }
.selfview .sv-vid svg { width: 100%; height: 100%; display: block; }
.selfview .sv-l { display: none; }
.selfview .sv-lb { position: absolute; left: 6px; bottom: 6px; max-width: calc(100% - 12px); height: 24px; padding: 0 8px; border-radius: var(--r-pill); background: rgba(18,8,28,.62); display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-12); font-weight: 600; white-space: nowrap; }
.selfview .sv-ic { position: absolute; top: 6px; width: 28px; height: 28px; border-radius: 50%; background: rgba(18,8,28,.62); display: grid; place-items: center; }
.selfview .sv-ic .ic { width: 16px; height: 16px; }
.selfview .sv-mic { right: 6px; }
.selfview .sv-mic.off { color: var(--mb-coral); }
.selfview .sv-sz { left: 6px; }
.selfview .sv-off { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: var(--sheet-bg-strong); color: var(--tx-mid); font-size: var(--fs-13); font-weight: 600; text-align: center; padding: 0 6px; }
.selfview .sv-off .ic { width: 28px; height: 28px; }
@media (min-width: 600px) {
  .selfview, .sumpanel { --svw: min(200px, 42%); --svr: 5 / 3; }
  .selfview.big { --svw: min(288px, 50%); --svr: 16 / 9; }
  .selfview .sv-p { display: none; } .selfview .sv-l { display: block; }
  .bandsum { display: flex; }
}
.gridwrap { position: relative; flex: 1; min-height: 0; }
.gridscroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; padding: 4px 3px; display: flex; flex-direction: column; }
.gridscroll::-webkit-scrollbar { display: none; }
.gridscroll.fade-b { -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 36px), transparent 100%); mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 36px), transparent 100%); }
.gridscroll.fade-t { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 36px, #000 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 36px, #000 100%); }
.gridscroll.fade-t.fade-b { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 36px, #000 calc(100% - 36px), transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 36px, #000 calc(100% - 36px), transparent 100%); }
.range { position: absolute; right: 8px; bottom: 8px; z-index: 2; height: 28px; padding: 0 12px; border-radius: var(--r-pill); background: var(--sheet-bg-strong); border: 1px solid var(--sheet-border); font-size: var(--fs-13); display: inline-flex; align-items: center; white-space: nowrap; pointer-events: none; }
.range[hidden] { display: none; }
.grid { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; width: 100%; margin: 0 auto; flex: none; }
.tile { width: var(--tw); height: var(--th); flex: none; border-radius: var(--r-card); background: var(--sheet-bg); border: 1px solid var(--sheet-border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; text-align: center; position: relative; transition: background .2s; }
.tile:hover { background: rgba(24,12,36,.7); }
.tile[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--mb-lavender); }
.tile.warn { border-color: rgba(232,180,160,.7); }
.tile.away .nm { color: var(--tx-mid); }
.ring { width: var(--rs); height: var(--rs); position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; overflow: visible; }
.ring .val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.ring .num { font-size: var(--rf); font-weight: 700; }
.ring small { font-size: var(--fs-12); color: var(--tx-hi); margin-top: 3px; font-weight: 600; }
.ring .nb { font-size: var(--fs-13); color: var(--tx-mid); font-weight: 600; }
.ring .nb.warn { color: var(--mb-coral); }
.rc-t { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 8; }
.rc-t.off { stroke: rgba(255,255,255,.3); stroke-width: 5; stroke-dasharray: 2 9; stroke-linecap: round; }
.rc-t.lost { stroke: rgba(232,180,160,.7); stroke-width: 5; stroke-dasharray: 2 9; stroke-linecap: round; }
.rc-a { fill: none; stroke: var(--mcol, var(--mb-mint)); stroke-width: 8; stroke-linecap: round; }
.nm { font-size: var(--fs-15); font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--fs-13); color: var(--tx-mid); max-width: 100%; white-space: nowrap; }
.st.warn { color: var(--mb-coral); }


.tbl-wrap { width: min(100%, 760px); border-radius: var(--r-card); background: var(--sheet-bg-strong); border: 1px solid var(--sheet-border); overflow: clip; }
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: var(--fs-13); }
.tbl th { position: sticky; top: 0; z-index: 1; background: rgb(30,17,44); height: 40px; text-align: center; font-weight: 600; color: var(--tx-mid); border-bottom: 1px solid var(--line); }
.tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 12px; width: 25%; }
.tbl th.sel { color: var(--mcol); }
.tbl td { height: 46px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.07); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child { font-size: var(--fs-15); font-weight: 600; }
.tbl td.sel { background: rgba(255,255,255,.08); font-weight: 700; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover { background: rgba(255,255,255,.05); }
.tbl .nd { display: inline-flex; align-items: center; gap: 8px; }
.tbl .mu { color: var(--tx-lo); }

/* ── 하단 도크 ───────────────── */
.dockwrap { flex: none; display: flex; justify-content: center; }
.dock { display: flex; justify-content: space-between; gap: 2px; width: 100%; max-width: 560px; padding: 6px 10px; border-radius: 28px; background: var(--sheet-bg-strong); border: 1px solid var(--sheet-border); }
.dk { position: relative; flex: 1; min-width: 60px; min-height: 60px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0; font-size: var(--fs-12); color: var(--tx-mid); border-radius: 18px; }
.dk .ico { width: var(--tap); height: var(--tap); border-radius: 50%; display: grid; place-items: center; background: var(--fill); border: 1px solid var(--line); color: var(--tx-hi); transition: background .2s; }
.dk:hover .ico { background: rgba(255,255,255,.14); }
.dk[aria-pressed="true"] { color: var(--tx-hi); }
.dk[aria-pressed="true"] .ico { background: var(--mb-purple); border-color: var(--mb-lavender); }
.dk .bd { position: absolute; top: 0; left: calc(50% + 8px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--mb-lavender); color: #24103a; font-size: var(--fs-12); font-weight: 700; display: grid; place-items: center; }

/* ── 시트 ───────────────── */
.hit { display: none !important; }
.hit[hidden], .sheet[hidden] { display: none; }
@media not all and (min-width: 1000px) and (orientation: landscape) { body.sheet-open .grid { opacity: .4; transition: opacity .2s; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; max-width: 640px; margin-inline: auto; z-index: 20; max-height: 58dvh; display: flex; flex-direction: column; background: rgba(22,11,34,.94); border: 1px solid var(--sheet-border); border-bottom: 0; border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 8px 16px calc(14px + env(safe-area-inset-bottom)); animation: up .28s ease-out; }
.sheet.tall { height: 58dvh; }
@keyframes up { from { transform: translateY(18px); opacity: 0; } }
@keyframes in-right { from { transform: translateX(18px); opacity: 0; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); margin: 0 auto 4px; flex: none; }
.sh-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 48px; }
.sh-head h2 { margin: 0; font-size: var(--fs-18); font-weight: 700; display: flex; align-items: center; gap: 10px; min-width: 0; }
.sh-body > * { flex-shrink: 0; }
.sh-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
.sh-body::-webkit-scrollbar { display: none; }
@media (min-width: 1000px) and (orientation: landscape) {
  .sheet { margin: 0; max-width: none; background: var(--sheet-bg-strong); position: static; flex: none; width: var(--sheet-w); max-height: none; height: auto; border-radius: var(--r-sheet); border: 1px solid var(--sheet-border); padding: 12px 18px 18px; animation: in-right .28s ease-out; }
  .sheet.tall { height: auto; }
  .grab { display: none; }
  .hit { display: none; }
}
.lbl { margin: 0; font-size: var(--fs-12); font-weight: 700; letter-spacing: .08em; color: var(--tx-mid); }
.sec { display: flex; flex-direction: column; gap: 8px; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.opt { min-height: 56px; padding: 6px 4px; border-radius: 14px; background: var(--fill); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: var(--fs-15); font-weight: 600; }
.opt .od { width: 10px; height: 10px; border-radius: 50%; background: var(--mcol); margin-bottom: 2px; }
.opt small { font-size: var(--fs-12); font-weight: 500; color: var(--tx-mid); }
.opt[aria-checked="true"], .seg[aria-checked="true"] { background: rgba(179,115,239,.22); border-color: var(--mb-lavender); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 4px 12px; border-radius: 14px; background: var(--fill); }
.row .tx { display: flex; flex-direction: column; min-width: 0; }
.row .tx b { font-size: var(--fs-15); font-weight: 600; }
.row .tx small { font-size: var(--fs-12); color: var(--tx-mid); }
.row .lead { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; flex: none; }
.row .lead .ic { width: 20px; height: 20px; }
.row .l { display: flex; align-items: center; gap: 12px; min-width: 0; }
.sw { width: 56px; height: var(--tap); display: grid; place-items: center; flex: none; }
.sw .trk { width: 48px; height: 28px; border-radius: 14px; background: rgba(255,255,255,.2); position: relative; transition: background .2s; }
.sw .trk::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
.sw[aria-checked="true"] .trk { background: var(--mb-purple-90); box-shadow: inset 0 0 0 2px var(--mb-lavender); }
.sw[aria-checked="true"] .trk::after { transform: translateX(20px); }
.segs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg { min-height: var(--tap); padding: 0 6px; border-radius: 14px; background: var(--fill); border: 2px solid transparent; font-size: var(--fs-13); font-weight: 600; }
.thumb { width: 56px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #3b2a55, #1f5a56); display: grid; place-items: center; color: var(--tx-mid); flex: none; }
.meter { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
.meter i { width: 4px; border-radius: 2px; background: var(--mb-mint); opacity: .85; }
.meter i.q { background: rgba(255,255,255,.25); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { min-height: var(--tap); padding: 0 14px; border-radius: var(--r-pill); background: var(--fill); border: 2px solid transparent; font-size: var(--fs-13); font-weight: 600; }
.pill[aria-checked="true"] { background: rgba(179,115,239,.22); border-color: var(--mb-lavender); }
.vol { display: flex; align-items: center; gap: 10px; min-height: var(--tap); }
.vol input { flex: 1; accent-color: var(--mb-lavender); height: 28px; }
.vol span { min-width: 40px; text-align: right; font-size: var(--fs-13); color: var(--tx-mid); }

/* 채팅 */
.chat-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
.msg { max-width: 82%; display: flex; flex-direction: column; gap: 3px; align-self: flex-start; }
.msg .meta { font-size: var(--fs-12); color: var(--tx-mid); }
.msg .bub { padding: 8px 12px; border-radius: 16px 16px 16px 6px; background: rgba(255,255,255,.12); font-size: var(--fs-15); }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.me .bub { background: var(--mb-purple); border-radius: 16px 16px 6px 16px; border: 1px solid rgba(179,115,239,.5); }
.composer { flex: none; display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.composer input { flex: 1; min-width: 0; height: var(--tap); padding: 0 16px; border-radius: var(--r-pill); background: rgba(255,255,255,.1); border: 1px solid var(--line); outline-offset: 0; }
.composer input::placeholder { color: var(--tx-mid); }
.composer .send { background: var(--mb-purple); border-color: var(--mb-lavender); }

/* 체크인 */
.prog { height: 8px; border-radius: 4px; background: rgba(255,255,255,.14); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--mb-lavender), var(--mb-mint)); }
.dist { display: flex; flex-direction: column; gap: 6px; }
.dist .q { display: flex; justify-content: space-between; font-size: var(--fs-13); color: var(--tx-mid); }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; }
.stack i { display: block; }
.leg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-13); }
.leg span { display: inline-flex; align-items: center; gap: 6px; }
.leg em { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.c1 { background: var(--mb-lavender); } .c2 { background: var(--mb-pale); } .c3 { background: var(--mb-coral); }
.note { width: 100%; min-height: var(--tap); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 12px; border-radius: 14px; background: var(--fill); text-align: left; }
.note b { font-size: var(--fs-15); }
.note span { font-size: var(--fs-13); color: var(--tx-mid); margin-left: 8px; }
.note .ic { width: 20px; height: 20px; flex: none; color: var(--tx-mid); }

/* 참가자 상세 */
.who { display: flex; align-items: center; gap: 10px; }
.av { width: 36px; height: 36px; border-radius: 50%; background: var(--mb-purple); border: 1px solid var(--mb-lavender); display: grid; place-items: center; font-size: var(--fs-15); font-weight: 700; flex: none; }
.who .chip { height: 28px; }
.minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mini { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px 6px; border-radius: 14px; background: var(--fill); border: 2px solid transparent; }
.mini.sel { border-color: var(--mcol); background: rgba(255,255,255,.1); }
.mini .ring { width: 48px; height: 48px; }
.mini .ring .num { font-size: var(--fs-15); }
.mini .ml { font-size: var(--fs-12); color: var(--tx-mid); line-height: 1.1; }
.trend { padding: 8px 12px 8px; border-radius: 14px; background: var(--fill); }
.trend .th { display: flex; align-items: center; justify-content: space-between; font-size: var(--fs-13); color: var(--tx-mid); }
.trend .th b { color: var(--mb-mint); font-size: var(--fs-13); }
.trend svg { display: block; width: 100%; height: 44px; margin-top: 4px; }
.trend .axis { display: flex; justify-content: space-between; font-size: var(--fs-12); color: var(--tx-lo); }
.noband { padding: 12px; border-radius: 14px; background: var(--fill); font-size: var(--fs-13); color: var(--tx-mid); text-align: center; border: 1px dashed rgba(255,255,255,.25); }
.qa { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
.qa .q { font-size: var(--fs-13); color: var(--tx-mid); white-space: nowrap; }
.qa .a { font-size: var(--fs-15); text-align: right; }
.qas .lbl { margin-bottom: 2px; }
@media (max-width: 599px) { .qa:nth-of-type(3) { display: none; } }

/* 코드 */
.code { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 8px 8px 8px 16px; border-radius: 14px; background: var(--fill); }
.code b { font-size: var(--fs-24); letter-spacing: .14em; font-weight: 700; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: var(--tap); padding: 0 16px; border-radius: var(--r-pill); background: var(--mb-purple); border: 1px solid var(--mb-lavender); font-weight: 600; font-size: var(--fs-15); }
.btn .ic { width: 20px; height: 20px; }
.btn.ghost { background: var(--fill); border-color: var(--line); }
.btn.coral { background: rgba(232,180,160,.18); border: 2px solid rgba(232,180,160,.7); color: var(--mb-coral); }

/* 토스트 · 모달 */
.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); z-index: 40; padding: 10px 18px; border-radius: var(--r-pill); background: var(--sheet-bg-strong); border: 1px solid var(--sheet-border); font-size: var(--fs-15); white-space: nowrap; animation: up .2s ease-out; }
.toast[hidden] { display: none; }
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(18,8,28,.45); }
.modal[hidden] { display: none; }
.mcard { width: min(100%, 360px); padding: 22px 20px 18px; border-radius: var(--r-sheet); background: rgba(24,12,36,.92); border: 1px solid var(--sheet-border); display: flex; flex-direction: column; gap: 8px; }
.mcard h3 { margin: 0; font-size: var(--fs-18); }
.mcard p { margin: 0; font-size: var(--fs-15); color: var(--tx-mid); }
.mcard .acts { display: flex; gap: 8px; margin-top: 12px; }
.mcard .acts .btn { flex: 1; justify-content: center; }
[hidden] { display: none !important; }
.caution { --cau: #F0C060; }
/* 모바일: 그룹 평균은 지표 띠 안으로 */
.mstrip .mavg { display: none; flex-direction: column; align-items: flex-end; line-height: 1.15; flex: none; }
.mstrip .mavg small { font-size: var(--fs-12); color: var(--tx-mid); }
.mstrip .mavg b { font-size: var(--fs-18); }
@media (max-width: 599px) { .mstrip .mavg { display: flex; } #chip-avg { display: none !important; } }
.mstrip .mtx { overflow: hidden; }
.mstrip.nobd { cursor: default; }
.mstrip.nobd .mnote { font-size: var(--fs-15); font-weight: 700; line-height: 1.3; }
.mstrip.nobd .msub { font-size: var(--fs-13); color: var(--tx-mid); line-height: 1.3; }
@container (max-width: 330px) { .mstrip .msub { display: none; } }

/* 상단 배너 */
.banner { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: var(--r-card); background: var(--sheet-bg-strong); border: 2px solid rgba(179,115,239,.55); }
.banner.coral { border-color: rgba(232,180,160,.75); }
.banner .bn-ic { width: 28px; height: 28px; flex: none; display: grid; place-items: center; color: var(--mb-pale); }
.banner.coral .bn-ic { color: var(--mb-coral); }
.banner .bn-ic .ic { width: 22px; height: 22px; }
.banner .bn-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: var(--fs-13); color: var(--tx-mid); line-height: 1.35; }
.banner .bn-tx b { font-size: var(--fs-15); color: var(--tx-hi); }
.banner.coral .bn-tx b { color: var(--mb-coral); }
.banner .bn-btn { height: var(--tap); padding: 0 14px; border-radius: var(--r-pill); background: var(--fill); border: 1px solid var(--line); font-size: var(--fs-13); font-weight: 600; white-space: nowrap; flex: none; }
.banner.coral .bn-btn { border: 2px solid rgba(232,180,160,.7); color: var(--mb-coral); background: rgba(232,180,160,.12); }

/* 칩 줄: 한 줄, 넘치면 우선순위 낮은 칩 생략 + 더보기 */
@media (max-width: 599px) { body.sheet-tall #chipline { display: none; } }
.chipline { display: flex; align-items: center; gap: 4px; min-height: 44px; min-width: 0; overflow: hidden; flex-wrap: nowrap; }
.chipline .grp { display: inline-flex; flex: none; align-items: center; }
.achip { height: var(--tap); padding: 0 2px; display: inline-flex; align-items: center; flex: none; }
.ap { height: 36px; padding: 0 12px; border-radius: var(--r-pill); display: inline-flex; align-items: center; gap: 6px; background: var(--fill); border: 1px solid var(--line); font-size: var(--fs-13); white-space: nowrap; color: var(--tx-hi); }
.ap b { font-size: var(--fs-15); font-weight: 700; }
.ap .ic { width: 16px; height: 16px; flex: none; }
.ap.sm { gap: 10px; padding: 0 12px; }
.ap .sg { display: inline-flex; align-items: center; gap: 6px; }
.ap.warn { border: 2px solid rgba(232,180,160,.75); background: rgba(232,180,160,.14); color: var(--mb-coral); padding: 0 11px; }
.ap.hd { border: 2px solid var(--mb-lavender); background: rgba(179,115,239,.22); padding: 0 11px; }
.ap.sp { border: 2px solid var(--mb-mint); background: rgba(1,240,200,.12); padding: 0 11px; }
.ap.act { background: rgba(232,180,160,.16); border: 2px solid rgba(232,180,160,.75); color: var(--mb-coral); font-weight: 700; padding: 0 12px; }
.ap.rec { border: 2px solid rgba(240,96,93,.7); background: rgba(240,96,93,.14); padding: 0 11px; }
.ap.pause { border: 2px solid rgba(179,115,239,.7); background: rgba(179,115,239,.16); padding: 0 11px; }
.ap.on { background: rgba(179,115,239,.28); border-color: var(--mb-lavender); }
.ap.cau { border: 2px solid rgba(240,192,96,.75); background: rgba(240,192,96,.12); color: #F0C060; padding: 0 11px; }
.rdot { width: 10px; height: 10px; border-radius: 50%; background: #F0605D; flex: none; display: inline-block; box-shadow: 0 0 0 3px rgba(240,96,93,.25); }
.rdot.paused { background: transparent; border: 2px solid var(--mb-pale); box-shadow: none; }

/* 타일 변형 */
.tile .tbadge { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(18,8,28,.7); }
.tile .tbadge .ic { width: 16px; height: 16px; }
.tile .tbadge.hd { color: var(--mb-pale); border: 1px solid var(--mb-lavender); }
.tile .tbadge.sp { color: var(--mb-mint); border: 1px solid var(--mb-mint); }
.tile.handup { border: 2px solid var(--mb-lavender); }
.tile.speaking { border: 2px solid var(--mb-mint); background: rgba(1,240,200,.1); }
.tile.leadoff { border-color: rgba(232,180,160,.75); }
.st.hdt { color: var(--mb-pale); font-weight: 600; }
.st.spt { color: var(--mb-mint); font-weight: 600; }
.st.cau { color: #F0C060; }
.st .ic { width: 14px; height: 14px; flex: none; }
.avt { width: 100%; height: 100%; border-radius: 50%; background: rgba(95,0,128,.55); border: 1px solid rgba(179,115,239,.5); display: grid; place-items: center; font-size: var(--rf); font-weight: 700; }
body.net-bad .grid, body.net-bad .solowrap { opacity: .5; }
body.net-bad .selfview .sv-vid { opacity: .45; }

/* 오프라인 요약 패널(셀프뷰 자리) */
.sumpanel { aspect-ratio: auto; height: 128px; align-self: flex-start; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 8px 8px; background: var(--sheet-bg-strong); }
@media (min-width: 600px) { .sumpanel { height: 120px; } }
.sumpanel .sp-r { min-height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: var(--fs-12); color: var(--tx-mid); border-bottom: 1px solid rgba(255,255,255,.08); }
.sumpanel .sp-r:last-child { border-bottom: 0; }
.sumpanel .sp-r span { white-space: nowrap; }
.sumpanel .sp-r { gap: 4px; }
.sumpanel .rdot { width: 8px; height: 8px; box-shadow: none; }
.sumpanel .sp-r b { font-size: var(--fs-13); color: var(--tx-hi); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
@media (min-width: 600px) { .sumpanel .sp-r b { font-size: var(--fs-15); } .sumpanel { padding: 8px 12px; } .sumpanel .sp-r { gap: 8px; } .sumpanel .rdot { width: 10px; height: 10px; } }
.selfview.deny { border: 2px solid rgba(232,180,160,.75); }
.sv-off.deny { color: var(--mb-coral); gap: 3px; justify-content: flex-start; padding: 12px 6px 32px; line-height: 1.2; }
.sv-off.deny > * { flex: none; }
.sv-off.deny .ic { width: 22px; height: 22px; }
@media (min-width: 600px) { .sv-off.deny { padding: 10px 6px 34px; justify-content: center; } }
.sv-off.deny small { font-size: var(--fs-12); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* 1:1 큰 회원 카드 — 가운데 단일 컬럼, 가로형만 2열(같은 폭·같은 높이) */
.solowrap { width: 100%; max-width: 640px; margin: 0 auto; }
.solo { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: stretch; }
.card { padding: 16px; border-radius: var(--r-card); background: var(--sheet-bg); border: 1px solid var(--sheet-border); }
.solo-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.solo-h b { font-size: var(--fs-18); }
.solo-h .chip { height: 28px; }
.solo .mini .ring { width: 52px; height: 52px; }
.solo .mini .ring .num { font-size: var(--fs-18); }
.solo-r { display: flex; flex-direction: column; gap: 8px; }
.solo-r > * { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.solo .trend svg { height: 40px; }
.solo .qas.card { padding: 8px 16px; }
@media (min-width: 600px) { .solo .mini .ring { width: 88px; height: 88px; } .solo .mini .ring .num { font-size: var(--fs-24); } .solo .trend svg { height: 64px; } }
@media (min-width: 1000px) and (orientation: landscape) {
  .solowrap { max-width: 1000px; }
  .solo { grid-template-columns: 1fr 1fr; gap: 16px; }
  .solo .mini .ring { width: 72px; height: 72px; }
  .solo .mini .ring .num { font-size: var(--fs-18); }
  .solo .trend svg { height: 56px; }
}

/* 시트 리스트·단계 */
.lrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 6px 8px 6px 12px; border-radius: 14px; background: var(--fill); }
.lrow .l { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lrow .tx { display: flex; flex-direction: column; min-width: 0; }
.lrow .tx b { font-size: var(--fs-15); }
.lrow .tx small { font-size: var(--fs-12); color: var(--tx-mid); }
.lrow .tx small.coral { color: var(--mb-coral); }
.lrow .tx small.cau { color: #F0C060; }
.lrow .btn { height: var(--tap); padding: 0 14px; font-size: var(--fs-13); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; counter-reset: st; }
.steps li { display: flex; align-items: center; gap: 12px; font-size: var(--fs-15); }
.steps li::before { counter-increment: st; content: counter(st); width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--mb-purple); border: 1px solid var(--mb-lavender); font-size: var(--fs-13); font-weight: 700; }
.sh-note { margin: 0; font-size: var(--fs-13); color: var(--tx-mid); }
.sh-note.coral { color: var(--mb-coral); }
.mi { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; }

/* 종료 후 리포트 생성 중 */
body.ending .app, body.ending .toast, body.ending .modal { display: none !important; }
.ending { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; }
.ecard { width: min(100%, 420px); padding: 24px 20px 18px; border-radius: var(--r-sheet); background: var(--sheet-bg-strong); border: 1px solid var(--sheet-border); display: flex; flex-direction: column; gap: 12px; }
.ecard .eic { width: 48px; height: 48px; border-radius: 50%; background: rgba(1,240,200,.14); border: 2px solid var(--mb-mint); color: var(--mb-mint); display: grid; place-items: center; }
.ecard .eic .ic { width: 26px; height: 26px; }
.ecard h2 { margin: 0; font-size: var(--fs-24); }
.ecard p { margin: 0; font-size: var(--fs-15); color: var(--tx-mid); }
.esteps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.esteps li { min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 14px; background: var(--fill); font-size: var(--fs-15); }
.esteps li small { margin-left: auto; font-size: var(--fs-13); color: var(--tx-mid); }
.esteps li .ic { width: 22px; height: 22px; flex: none; }
.esteps li.done .ic { color: var(--mb-mint); }
.esteps li.doing { border: 2px solid var(--mb-lavender); background: rgba(179,115,239,.16); }
.esteps li.doing .ic { color: var(--mb-pale); }
.esteps li.wait { color: var(--tx-mid); }
.ecard .acts { display: flex; gap: 8px; margin-top: 4px; }
.ecard .acts .btn { flex: 1; justify-content: center; }
/* ===== 5차: 좌우 대칭·비율 규칙(균형.md) — 기준축 = 사이드 시트를 뺀 메인 영역 중심 ===== */
:root { --hh: 112px; --hhb: 168px; --colmax: 1000px; }
@media (min-width: 600px) { :root { --hh: 136px; --hhb: 200px; } }
@media (min-width: 1000px) and (orientation: landscape) { :root { --hh: 120px; --hhb: 176px; } }
.app { gap: 8px; padding: 8px 16px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
.body { gap: 16px; }
.col { gap: 8px; }
.main { gap: 8px; align-items: center; }
.main > * { width: 100%; max-width: var(--colmax); }
.gridwrap { flex: 1 1 0; }

/* S3 상단 바: 좌(닫기)·우(종료) 같은 크기·같은 바깥 여백, 제목·시간은 정중앙 */
.top { grid-template-columns: minmax(44px, 1fr) minmax(0, auto) minmax(44px, 1fr); grid-template-areas: "x t e"; gap: 8px; padding: 8px; }
.top .x { justify-self: start; } .top .end { justify-self: end; }
.ttl { align-items: center; text-align: center; }
.ttl h1 { justify-content: center; max-width: 100%; }
.ttl p { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 2px 0 0; font-size: var(--fs-13); color: var(--tx-mid); white-space: nowrap; }
.ttl p b { color: var(--tx-hi); font-size: var(--fs-15); }
.ttl p .ic { width: 14px; height: 14px; }
.ttl p .tm { display: inline-flex; align-items: center; gap: 4px; }
.ttl .logo { display: none; }
.end { width: var(--tap); padding: 0; justify-content: center; border-radius: 50%; }
.end .et { display: none; }
@media (min-width: 600px) {
  .ttl .logo { display: block; }
  .end { width: auto; padding: 0 16px 0 12px; border-radius: var(--r-pill); }
  .end .et { display: inline; }
  .top { grid-template-columns: minmax(104px, 1fr) minmax(0, auto) minmax(104px, 1fr); }
}
@media (min-width: 1000px) { .ttl p b { font-size: var(--fs-18); } .ttl p { font-size: var(--fs-15); } }

/* CS3 헤드 행: 지표 띠 : 슬롯(셀프뷰/요약 패널) = 62:38(모바일) · 66:34(태블릿·데스크톱), 같은 높이 */
.head { display: grid; grid-template-columns: 62fr 38fr; gap: 8px; height: var(--hh); flex: none; align-items: stretch; }
.head.big { height: var(--hhb); }
@media (min-width: 600px) { .head { grid-template-columns: 66fr 34fr; gap: 16px; } }
.head > .mstrip { height: 100%; min-height: 0; width: 100%; }
.head .selfview, .head .sumpanel { width: 100%; height: 100%; aspect-ratio: auto; align-self: stretch; }
.selfview .sv-p { display: none !important; } .selfview .sv-l { display: block !important; }
.sumpanel { justify-content: space-evenly; padding: 0 12px; }
.mstrip { gap: 8px; padding: 8px 12px; }
.mstrip .mavg { display: flex; }
.mstrip .mtop { flex-wrap: wrap; }
@container (max-width: 250px) { .mstrip .mg { display: none; } }

/* 태블릿 세로 바텀 시트: 마지막 타일이 시트 위에 온전히 보이도록 높이 제한 */
@media (min-width: 600px) and (not ((min-width: 1000px) and (orientation: landscape))) { .sheet { max-height: 50dvh; } .sheet.tall { height: 50dvh; } }
/* CS4 칩 줄: 헤드와 같은 폭, 가운데 정렬 */
.chipline { justify-content: center; }
[data-skip] { display: none !important; }
#rangechip { min-width: 96px; justify-content: center; }

/* CS1·CS2 그리드: 고정 크기 타일, 열 수는 균등 분배 우선, 행 단위로 가운데, 영역 세로 중앙 */
.grid { margin: auto; }
.tile { gap: 2px; padding: 6px 8px; }
.dockwrap { width: 100%; }
.dock { max-width: 640px; justify-content: space-evenly; }
</style>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const params = new URLSearchParams(location.search);

  const METRICS = [
    { key: 'focus', label: '집중도', short: '집중', unit: '%', group: 'MIND', min: 0, max: 100 },
    { key: 'relax', label: '이완도', short: '이완', unit: '%', group: 'MIND', min: 0, max: 100 },
    { key: 'balance', label: '감정균형도', short: '감정', unit: '%', group: 'MIND', min: 0, max: 100 },
    { key: 'bpm', label: 'BPM', short: 'BPM', unit: 'bpm', group: 'BODY', min: 50, max: 110 },
    { key: 'resp', label: '호흡', short: '호흡', unit: '회/분', group: 'BODY', min: 6, max: 24 },
    { key: 'hrv', label: 'HRV', short: 'HRV', unit: 'ms', group: 'BODY', min: 10, max: 90 },
  ];
  const MKEY = Object.fromEntries(METRICS.map(m => [m.key, m]));
  const mcol = key => `var(--mc-${key})`;

  const BASE = [
    { id: 1, name: '서연', band: 'on', v: { focus: 68, relax: 70, balance: 74, bpm: 72, resp: 14, hrv: 52 }, ci: [['마음의 날씨', '잔잔해요'], ['몸 상태', '편안해요'], ['수면', '7시간 · 푹 잤어요']] },
    { id: 2, name: '민준', band: 'on', v: { focus: 54, relax: 58, balance: 61, bpm: 78, resp: 16, hrv: 41 }, ci: [['마음의 날씨', '조금 들떠 있어요'], ['몸 상태', '어깨에 힘이 들어가요'], ['수면', '6시간 · 보통']] },
    { id: 3, name: '지우', band: 'on', v: { focus: 79, relax: 88, balance: 85, bpm: 64, resp: 10, hrv: 71 }, ci: [['마음의 날씨', '맑고 고요해요'], ['몸 상태', '가벼워요'], ['수면', '8시간 · 푹 잤어요']] },
    { id: 4, name: '하준', band: 'off', v: null, ci: [['마음의 날씨', '잔잔해요'], ['몸 상태', '편안해요'], ['수면', '7시간 · 보통']] },
    { id: 5, name: '서아', band: 'on', v: { focus: 38, relax: 41, balance: 45, bpm: 86, resp: 18, hrv: 28 }, ci: [['몸 상태', '어깨가 많이 뻐근해요'], ['마음의 날씨', '조금 무거워요'], ['수면', '4시간 · 뒤척였어요']] },
    { id: 6, name: '도윤', band: 'lost', v: { focus: 60, relax: 64, balance: 66, bpm: 75, resp: 15, hrv: 44 }, ago: '2분 전', ci: [['수면', '거의 못 잤어요'], ['마음의 날씨', '무거워요'], ['몸 상태', '피곤해요']] },
    { id: 7, name: '예린', band: 'on', v: { focus: 62, relax: 73, balance: 70, bpm: 70, resp: 12, hrv: 55 }, ci: [['마음의 날씨', '잔잔해요'], ['몸 상태', '편안해요'], ['수면', '7시간 · 보통']] },
    { id: 8, name: '시우', band: 'off', v: null, ci: [['마음의 날씨', '들떠 있어요'], ['몸 상태', '가벼워요'], ['수면', '6시간 · 보통']] },
  ];
  const EXTRA_NAMES = ['하윤', '도현', '나은', '지안', '수호', '다온', '이서', '로하', '유진', '태오', '소이', '건우', '아린', '현서', '라온', '시현'];
  function makeExtra(i) {
    const band = i % 5 === 3 ? 'off' : 'on';
    const r = 48 + ((i * 13) % 40);
    return { id: i + 1, name: EXTRA_NAMES[(i - 8) % EXTRA_NAMES.length], band,
      v: band === 'off' ? null : { focus: 45 + ((i * 7) % 40), relax: r, balance: 50 + ((i * 11) % 38), bpm: 62 + ((i * 5) % 24), resp: 10 + (i % 8), hrv: 30 + ((i * 9) % 40) },
      ci: [['마음의 날씨', '잔잔해요'], ['몸 상태', '편안해요'], ['수면', '7시간 · 보통']] };
  }
  const clampN = v => { const n = parseInt(v || '8', 10); return Number.isFinite(n) ? Math.min(24, Math.max(1, n)) : 8; };
  const buildPeople = n => Array.from({ length: n }, (_, i) => BASE[i] || makeExtra(i));

  const MESSAGES = [
    { who: '서연', t: '12:18', x: '마음이 한결 편안해졌어요' },
    { who: '나', me: true, t: '12:19', x: '좋아요. 지금 편안한 속도 그대로 이어가 볼게요.' },
    { who: '민준', t: '12:24', x: '어깨에 힘이 자꾸 들어가요' },
    { who: '지우', t: '12:26', x: '배경 소리가 참 좋아요' },
    { who: '서아', t: '12:31', x: '어깨가 계속 뻐근해요' },
    { who: '나', me: true, t: '12:32', x: '서아님, 어깨에 힘이 들어가 있는지 한 번 살펴보세요.' },
    { who: '예린', t: '12:33', x: '네, 살펴볼게요' },
  ];

  const CASE_DEF = {
    C01: {}, C02: { hands: [2, 5] }, C03: { speaking: 3 },
    C04: { loc: 'offline' }, C05: { solo: true }, C06: { solo: true, loc: 'offline' },
    C07: { cam: 'off' }, C08: { cam: 'denied' }, C09: { mic: 'off' }, C10: { mic: 'denied' },
    C11: { rec: 'rec' }, C12: { leadoff: [2, 5, 8], lowbat: [3, 7] }, C13: { allOff: true },
    C14: { queue: 3 }, C15: { selfBand: 'on' }, C16: { net: 'reconnecting' }, C17: { phase: 'confirm' },
    C18: { n: 20, hands: [10, 13, 18], handsFirst: true },
  };
  const rawCase = (params.get('case') || '').toUpperCase();
  const CASE_ID = CASE_DEF[rawCase] ? rawCase : 'C01';
  const cd = CASE_DEF[CASE_ID];
  const pick = (k, allowed, d) => (allowed.includes(params.get(k)) ? params.get(k) : d);
  const loc = pick('loc', ['online', 'offline'], cd.loc || 'online');
  const camParam = pick('cam', ['off', 'big', 'denied'], cd.cam || null);
  const micParam = pick('mic', ['off', 'denied'], cd.mic || null);
  const scn = {
    id: CASE_ID, loc, solo: !!cd.solo, allOff: !!cd.allOff,
    camDenied: loc === 'online' && camParam === 'denied',
    micDenied: loc === 'online' && micParam === 'denied',
    net: pick('net', ['reconnecting', 'down'], cd.net || null),
    leadoff: cd.leadoff || [], lowbat: cd.lowbat || [],
    selfBand: pick('selfband', ['on', 'off'], cd.selfBand || null),
    phase: pick('phase', ['confirm', 'ending'], cd.phase || 'live'),
  };
  const REC_T = '08:12';
  const WAIT_NAMES = ['가은', '윤우', '채아'];
  const recParam = pick('rec', ['rec', 'paused', 'none'], loc === 'offline' ? 'rec' : (cd.rec || null));
  const initialDetail = parseInt(params.get('detail') || '', 10);
  const SHEETS = ['metric', 'chat', 'media', 'checkin', 'tools', 'hands', 'actions', 'queue', 'alerts', 'myband', 'permcam', 'permmic'];
  let state = {
    n: scn.solo ? 1 : (params.get('n') ? clampN(params.get('n')) : (cd.n || 8)),
    metric: METRICS.some(m => m.key === params.get('metric')) ? params.get('metric') : 'relax',
    rotate: params.get('rotate') === '1',
    sort: 'join',
    handsFirst: loc === 'online' && !!cd.handsFirst,
    table: params.get('table') === '1',
    sheet: Number.isFinite(initialDetail) ? 'detail' : (SHEETS.includes(params.get('sheet')) ? params.get('sheet') : null),
    detail: Number.isFinite(initialDetail) ? initialDetail : null,
    messages: MESSAGES,
    cam: camParam !== 'off', camBig: camParam === 'big', mic: micParam === null,
    rec: recParam === 'none' ? null : recParam,
    hands: loc === 'online' ? (cd.hands || []) : [],
    speaking: loc === 'online' ? (cd.speaking || null) : null,
    queue: cd.queue || 0,
    bgm: '숲속 새벽', vol: 60,
  };
  const setState = patch => { state = { ...state, ...patch }; render(); };

  // 배경
  const bgNo = ['1', '4', '5', '8', '10'].includes(params.get('bg')) ? params.get('bg') : '4';
  $('#bg').style.backgroundImage = `url(assets/bg/background${bgNo}.webp)`;

  const SIDE_MQ = window.matchMedia('(min-width: 1000px) and (orientation: landscape)');
  const isBottomSheet = () => !SIDE_MQ.matches;
  const icon = (id, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  const valOf = (p, key) => (p.band === 'on' && p.v) ? p.v[key] : null;
  const pctOf = (m, v) => Math.max(0.03, Math.min(1, (v - m.min) / (m.max - m.min)));
  const bandDot = b => (b === 'leadoff' ? 'lost' : b);
  const BAND_TXT = { on: '연결됨', off: '밴드 미착용', lost: '연결 끊김', leadoff: '접촉 불량' };
  const people = () => buildPeople(state.n).map(p => {
    let q = scn.allOff ? { ...p, band: 'off', v: null } : p;
    if (scn.leadoff.includes(p.id)) q = { ...q, band: 'leadoff' };
    if (scn.lowbat.includes(p.id)) q = { ...q, lowbat: true };
    return { ...q, hand: state.hands.includes(p.id), speaking: state.speaking === p.id };
  });

  function ringSVG(pct, mode, key) {
    const C = 2 * Math.PI * 44;
    if (mode === 'off' || mode === 'lost') return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rc-t ${mode}" cx="50" cy="50" r="44"/></svg>`;
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rc-t" cx="50" cy="50" r="44"/><circle class="rc-a" style="--mcol:${mcol(key)}" cx="50" cy="50" r="44" stroke-dasharray="${(C * pct).toFixed(1)} ${C.toFixed(1)}"/></svg>`;
  }

  function sortedPeople() {
    const m = MKEY[state.metric];
    const list = people();
    let out = list;
    if (state.sort !== 'join') {
      const dir = state.sort === 'low' ? 1 : -1;
      const withVal = list.filter(p => valOf(p, m.key) !== null).sort((a, b) => dir * (valOf(a, m.key) - valOf(b, m.key)));
      out = [...withVal, ...list.filter(p => valOf(p, m.key) === null)];
    }
    if (state.handsFirst) out = [...out.filter(p => p.speaking || p.hand), ...out.filter(p => !(p.speaking || p.hand))];
    return out;
  }

  function avgOf(key) {
    const vals = people().map(p => valOf(p, key)).filter(v => v !== null);
    return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
  }

  function tileHTML(p) {
    const m = MKEY[state.metric];
    const v = valOf(p, m.key);
    const pressed = state.sheet === 'detail' && state.detail === p.id;
    const badge = p.speaking ? `<span class="tbadge sp" aria-hidden="true">${icon('mic')}</span>` : (p.hand ? `<span class="tbadge hd" aria-hidden="true">${icon('hand')}</span>` : '');
    const cls = [p.speaking ? 'speaking' : '', p.hand ? 'handup' : ''].join(' ');
    if (scn.allOff) {
      return `<button class="tile away" data-id="${p.id}" aria-pressed="${pressed}" aria-label="${p.name} 체크인 ${p.ci[0][1]}">
        <div class="ring"><span class="avt">${p.name[0]}</span></div>
        <span class="nm">${p.name}</span>
        <span class="st"><i class="dot off"></i>${p.ci[0][1]}</span></button>`;
    }
    if (p.band === 'on') {
      const warn = m.unit === '%' && v < 50;
      let st;
      if (p.speaking) st = `<span class="st spt"><i class="dot on"></i>말하는 중</span>`;
      else if (p.hand) st = `<span class="st hdt">${icon('hand')}손듦 · 대기 중</span>`;
      else if (scn.net) st = `<span class="st">${icon('pause')}수신 일시 중단</span>`;
      else if (p.lowbat) st = `<span class="st cau">${icon('battery')}배터리 낮음</span>`;
      else st = `<span class="st ${warn ? 'warn' : ''}"><i class="dot on"></i>연결됨${warn ? ' · 살펴보기' : ''}</span>`;
      return `<button class="tile ${warn && !p.hand && !p.speaking ? 'warn' : ''} ${cls}" data-id="${p.id}" aria-pressed="${pressed}" aria-label="${p.name} ${m.label} ${v}${m.unit}${p.hand ? ', 손들었어요' : ''}${p.speaking ? ', 말하는 중' : ''}">
        ${badge}<div class="ring">${ringSVG(pctOf(m, v), 'ok', m.key)}<div class="val"><b class="num">${v}</b><small>${m.short}</small></div></div>
        <span class="nm">${p.name}</span>${st}</button>`;
    }
    if (p.band === 'leadoff') {
      return `<button class="tile leadoff" data-id="${p.id}" aria-pressed="${pressed}" aria-label="${p.name} 접촉 불량">
        <div class="ring">${ringSVG(0, 'lost')}<div class="val"><span class="nb warn">접촉</span></div></div>
        <span class="nm">${p.name}</span>
        <span class="st warn"><i class="dot lost"></i>접촉 불량 · 확인</span></button>`;
    }
    if (p.band === 'lost') {
      return `<button class="tile away" data-id="${p.id}" aria-pressed="${pressed}" aria-label="${p.name} 연결 끊김">
        <div class="ring">${ringSVG(0, 'lost')}<div class="val"><span class="nb warn">끊김</span></div></div>
        <span class="nm">${p.name}</span>
        <span class="st"><i class="dot lost"></i>연결 끊김 · ${p.ago}</span></button>`;
    }
    return `<button class="tile away" data-id="${p.id}" aria-pressed="${pressed}" aria-label="${p.name} 밴드 미착용">
      <div class="ring">${ringSVG(0, 'off')}<div class="val"><span class="nb">미착용</span></div></div>
      <span class="nm">${p.name}</span>
      <span class="st"><i class="dot off"></i>밴드 없이 참여</span></button>`;
  }

  function tableHTML(list) {
    const head = METRICS.map(m => `<th class="${m.key === state.metric ? 'sel' : ''}">${m.short}</th>`).join('');
    const rows = list.map(p => {
      const cells = METRICS.map(m => {
        const v = p.band === 'on' && p.v ? p.v[m.key] : null;
        return `<td class="${m.key === state.metric ? 'sel' : ''} ${v === null ? 'mu' : ''}">${v === null ? '—' : v}</td>`;
      }).join('');
      return `<tr data-id="${p.id}" tabindex="0"><td><span class="nd"><i class="dot ${bandDot(p.band)}"></i>${p.name}</span></td>${cells}</tr>`;
    }).join('');
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>이름</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // ── 레이아웃: 타일은 고정 크기(참가자 수와 무관), 넘치면 그리드만 세로 스크롤 ──
  const scroller = () => $('#gridscroll');
  function updateScrollHints() {
    const sc = scroller();
    const up = sc.scrollTop > 4, down = sc.scrollTop + sc.clientHeight < sc.scrollHeight - 4;
    sc.classList.toggle('fade-t', up);
    sc.classList.toggle('fade-b', down);
    const rg = $('#rangetxt'); const grp = rg ? rg.closest('.grp') : null;
    const scrollable = sc.scrollHeight > sc.clientHeight + 1;
    if (!grp) return;
    if (!scrollable) { if (!grp.dataset.skip) { grp.dataset.skip = '1'; fitChips(); } return; }
    const sr = sc.getBoundingClientRect();
    const items = $$('#grid [data-id]');
    let first = -1, last = -1;
    items.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const visible = Math.min(r.bottom, sr.bottom) - Math.max(r.top, sr.top);
      if (visible > r.height * 0.5) { if (first < 0) first = i; last = i; }
    });
    if (first < 0) return;
    const was = grp.dataset.skip;
    delete grp.dataset.skip;
    rg.textContent = `${first + 1}–${last + 1} / ${items.length}명`;
    if (was) fitChips();
  }

  function layout() {
    const sc = scroller();
    const grid = $('#grid');
    const prevTop = sc.scrollTop;
    sc.style.paddingBottom = '';
    const W = sc.clientWidth - 6, H = sc.clientHeight - 8;
    const vw = window.innerWidth;
    const vp = vw < 600 ? 'm' : (vw < 1000 ? 'tp' : (vw < 1280 ? 'tl' : 'd'));
    const baseCols = { m: 2, tp: 4, tl: 5, d: 5 }[vp];
    const gap = vp === 'm' ? 8 : 16;
    const minW = vp === 'm' ? 140 : 170;
    const list = sortedPeople();

    if (scn.solo) {
      grid.style.cssText = 'display:block;max-width:none;';
      grid.innerHTML = soloHTML(list[0]);
    } else if (state.table) {
      grid.removeAttribute('style');
      grid.innerHTML = tableHTML(list);
    } else {
      const nP = list.length;
      const fit = Math.max(2, Math.min(baseCols, Math.floor((W + gap) / (minW + gap))));
      // 열 수: 인원을 균등히 나누는 값 우선(큰 값부터), 없으면 마지막 행이 가장 덜 비는 값
      let cols = 0;
      for (let c = fit; c >= 2; c--) if (nP % c === 0) { cols = c; break; }
      if (!cols) { let best = -1; for (let c = fit; c >= 2; c--) { const fill = (nP % c || c) / c; if (fill > best) { best = fill; cols = c; } } }
      const designRows = Math.ceil(Math.min(nP, 8) / cols);
      const minH = vp === 'm' ? 112 : 150, maxTH = vp === 'm' ? 150 : 240;
      const th = Math.max(minH, Math.min(maxTH, Math.floor((H - (designRows - 1) * gap) / designRows)));
      const tw = Math.min(vp === 'm' ? 400 : 240, Math.floor((W - (cols - 1) * gap) / cols));
      const rs = Math.max(56, Math.min(112, th - 68, tw - 32));
      grid.style.cssText = `--tw:${tw}px;--th:${th}px;--rs:${rs}px;--rf:${rs >= 100 ? 'var(--fs-36)' : 'var(--fs-24)'};gap:${gap}px;max-width:${cols * tw + (cols - 1) * gap + 1}px;`;
      grid.innerHTML = list.map(tileHTML).join('');
    }
    grid.style.setProperty('--mcol', mcol(state.metric));
    // 모바일 바텀 시트가 그리드 하단을 덮을 때, 마지막 타일을 시트 밖으로 끌어올 수 있게 여백 확보
    const sheet = $('#sheet');
    if (!sheet.hidden && isBottomSheet()) {
      const covered = sheet.getBoundingClientRect().height - (window.innerHeight - sc.getBoundingClientRect().bottom);
      sc.style.paddingBottom = `${4 + Math.max(0, Math.round(covered))}px`;
    }
    sc.scrollTop = prevTop;
    updateScrollHints();
  }

  // ── 상단 영역 ──
  function renderTitle() {
    $('#ttl-t').textContent = scn.solo ? '임상심리상담 · 3회차' : '마음챙김 명상수업 · 4회차';
    const Lp = people(); const joined = Lp.filter(p => p.band !== 'lost').length;
    $('#ttl-s').innerHTML = `<span class="tm" aria-label="함께한 시간 12분 34초, 계획 30분">${icon('clock')}<b>12:34</b><span>/ 30:00</span></span>${scn.solo ? '' : `<span aria-hidden="true">·</span><span>접속 <b>${joined}/${Lp.length}</b></span>`}`;
    $('#m-p').textContent = `접속 중인 참가자 ${people().filter(p => p.band !== 'lost').length}명의 화면이 종료되고, 기록·리포트 생성이 시작돼요. 종료 후에는 되돌릴 수 없어요.`;
