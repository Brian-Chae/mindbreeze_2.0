# ─────────────────────────────────────────
# MIND BREEZE 2.0 — Dev 배포 (GitHub Actions)
# 트리거: develop 브랜치 push
# 방식: systemd (Docker 미사용) — SDD-014 아키텍처 정합
#   · 프론트: GitHub에서 빌드 → nginx 루트(/home/ubuntu/mindbreeze/dist) 교체
#   · 백엔드: 소스 SCP 전송 → (venv 이미 서버에 존재) → alembic upgrade → systemctl restart
# SDD-229: E2E 는 dev 배포에서 돌지 않는다(운영 릴리스 빌드 release-build.yml 에서만 + 수동 실행).
#          requirements.txt 가 바뀌지 않았으면 시스템 패키지·pip 설치를 건너뛴다.
# ─────────────────────────────────────────

name: Deploy Dev

on:
  push:
    branches: [develop]
  # SDD-197: 수동 재배포(예: push 이벤트 누락 시). 항상 develop 최신 커밋을 배포한다.
  workflow_dispatch:

# INFRA-05: 동시 배포 방지 — 워크플로 동시 실행을 그룹으로 직렬화한다.
#   cancel-in-progress=false: 진행 중 배포를 중간에 취소하면 반쪽 상태가 남으므로 취소하지 않는다.
concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        run: |
          cd frontend
          rm -rf dist node_modules/.tmp
          echo "VITE_API_BASE_URL=https://dev-api.mindbreeze.looxidlabs.com/api/v1" > .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
          # SDD-246: dev 는 실시간 v2 프로토콜 on (운영 deploy-prod.yml 은 건드리지 않는다)
          echo "VITE_LIVE_PROTOCOL_V2=true" >> .env
          # SDD-197: 개발용 역할 시뮬레이션(무인증 계정 생성·무비번 로그인)은 실사용자가 있는 환경에서 끈다.
          npm install --legacy-peer-deps
          npx tsc -b --clean 2>/dev/null; true
          # SDD-220 이후 기본 모드(production)는 운영 출시 빌드로 취급돼 운영 API 주소가 박힌다 → dev는 mode=dev로 빌드
          npx tsc -b && npx vite build --mode dev

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          overwrite: true

  deploy:
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Package deploy bundle
        run: |
          tar --exclude='__pycache__' -czf deploy-bundle.tar.gz \
            frontend/dist \
            deploy/dev/register-crons.sh \
            backend/app \
            backend/alembic \
            backend/alembic.ini \
            backend/requirements.txt \
            backend/scripts \
            backend/ensure_livekit_nginx.py \
            backend/sweep_stale_open_sessions_cron.py \
            backend/sweep_stale_reports_cron.py \
            backend/sweep_session_reminders_cron.py \
            backend/sweep_agent_reminders_cron.py \
            backend/sweep_agent_briefings_cron.py \
            backend/sweep_agent_checkins_cron.py \
            backend/process_pipeline_outbox_cron.py \
            backend/process_email_outbox_cron.py \
            backend/process_push_outbox_cron.py \
            backend/cleanup_data_exports_cron.py \
            backend/process_data_export_outbox_cron.py \
            backend/cleanup_notifications_cron.py \
            backend/upgrade_narrative_cache_cron.py \
            backend/sweep_stale_eeg_raw_cron.py \
            backend/sweep_stale_media_cron.py \
            backend/retention_sweep_cron.py \
            backend/class_operations_cron.py \
            backend/class_rolling_cron.py \
            backend/deploy/mindbreeze-worker.service \
            backend/deploy/mindbreeze-email-worker.service \
            backend/deploy/mindbreeze-export-worker.service \
            backend/deploy/mindbreeze-stt-worker.service \
            backend/deploy/mindbreeze-report-worker.service \
            backend/deploy/logrotate-mindbreeze

      - name: Deploy bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy-bundle.tar.gz"
          target: /home/ubuntu/mindbreeze/
          overwrite: true
          strip_components: 0
          timeout: 60s

      - name: Apply + restart (systemd)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 10m
          script: |
            set -e
            BASE=/home/ubuntu/mindbreeze
            cd "$BASE"

            # 0. INFRA-04: 이전 버전 백업 (실패 시 롤백 대비)
            BACKUP_DIR="$BASE/.deploy-backup"
            rm -rf "$BACKUP_DIR"
            mkdir -p "$BACKUP_DIR"
            [ -d dist ]            && cp -r dist "$BACKUP_DIR/dist" || true
            [ -d backend/app ]     && cp -r backend/app "$BACKUP_DIR/app" || true
            [ -d backend/alembic ] && cp -r backend/alembic "$BACKUP_DIR/alembic" || true

            # SDD-216: 클래스 작업 두 개의 이전 등록과 진입점을 함께 보관한다.
            snapshot_class_jobs() {
              local snapshot="$BACKUP_DIR/class-jobs"
              mkdir -p "$snapshot"
              if ! LC_ALL=C crontab -l > "$snapshot/all-crontab" 2> "$snapshot/crontab-error"; then
                if ! grep -q 'no crontab for' "$snapshot/crontab-error"; then
                  echo "클래스 작업 백업 실패: crontab을 읽을 수 없습니다." >&2
                  return 1
                fi
              fi
              grep -E 'class_(operations|rolling)_cron[.]py([[:space:]]|$)' "$snapshot/all-crontab" > "$snapshot/rows" || true
              for name in class_operations_cron.py class_rolling_cron.py; do
                if [ -f "$BASE/backend/$name" ]; then cp -p "$BASE/backend/$name" "$snapshot/$name"; fi
              done
              touch "$snapshot/ready"
            }
            restore_class_jobs() {
              local snapshot="$BACKUP_DIR/class-jobs"
              [ -f "$snapshot/ready" ] || return 0
              if ! LC_ALL=C crontab -l > "$snapshot/current-crontab" 2> "$snapshot/crontab-error"; then
                if ! grep -q 'no crontab for' "$snapshot/crontab-error"; then
                  echo "클래스 작업 복귀 실패: 현재 crontab을 읽을 수 없습니다." >&2
                  return 1
                fi
              fi
              # 배포 중 추가된 다른 작업은 유지하고 클래스 작업만 복귀한다.
              grep -Ev 'class_(operations|rolling)_cron[.]py([[:space:]]|$)' "$snapshot/current-crontab" > "$snapshot/restored-crontab" || true
              for name in class_operations_cron.py class_rolling_cron.py; do
                if [ -f "$snapshot/$name" ]; then
                  cp -p "$snapshot/$name" "$BASE/backend/$name"
                else
                  rm -f "$BASE/backend/$name"
                fi
              done
              cat "$snapshot/rows" >> "$snapshot/restored-crontab"
              crontab - < "$snapshot/restored-crontab"
            }
            snapshot_class_jobs

            # 롤백 트랩: 스크립트가 실패(set -e 로 조기 종료)하면 이전 버전을 복원한다.
            # 성공 경로에서는 DEPLOY_OK=1 로 확정해 롤백을 막는다.
            DEPLOY_OK=0
            rollback() {
              if [ "$DEPLOY_OK" != "1" ]; then
                echo "!!! 배포 실패 — 이전 버전으로 롤백합니다."
                # SDD-197: 배포 스크립트가 backend 디렉터리로 이동한 뒤 실패해도 경로가 어긋나지 않게 BASE 로 복귀한다
                #   (이전에는 상대경로가 backend/ 기준이 되어 복원이 실패했다).
                cd "$BASE"
                if [ -d "$BACKUP_DIR/dist" ]; then rm -rf dist; cp -r "$BACKUP_DIR/dist" dist; fi
                if [ -d "$BACKUP_DIR/app" ]; then rm -rf backend/app; cp -r "$BACKUP_DIR/app" backend/app; fi
                if [ -d "$BACKUP_DIR/alembic" ]; then rm -rf backend/alembic; cp -r "$BACKUP_DIR/alembic" backend/alembic; fi
                restore_class_jobs
                sudo systemctl restart mindbreeze-backend 2>/dev/null || true
                sudo systemctl restart mindbreeze-worker 2>/dev/null || true
                sudo systemctl restart mindbreeze-email-worker 2>/dev/null || true
                sudo systemctl restart mindbreeze-export-worker 2>/dev/null || true
                # SDD-212: 줄 전용 일꾼도 이전 버전 코드로 재시작한다(유닛 파일은 그대로 두어도 무해 —
                #   PIPELINE_QUEUE_SPLIT_ENABLED 가 꺼져 있으면 빈 줄을 기다릴 뿐이다).
                sudo systemctl restart mindbreeze-stt-worker 2>/dev/null || true
                sudo systemctl restart mindbreeze-report-worker 2>/dev/null || true
              fi
            }
            trap rollback EXIT

            # 1. 번들 압축 해제 (디렉토리 구조 보존)
            tar xzf deploy-bundle.tar.gz
            rm -f deploy-bundle.tar.gz

            # 2. 프론트 dist → nginx root(/home/ubuntu/mindbreeze/dist) 반영
            #    번들은 frontend/dist 로 풀리지만 nginx는 dist 를 서빙하므로 복사한다.
            rm -rf dist
            cp -r frontend/dist dist

            # 3. 백엔드 소스 교체 (app/·alembic/·requirements.txt)
            #    .env.dev 등 서버 전용 파일은 번들에 없으므로 보존된다.
            #    macOS 리소스포크(._*)가 끼지 않도록 정리.
            find backend/app backend/alembic -name '._*' -delete 2>/dev/null || true
            rm -rf backend/app/__pycache__ backend/alembic/__pycache__ 2>/dev/null || true

            # 4. venv 존재 확인 (없으면 생성 — 재배포 내구성)
            cd "$BASE/backend"
            if [ ! -x venv/bin/python ]; then
              python3 -m venv venv
              venv/bin/pip install --upgrade pip
              rm -f .requirements.sha256   # 새 venv 는 반드시 설치
            fi

            # 4.5 GEMINI_API_KEY 주입 (secrets → .env.dev, 없으면 추가·있으면 갱신)
            if grep -qE '^GEMINI_API_KEY=' ./.env.dev; then
              sed -i "s#^GEMINI_API_KEY=.*#GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}#" ./.env.dev
            else
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> ./.env.dev
            fi
            # SDD-246: dev 는 실시간 v2 프로토콜 on (재기동 필요 — 아래 서비스 재시작 단계에서 반영)
            if grep -qE '^LIVE_PROTOCOL_V2=' ./.env.dev; then
              sed -i 's#^LIVE_PROTOCOL_V2=.*#LIVE_PROTOCOL_V2=true#' ./.env.dev
            else
              echo 'LIVE_PROTOCOL_V2=true' >> ./.env.dev
            fi
            # SDD-197: 역할 시뮬레이션은 항상 끈다(이전에는 true 로 강제). DEBUG 도 끈다(SQL echo 에
            #   바인드 파라미터=개인정보가 로그로 남고 디스크를 채웠다).
            if grep -qE '^ENVIRONMENT=' ./.env.dev; then
              sed -i 's#^ENVIRONMENT=.*#ENVIRONMENT=development#' ./.env.dev
            else
              echo 'ENVIRONMENT=development' >> ./.env.dev
            fi
            if grep -qE '^ENABLE_DEV_ROLE_SIMULATION=' ./.env.dev; then
              sed -i 's#^ENABLE_DEV_ROLE_SIMULATION=.*#ENABLE_DEV_ROLE_SIMULATION=false#' ./.env.dev
            else
              echo 'ENABLE_DEV_ROLE_SIMULATION=false' >> ./.env.dev
            fi
            if grep -qE '^DEBUG=' ./.env.dev; then
              sed -i 's#^DEBUG=.*#DEBUG=false#' ./.env.dev
            else
              echo 'DEBUG=false' >> ./.env.dev
            fi
            # SDD-070: PDF 렌더러 시스템 의존성. 글꼴은 app/assets/fonts에도 포함한다.
            # SDD-229: requirements.txt 해시가 직전 설치와 같으면 apt·pip 설치를 건너뛴다(배포당 약 1분).
            #   해시 파일은 설치가 성공한 뒤에만 기록한다 → 설치 실패 시 다음 배포에서 다시 설치한다.
            REQ_HASH=$(sha256sum requirements.txt | cut -d' ' -f1)
            if [ -f .requirements.sha256 ] && [ "$(cat .requirements.sha256)" = "$REQ_HASH" ]; then
              echo "requirements.txt 변경 없음 — 패키지 설치 생략"
            else
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-cjk
              venv/bin/pip install -q -r requirements.txt
              echo "$REQ_HASH" > .requirements.sha256
            fi
            venv/bin/python -c "from weasyprint import HTML; from pathlib import Path; assert Path('app/assets/fonts/NotoSansKR.ttf').is_file()"

            # 4. DB 마이그레이션 — .env.dev 전체 source 대신 필요한 변수만 추출
            #    (.env.dev의 RESEND_FROM_EMAIL 등이 공백·꺽쇠를 포함해 셸 source가 깨짐)
            export DATABASE_URL=$(grep -E '^DATABASE_URL=' ./.env.dev | head -1 | cut -d= -f2-)
            export REDIS_URL=$(grep -E '^REDIS_URL=' ./.env.dev | head -1 | cut -d= -f2-)
            venv/bin/alembic upgrade head

            # 4.8 메인 Celery 워커 systemd 서비스 설치(파이프라인: STT·요약·리포트·영상 병합)
            #     — 이 워커가 없으면 종료 체인(리포트 생성 등)이 큐에 쌓인 채 실행되지 않는다.
            sudo cp "$BASE/backend/deploy/mindbreeze-worker.service" /etc/systemd/system/mindbreeze-worker.service
            sudo systemctl daemon-reload
            sudo systemctl enable mindbreeze-worker 2>/dev/null || true

            # 4.9 이메일 전용 워커 systemd 서비스 설치 (email 큐 분리 — 메인 워커와 큐 공유 방지)
            sudo cp "$BASE/backend/deploy/mindbreeze-email-worker.service" /etc/systemd/system/mindbreeze-email-worker.service
            sudo systemctl daemon-reload
            sudo systemctl enable mindbreeze-email-worker 2>/dev/null || true

            # 4.10 INFRA-01: 데이터 export 전용 워커 systemd 서비스 설치 (exports 큐 소비)
            #      — 이 워커가 없으면 tasks.generate_data_export/cleanup_data_exports 가 큐에
            #        쌓인 채 실행되지 않아 내보내기 zip 이 영원히 준비되지 않는다.
            #      — export-beat 는 **전체** beat 스케줄을 중복 실행하므로 dev 에서는 설치하지 않는다
            #        (주기 작업은 아래 cron 들이 대체). beat 중복 조정은 INFRA-08 후속.
            sudo cp "$BASE/backend/deploy/mindbreeze-export-worker.service" /etc/systemd/system/mindbreeze-export-worker.service
            sudo systemctl daemon-reload
            sudo systemctl enable mindbreeze-export-worker 2>/dev/null || true

            # 4.11 SDD-212: 리포트 파이프라인 줄 전용 일꾼 2종 설치 (stt 줄 / report 줄)
            #      — cp(덮어쓰기)·daemon-reload·enable 만 사용하므로 재실행해도 결과가 같다(멱등).
            #      — 라우팅은 서버 .env.dev 의 PIPELINE_QUEUE_SPLIT_ENABLED 로 제어하며 이 워크플로는 건드리지 않는다.
            #        꺼져 있으면 두 줄은 비어 있어 유닛은 대기만 한다.
            #      — 롤백(수동): 플래그 false → 재시작, 줄 잔량 0 확인(redis-cli llen stt/report) 후
            #        sudo systemctl disable --now mindbreeze-stt-worker mindbreeze-report-worker (deploy/README.md).
            sudo cp "$BASE/backend/deploy/mindbreeze-stt-worker.service" /etc/systemd/system/mindbreeze-stt-worker.service
            sudo cp "$BASE/backend/deploy/mindbreeze-report-worker.service" /etc/systemd/system/mindbreeze-report-worker.service
            sudo systemctl daemon-reload
            sudo systemctl enable mindbreeze-stt-worker
            sudo systemctl enable mindbreeze-report-worker

            # 5. 서비스 재시작
            #    SDD-212: 줄 전용 일꾼을 먼저 기동(빈 줄 소비 대기) → 이후 백엔드·기존 일꾼 순서(deploy/README.md 배포 순서)
            sudo systemctl restart mindbreeze-stt-worker
            sudo systemctl restart mindbreeze-report-worker
            sudo systemctl restart mindbreeze-backend
            sudo systemctl restart mindbreeze-email-worker 2>/dev/null || true
            sudo systemctl restart mindbreeze-export-worker 2>/dev/null || true
            sudo systemctl restart mindbreeze-worker
            sleep 5
            sudo systemctl is-active mindbreeze-backend
            sudo systemctl is-active mindbreeze-worker
            sudo systemctl is-active mindbreeze-export-worker 2>/dev/null || true
            # SDD-212: 신규 유닛이 죽어 있으면 배포 실패(롤백 트랩) — 줄 분리를 켠 뒤 소비자 없는 줄이 생기지 않게 한다.
            sudo systemctl is-active mindbreeze-stt-worker
            sudo systemctl is-active mindbreeze-report-worker

            # 5.0 진단: 워커·백엔드 최근 로그 (파이프라인 소비 여부 확인용)
            echo "=== [진단] mindbreeze-worker 상태 ==="
            sudo systemctl status mindbreeze-worker --no-pager -l || true
            echo "=== [진단] mindbreeze-worker 최근 로그 ==="
            sudo journalctl -u mindbreeze-worker -n 40 --no-pager || true
            echo "=== [진단] mindbreeze-backend 최근 로그 (pipeline publish) ==="
            sudo journalctl -u mindbreeze-backend -n 40 --no-pager | grep -iE "pipeline|outbox|redis|celery|report|error" || true

            # 5.1 LiveKit nginx 프록시 보장 — 시그널링 /livekit/ → 127.0.0.1:7880
            if [ -f /etc/nginx/sites-enabled/mindbreeze-ssl ]; then
              sudo python3 "$BASE/backend/ensure_livekit_nginx.py"
              sudo nginx -t && sudo systemctl reload nginx
            fi

            # 5.5~5.10 dev 크론 등록 (번들 해제 후, 기존 순서 유지)
            bash "$BASE/deploy/dev/register-crons.sh"

            # SDD-188: cron 로그 파일은 ubuntu 가 /var/log 에 직접 만들 수 없어(Permission denied) cron 이 실행되지 못했다 → 미리 생성·소유권 부여
            for f in $(crontab -l | grep -o '/var/log/mindbreeze-[a-z-]*\.log' | sort -u); do sudo touch "$f" && sudo chown ubuntu:ubuntu "$f"; done
            # cron 프로세스의 SQLAlchemy echo(DEBUG=true) 로 로그가 폭증하는 것을 막는다 (crontab 환경변수 줄)
            (echo 'DEBUG=false'; crontab -l 2>/dev/null | grep -v '^DEBUG=') | crontab -

            # 5.6 SDD-197: 로그 회전(cron 로그·SQL 폭증 방지) + journald 용량 상한
            sudo cp "$BASE/backend/deploy/logrotate-mindbreeze" /etc/logrotate.d/mindbreeze
            sudo mkdir -p /etc/systemd/journald.conf.d
            printf '[Journal]\nSystemMaxUse=300M\nMaxRetentionSec=14day\n' | sudo tee /etc/systemd/journald.conf.d/mindbreeze.conf >/dev/null
            sudo systemctl restart systemd-journald || true

            # 6. 헬스체크 — SDD-197: DB·Redis까지 확인하는 ready 사용(실패 시 롤백 트랩 발동)
            curl -sf http://127.0.0.1:8000/health/ready && echo " → backend ready OK"

            # 7. INFRA-04: 배포 성공 확정 → 롤백 트랩 해제, 백업 정리
            DEPLOY_OK=1
            rm -rf "$BACKUP_DIR"
            echo "✅ 배포 완료"

