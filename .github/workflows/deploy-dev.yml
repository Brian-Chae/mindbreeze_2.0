# ─────────────────────────────────────────
# MIND BREEZE 2.0 — Dev 배포 (GitHub Actions)
# 트리거: develop 브랜치 push
# ─────────────────────────────────────────

name: Deploy Dev

on:
  push:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Build & Push
        run: |
          docker build -t mindbreeze-dev-be -f docker/Dockerfile.backend backend/
          docker save mindbreeze-dev-be | gzip > be.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: be.tar.gz
          overwrite: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        run: |
          cd frontend
          rm -rf dist node_modules/.tmp
          echo "VITE_API_BASE_URL=http://dev-api.mindbreeze.looxidlabs.com/api/v1" > .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
          npm install --legacy-peer-deps
          npx tsc -b --clean 2>/dev/null; true
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          overwrite: true

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Package deploy bundle
        run: |
          tar czf deploy-bundle.tar.gz \
            be.tar.gz \
            frontend/dist \
            docker/docker-compose.dev.yml \
            docker/nginx \
            docker/Dockerfile.frontend \
            docker/Dockerfile.backend \
            backend/.env.dev \
            certbot/

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy-bundle.tar.gz"
          target: /home/ubuntu/mindbreeze/
          overwrite: true
          strip_components: 0

      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/mindbreeze

            # Extract deploy bundle (preserving directory structure)
            tar xzf deploy-bundle.tar.gz
            rm -f deploy-bundle.tar.gz

            # Clean stale backend source on host (Docker build context)
            # The pre-built image is loaded, not rebuilt on server
            rm -rf backend/app backend/app.old 2>/dev/null || true

            # Load pre-built backend image
            docker load < be.tar.gz
            rm -f be.tar.gz

            # Rebuild frontend container with new dist
            docker compose -f docker/docker-compose.dev.yml build --no-cache frontend

            # Restart all services
            docker compose -f docker/docker-compose.dev.yml up -d --force-recreate

            # Run DB migrations
            sleep 5
            docker compose -f docker/docker-compose.dev.yml exec -T backend alembic upgrade head

            # Cleanup
            docker image prune -f
