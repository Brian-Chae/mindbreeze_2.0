# ─────────────────────────────────────────
# MIND BREEZE 2.0 — CI
# 정책(SDD 마무리 시점에만 전체 검증):
#   - 작업 브랜치(sdd/**, fix/**, feature/** 등) push 에서는 돌지 않는다. 로컬은 scripts/test-changed 사용.
#   - develop 대상 PR(생성·갱신) = 머지 게이트. SDD-229: 바뀐 영역만 검증한다(changes 잡이 선택).
#       · frontend/ 변경 없음 → frontend 잡 skip
#       · backend 변경 없음 → backend skip / 일부 변경 → 관련 테스트만 / 공통 영역 변경 → 전체
#       · backend/app·alembic·tests/pg·requirements 변경 없음 → backend-pg-smoke skip
#       · 선택 규칙은 scripts/test-changed. 이 파일이나 그 스크립트가 바뀌면 전부 실행.
#       · 최종 안전망: Release Build(운영 릴리스) 가 백엔드 전체 pytest + E2E 를 돈다.
#   - develop 직접 push(빠른 수정)·머지 push = 가벼운 검증만(전체 pytest 제외). 배포는 deploy-dev 가 담당.
#   - 같은 브랜치/PR 에서 새 실행이 시작되면 이전 실행은 취소한다.
# ─────────────────────────────────────────

name: CI — Feature Branch

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # SDD-229: 바뀐 파일로 실행할 잡·백엔드 테스트 범위를 고른다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.sel.outputs.frontend }}
      backend_mode: ${{ steps.sel.outputs.backend_mode }}
      backend_tests: ${{ steps.sel.outputs.backend_tests }}
      pg: ${{ steps.sel.outputs.pg }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경 파일 → 실행 범위 선택
        id: sel
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # PR 은 base 와 합친 머지 커밋이 체크아웃된다 → 첫 부모(base) 대비 = PR 변경분
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > "$RUNNER_TEMP/changed.txt"
          else
            # 비교 기준이 없으면 전부 실행
            echo ".github/workflows/ci-feature.yml" > "$RUNNER_TEMP/changed.txt"
          fi
          echo "변경 파일 $(wc -l < "$RUNNER_TEMP/changed.txt")개"
          python3 scripts/test-changed --ci --files-from "$RUNNER_TEMP/changed.txt"

  frontend:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Type Check
        run: |
          cd frontend
          npx tsc -b --clean 2>/dev/null; true
          npx tsc --noEmit

      - name: Lint
        # lint 부채 정리 완료(0건) — 차단 게이트로 승격.
        # exhaustive-deps·only-export-components도 error로 올렸다.
        run: |
          cd frontend
          npx eslint src/

      - name: Build
        run: |
          cd frontend
          echo "VITE_API_BASE_URL=https://dev-api.mindbreeze.looxidlabs.com/api/v1" > .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
          npm run build

      - name: Test
        # 브라우저/E2E 테스트(Playwright, dev 서버 5175 fetch)는 별도 E2E 작업 대상.
        # 이 게이트는 단위 테스트 중심이지만 스위트가 혼재돼 있어 비차단으로 전환.
        continue-on-error: true
        run: |
          cd frontend
          npm test -- --passWithNoTests

  backend:
    # 전체 pytest(약 25분)는 PR 게이트에서만, 백엔드가 바뀌었을 때만 실행한다. develop push 는 건너뛴다.
    # SDD-229: backend_mode=related 면 관련 테스트 파일만, full 이면 전체.
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend_mode != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF system deps
        # deploy-dev.yml과 동일 — WeasyPrint(Cairo/Pango/HarfBuzz) + 한글 폰트.
        # libharfbuzz-subset0이 없으면 @font-face NotoSansKR 로드가 실패해
        # 페이지 수가 어긋나 test_real_pdf_metric_pages가 깨진다.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-cjk

      - name: Install
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Test
        env:
          MODE: ${{ needs.changes.outputs.backend_mode }}
          TESTS: ${{ needs.changes.outputs.backend_tests }}
        run: |
          cd backend
          # test_real_pdf_metric_pages는 정확 4페이지 검증으로 macOS 보정된 내용이
          # Linux 폰트 메트릭에서 3~5페이지로 어긋나 422를 띄움. Linux 재보정 전까지 제외.
          DESELECT=--deselect=tests/test_sdd070_pdf_metrics.py::test_real_pdf_metric_pages
          read -ra SELECTED <<< "$TESTS"
          if [ "$MODE" = "related" ] && [ "${#SELECTED[@]}" -gt 0 ]; then
            echo "관련 테스트만 실행: ${#SELECTED[@]}개 파일"
            # 선택 목록에 해당 파일이 없으면 deselect 인자가 무시된다
            pytest -q --tb=short "$DESELECT" "${SELECTED[@]}"
          else
            pytest -q --tb=short --ignore=tests/test_sprint4_integration.py "$DESELECT"
          fi

  backend-pg-smoke:
    # SDD-211(P1): 테스트는 SQLite create_all 이라 마이그레이션이 CI 어디서도 PostgreSQL 로 실행되지 않았다.
    # 빈 PG 에 alembic 체인을 처음부터 적용해 head 단일성·적용 가능성을 확인한다.
    # 이 잡 실패 = dev 배포(deploy-dev.yml)에서도 마이그레이션이 실패한다. 차단 효력은 브랜치 보호의
    # 필수 상태 점검 등록(저장소 설정)이 있어야 생긴다 — deploy-dev 는 ci-feature 를 needs 하지 않는다.
    # SDD-229: backend/app·alembic·tests/pg·requirements 가 바뀌었을 때만 실행한다.
    needs: [changes]
    if: needs.changes.outputs.pg == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # 운영 RDS 는 PostgreSQL 16 이다.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # 비밀 없음. alembic env.py 가 읽는 환경변수는 DATABASE_URL 하나뿐이다(비밀번호에 % 금지).
      DATABASE_URL: postgresql://postgres:ci_pw@127.0.0.1:5432/smoke
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install (alembic 최소 패키지 — 버전은 requirements.txt 와 동일)
        run: |
          pkgs=$(grep -i -E '^(sqlalchemy|alembic|psycopg2-binary|pydantic|pydantic-settings|python-dotenv)==' requirements.txt)
          test "$(echo "$pkgs" | wc -l)" -eq 6
          pip install $pkgs

      - name: alembic head 는 정확히 1개
        run: |
          heads=$(alembic heads 2>/dev/null)
          echo "$heads"
          test "$(echo "$heads" | grep -c '(head)')" -eq 1

      - name: 빈 DB 에 alembic upgrade head
        run: |
          alembic upgrade head
          current=$(alembic current 2>/dev/null | grep -oE '^[0-9a-z]+')
          head=$(alembic heads 2>/dev/null | grep -oE '^[0-9a-z]+')
          echo "current=$current head=$head"
          test -n "$head" && test "$current" = "$head"
          python - <<'PY'
          import os
          import sqlalchemy as sa
          with sa.create_engine(os.environ["DATABASE_URL"]).connect() as conn:
              rows = conn.execute(sa.text("select version_num from alembic_version")).fetchall()
          assert len(rows) == 1, rows
          print("alembic_version:", rows[0][0])
          PY

      - name: PG 제약·마이그레이션 결과 테스트 (pg 마커)
        # 루트 conftest(SQLite 전용, fakeredis 등)를 불러오지 않도록 --confcutdir 로 tests/pg 만 쓴다.
        # PG_SMOKE=1 + 로컬 PostgreSQL DATABASE_URL 일 때만 실행되며 기본 `pytest -q` 에서는 skip 된다.
        env:
          PG_SMOKE: '1'
        run: |
          # SDD-214: 생성 경로·초기화 PG 테스트는 앱 코드(app.*)를 import 하므로 전체 의존성이 필요하다.
          pip install -r requirements.txt
          pytest --confcutdir=tests/pg tests/pg -q -m pg -p no:cacheprovider

      - name: PG 픽스처 위생 (스키마 덤프에 데이터 행·개인정보 없음)
        run: python tests/fixtures/pg/check_fixture_hygiene.py

      - name: 스냅샷 복원본 + 합성 시드 + upgrade head (덤프 픽스처가 커밋되면 실행)
        # SDD-211 P2 자리. baseline_*.sql(스키마 전용 덤프)이 아직 없으면 건너뛴다 — 덤프 생성은 dev DB 읽기가 필요해
        # Brian go 후 수행한다. 덤프의 \restrict 메타 명령은 러너 psql 버전에 따라 오류가 나므로 걸러서 복원한다.
        if: ${{ hashFiles('backend/tests/fixtures/pg/baseline_*.sql') != '' }}
        run: |
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client
          test "$(ls tests/fixtures/pg/baseline_*.sql | wc -l)" -eq 1
          base=$(ls tests/fixtures/pg/baseline_*.sql)
          admin="${DATABASE_URL%/*}/postgres"
          snap="${DATABASE_URL%/*}/smoke_snap"
          psql "$admin" -v ON_ERROR_STOP=1 -c "create database smoke_snap"
          grep -v -E '^\\(un)?restrict ' "$base" | psql "$snap" -v ON_ERROR_STOP=1 -q
          psql "$snap" -v ON_ERROR_STOP=1 -q -f tests/fixtures/pg/seed_synthetic.sql
          # SDD-214: 055 가드는 비템플릿 세션이 남아 있으면 중단한다 → 배포 절차와 같이 데이터 초기화(Z) 후 적용한다.
          python scripts/reset_dev_data.py --scope all --apply --i-understand-this-deletes-data --database-url "$snap" > /dev/null
          DATABASE_URL="$snap" alembic upgrade head
          current=$(DATABASE_URL="$snap" alembic current 2>/dev/null | grep -oE '^[0-9a-z]+')
          head=$(alembic heads 2>/dev/null | grep -oE '^[0-9a-z]+')
          echo "snapshot current=$current head=$head"
          test -n "$head" && test "$current" = "$head"

      - name: alembic check (정보성 — 모델↔마이그레이션 드리프트 건수)
        # 검출 전용 명령이라 마이그레이션을 생성하지 않는다. 현재 드리프트가 있어 차단하면 모든 PR 이 빨개지므로
        # 건수만 기록한다(continue-on-error). 드리프트 정리 후 건수 상한을 두는 차단 승격은 후속.
        continue-on-error: true
        run: |
          set +e
          alembic check > "$RUNNER_TEMP/alembic-check.log" 2>&1
          rc=$?
          set -e
          count=$(grep -c 'alembic.autogenerate.compare.*Detected' "$RUNNER_TEMP/alembic-check.log" || true)
          echo "alembic check rc=$rc, 감지 ${count}건"
          grep 'alembic.autogenerate.compare.*Detected' "$RUNNER_TEMP/alembic-check.log" | sed 's/^.*\] Detected /- /' || true
          {
            echo "### alembic check (정보성)"
            echo "모델↔마이그레이션 드리프트 감지 **${count}건** (rc=${rc}). 차단 승격은 드리프트 정리 후."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit $rc
