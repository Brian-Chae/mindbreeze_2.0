<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MIND BREEZE 새 주소 안내</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
         background: #f5f3fb; color: #2b2540; }
  main { width: min(520px, calc(100% - 40px)); background: #fff; border-radius: 20px; padding: 40px 32px;
         box-shadow: 0 8px 30px rgba(80, 60, 140, .10); text-align: center; }
  .badge { display: inline-block; font-size: 13px; font-weight: 600; color: #6b4fc4; background: #eee9fb;
           padding: 6px 12px; border-radius: 999px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { margin: 8px 0; line-height: 1.7; font-size: 15px; color: #4a4360; }
  .go { display: block; margin: 24px 0 8px; padding: 14px 16px; border-radius: 12px; background: #6b4fc4; color: #fff;
        font-weight: 700; text-decoration: none; word-break: break-all; }
  small { display: block; margin-top: 22px; color: #9a94b0; font-size: 12px; }
</style>
</head>
<body>
<main>
  <span class="badge">주소가 바뀌었어요</span>
  <h1>MIND BREEZE가 새 주소로 이전했어요</h1>
  <p>이 주소는 더 이상 사용하지 않아요.<br>아래 새 주소로 접속해 주세요.</p>
  <a class="go" href="@@NEW_URL@@">@@NEW_URL@@ 로 이동</a>
  <p>새 주소에서는 <b>다시 로그인</b>해야 해요.<br>메일로 받은 예전 링크는 새 주소에서 다시 열어 주세요.</p>
  <small>MIND BREEZE · Looxid Labs</small>
</main>
</body>
</html>
