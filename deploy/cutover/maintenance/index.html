<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>서비스 점검 중 · MIND BREEZE</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
         background: #f5f3fb; color: #2b2540; }
  main { width: min(520px, calc(100% - 40px)); background: #fff; border-radius: 20px; padding: 40px 32px;
         box-shadow: 0 8px 30px rgba(80, 60, 140, .10); text-align: center; }
  .badge { display: inline-block; font-size: 13px; font-weight: 600; color: #6b4fc4; background: #eee9fb;
           padding: 6px 12px; border-radius: 999px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { margin: 8px 0; line-height: 1.7; font-size: 15px; color: #4a4360; }
  .time { margin: 22px 0; padding: 16px; border-radius: 14px; background: #faf9fe; border: 1px solid #e7e2f7; }
  .time strong { display: block; font-size: 17px; color: #2b2540; }
  .time span { font-size: 13px; color: #7a7394; }
  a { color: #6b4fc4; font-weight: 600; word-break: break-all; }
  small { display: block; margin-top: 22px; color: #9a94b0; font-size: 12px; }
</style>
</head>
<body>
<main>
  <span class="badge">서비스 점검 안내</span>
  <h1>더 안정적인 서비스를 위해 점검하고 있어요</h1>
  <p>지금은 서비스 이전 작업을 하고 있어서 잠시 이용할 수 없어요.<br>불편을 드려 죄송해요.</p>
  <div class="time">
    <strong>2026년 10월 22일(목) 오전 2시 ~ 3시</strong>
    <span>점검이 끝나는 대로 바로 이용하실 수 있어요</span>
  </div>
  <p>점검이 끝나면 아래 새 주소로 접속해 주세요.<br>새 주소에서는 <b>다시 로그인</b>해야 해요.</p>
  <p><a href="@@NEW_URL@@">@@NEW_URL@@</a></p>
  <small>MIND BREEZE · Looxid Labs</small>
</main>
</body>
</html>
