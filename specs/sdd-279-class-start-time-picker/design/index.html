<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDD-279 시작 시각 시안 비교</title><style>body{margin:0;padding:24px;background:#160c22;color:#f7f4f0;font:15px/1.5 system-ui}h1{font-size:24px}button,a{min-width:44px;min-height:44px;padding:12px 20px;background:#35233e;color:inherit;border:1px solid #b373ef;border-radius:16px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#5f0080}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.gallery{display:flex;gap:24px;overflow:auto;align-items:start}.pair{flex:none}.frames{display:flex;gap:16px;align-items:start}.frame{overflow:hidden;border:1px solid #796185;border-radius:24px;background:#0d0814}iframe{border:0;display:block;width:100%;height:100%}.desktop{width:768px;height:540px}.desktop iframe{width:1280px;height:900px;transform:scale(.6);transform-origin:0 0}.mobile{width:390px;height:844px}h2{font-size:18px}a{display:inline-block;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #d2aefc} [hidden]{display:none!important}</style><h1>클래스 만들기 · 시작 시각 빠른 선택</h1><p>오후 7:00 → 오전 9:00을 직접 눌러 비교하세요. 데스크톱 1280×900 (60% 축소) · 모바일 390×844 (원본 크기).</p><nav aria-label="시안 비교"><button data-view="a" aria-pressed="true">A 스테퍼</button><button data-view="b" aria-pressed="false">B 칩</button><button data-view="c" aria-pressed="false">C 목록</button><button data-view="all" aria-pressed="false">세 안 나란히</button></nav><div class="gallery"><section class="pair" data-option="a" ><h2>A. 시·분 분리 스테퍼</h2><p><a href="option-a.html">A 단독으로 열기</a></p><div class="frames"><div class="frame desktop"><iframe title="A 데스크톱" src="option-a.html"></iframe></div><div class="frame mobile"><iframe title="A 모바일 390px" src="option-a.html"></iframe></div></div></section><section class="pair" data-option="b" hidden><h2>B. 빠른 시각 칩 + 미세 조정</h2><p><a href="option-b.html">B 단독으로 열기</a></p><div class="frames"><div class="frame desktop"><iframe title="B 데스크톱" src="option-b.html"></iframe></div><div class="frame mobile"><iframe title="B 모바일 390px" src="option-b.html"></iframe></div></div></section><section class="pair" data-option="c" hidden><h2>C. 네이티브 목록 선택</h2><p><a href="option-c.html">C 단독으로 열기</a></p><div class="frames"><div class="frame desktop"><iframe title="C 데스크톱" src="option-c.html"></iframe></div><div class="frame mobile"><iframe title="C 모바일 390px" src="option-c.html"></iframe></div></div></section></div><script>document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('.pair').forEach(x=>x.hidden=b.dataset.view!=='all'&&x.dataset.option!==b.dataset.view)})</script></html>
