# ──────────────────────────────────────────
# MIND BREEZE 2.0 — Nginx Dev 환경
# dev.mindbreeze.looxidlabs.com     → FE
# dev-api.mindbreeze.looxidlabs.com → BE
# ──────────────────────────────────────────

# HTTP → HTTPS redirect (WebSocket는 직접 프록시)
server {
    listen 80;
    server_name dev.mindbreeze.looxidlabs.com dev-api.mindbreeze.looxidlabs.com;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # WebSocket — HTTP도 직접 프록시 (redirect loop 방지)
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 86400;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Frontend
server {
    listen 443 ssl;
    server_name dev.mindbreeze.looxidlabs.com;

    ssl_certificate     /etc/letsencrypt/live/dev.mindbreeze.looxidlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.mindbreeze.looxidlabs.com/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# HTTPS — API
server {
    listen 443 ssl;
    server_name dev-api.mindbreeze.looxidlabs.com;

    ssl_certificate     /etc/letsencrypt/live/dev.mindbreeze.looxidlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.mindbreeze.looxidlabs.com/privkey.pem;

    # WebSocket (Socket.IO)
    location /socket.io/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
