# ──────────────────────────────────────
# MIND BREEZE 2.0 — Dev Environment
# docker compose -f docker/docker-compose.dev.yml up -d
# ──────────────────────────────────────

services:
  backend:
    image: mindbreeze-dev-be:latest
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mindbreeze-dev-be
    env_file:
      - ../backend/.env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - mindbreeze-dev

  # INFRA-14: Celery 워커 — docker dev 에서도 비동기 파이프라인(STT·요약·리포트·영상 병합)이
  #   소비되도록 systemd 배포(mindbreeze-worker.service)와 동일한 진입점을 추가한다.
  worker:
    image: mindbreeze-dev-be:latest
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mindbreeze-dev-worker
    command: celery -A app.core.celery_app:celery_app worker --loglevel=INFO --prefetch-multiplier=1
    env_file:
      - ../backend/.env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - mindbreeze-dev

  # INFRA-14: 이메일 전용 워커 — email 큐(app.tasks.report_email_task:email_app)를 소비한다.
  #   메인 워커와 큐를 분리해야 서로의 태스크를 가로채지 않는다(systemd mindbreeze-email-worker 와 동일).
  email-worker:
    image: mindbreeze-dev-be:latest
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mindbreeze-dev-email-worker
    command: celery -A app.tasks.report_email_task:email_app worker -Q email --loglevel=INFO --concurrency=2
    env_file:
      - ../backend/.env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - mindbreeze-dev

  # INFRA-14: export 전용 워커 — exports 큐(tasks.generate_data_export/cleanup_data_exports)를 소비한다.
  #   이 워커가 없으면 data export 요청이 소비자 없이 영구 pending 된다(systemd mindbreeze-export-worker 와 동일).
  export-worker:
    image: mindbreeze-dev-be:latest
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mindbreeze-dev-export-worker
    command: celery -A app.core.celery_app:celery_app worker -Q exports --concurrency=1 --prefetch-multiplier=1 --hostname=exports@%h --loglevel=INFO
    env_file:
      - ../backend/.env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - mindbreeze-dev

  # INFRA-14 / INFRA-08: beat(스케줄러) 서비스.
  #   주의 — 현재 celery_app 에는 beat_schedule 이 없다(INFRA-08: 주기 작업 단일 소스는 OS cron).
  #   즉 이 beat 는 스케줄이 없어 no-op 이며, 서비스 정합을 위해 포함한다. 스케줄을 재도입하면
  #   OS cron 과 이중 실행되므로(INFRA-08) 둘 중 하나만 활성화해야 한다.
  beat:
    image: mindbreeze-dev-be:latest
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mindbreeze-dev-beat
    command: celery -A app.core.celery_app:celery_app beat --loglevel=INFO
    env_file:
      - ../backend/.env.dev
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - mindbreeze-dev

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: mindbreeze-dev-fe
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mindbreeze-dev

  nginx:
    image: nginx:alpine
    container_name: mindbreeze-dev-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certbot/webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - mindbreeze-dev

  postgres:
    image: postgres:16-alpine
    container_name: mindbreeze-dev-db
    environment:
      POSTGRES_USER: mindbreeze
      POSTGRES_PASSWORD: mindbreeze_dev_2026
      POSTGRES_DB: mindbreeze_dev
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindbreeze -d mindbreeze_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - mindbreeze-dev

  redis:
    image: redis:7-alpine
    container_name: mindbreeze-dev-redis
    restart: unless-stopped
    networks:
      - mindbreeze-dev

  livekit:
    image: livekit/livekit-server:v1.8
    command: --config /etc/livekit.yaml
    # 포트매핑 없음 — nginx가 Docker 내부망으로 프록시
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped
    networks:
      - mindbreeze-dev

networks:
  mindbreeze-dev:
    driver: bridge

volumes:
  pgdata_dev:
